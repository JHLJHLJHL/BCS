pencil-fine)",fill:"hsl(var(--gold))",stroke:"none",fontFamily:"ui-monospace, monospace",fontSize:"6",opacity:"0.8",children:[(0,o.jsx)("text",{x:"9.5",y:"16",opacity:"0.7",children:"79"}),(0,o.jsx)("text",{x:"30.5",y:"33",children:"\xa7"})]})]})}w.displayName=k.gb.displayName;var L=s(5153);let N=[{number:1,titleEn:"The Public Defender",titleKo:"시즌 1 \xb7 국선 변호사 시절",years:"2015",summary:"《브레이킹 배드》가 시작되기 6년 전, 2002년의 앨버커키. 싸구려 사건을 전전하는 국선 변호사 지미 맥길이 형 척의 그늘과 자기 안의 '슬리핑 집'을 사이에 두고 흔들린다. 사울 굿맨이 되기까지의 첫 열 걸음.",episodes:[{id:"s01e01",season:1,episode:1,titleEn:"Uno",titleKo:"우노",airDate:"2015-02-08",writers:"빈스 길리건 \xb7 피터 굴드",director:"빈스 길리건",logline:"흑백 화면의 어느 먼 미래에서 시작해, 2002년의 국선 변호사 지미 맥길에게로 돌아온다.",plot:["흑백 화면. 네브래스카 오마하의 쇼핑몰 시나본 매장에서 한 남자가 반죽을 만다. 밤에는 커튼을 치고 옛 테이프를 돌려 본다. 화면 구석에 자신이 광고에 나오던 시절의 영상이 스치고, 남자는 운다. 이름도 과거도 지운 채 숨어 사는 사람의 하루다.","2002년 앨버커키. 지미 맥길은 사건당 700달러를 받는 국선 변호사다. 법원 화장실에서 변론을 연습하고, 베트남 네일 살롱 뒷방을 사무실로 쓰며, 낡은 스즈키 에스팀을 몬다. 형 척은 한때 대형 로펌 HHM을 세운 전설적 변호사지만 지금은 '전자기 과민증'으로 전기를 끊은 집에 틀어박혀 있다. 지미는 형에게 식료품과 신문을 날라 준다.","지미는 공금 160만 달러를 횡령한 카운티 재무관 크레이그 케틀먼 사건을 따내려 한다. 손쉽게 고객을 끌 요량으로 스케이트보드를 타는 쌍둥이 사기꾼을 고용해 교통사고 연기를 시키지만, 표적 차량의 운전자가 엉뚱한 사람이었다. 쌍둥이를 쫓아 찾아간 집의 문이 열리고, 그 앞에 선 것은 멕시코 카르텔의 투코 살라망카다."],titleMeaning:["'Uno'는 스페인어로 '하나'다. 시리즈의 첫 회이자, 앞으로 이 세계의 절반을 지배할 카르텔의 언어로 붙인 제목이다. 《베터 콜 사울》은 시즌마다 스페인어\xb7숫자\xb7관용구를 제목으로 끌어와, 지미의 영어권 세계와 살라망카의 스페인어권 세계가 같은 도시에서 포개져 있음을 제목 층위에서부터 보여 준다.","동시에 'Uno'는 혼자라는 뜻이기도 하다. 형의 그늘 아래, 대형 로펌의 바깥에서, 아무도 자신을 진지하게 봐 주지 않는 자리에서 시작하는 한 남자의 이야기다. 가장 먼저 등장하는 장면이 미래의 완전한 고립(가명으로 숨어 사는 '진')이라는 점에서, 제목은 그가 끝내 도달할 '혼자'를 처음부터 예고한다."],trivia:[{source:"제작 배경",text:"《브레이킹 배드》에서 조연이던 변호사 사울 굿맨의 스핀오프다. 빈스 길리건과 피터 굴드는 처음엔 30분짜리 코미디를 구상했지만, 과거 이야기를 파고들수록 비극이 되어 한 시간짜리 정극으로 바뀌었다."},{source:"팬덤 논의",text:"흑백으로 처리된 시나본 오프닝은 '현재' 시점이다. 《브레이킹 배드》 이후, 모든 것을 잃고 도피 중인 시간선을 색을 빼는 방식으로 표시한다. 이 흑백 콜드 오픈은 이후 여러 시즌의 문을 여는 장치가 된다."},{source:"IMDb Trivia",text:"지미의 차 스즈키 에스팀은 운전석 문짝만 색이 다른 상태로 등장한다. 가난과 임시변통을 한눈에 보여 주는 소품으로, 팬들 사이에서 캐릭터를 상징하는 물건이 되었다."},{source:"팬 커뮤니티",text:"오마하의 가명 '진 터카빅'과 시나본이라는 설정은 《브레이킹 배드》 시절 사울이 체포되면 '네브래스카에서 시나본 점장이나 하고 있을 것'이라 농담하던 대사에서 그대로 가져온 것이다."}],redditQuestions:[{question:"맨 앞 흑백 장면의 시나본 남자는 누구인가?",answer:"지미와 같은 얼굴이지만 '진 터카빅'이라는 다른 이름으로, 훨씬 나중 시점에 오마하에서 숨어 사는 사람이다. 이 회차는 그가 어쩌다 거기까지 갔는지는 전혀 보여 주지 않는다. 다만 색을 뺀 화면과 커튼을 친 방으로, 이 이야기의 종착지가 밝은 곳이 아니라는 것만 먼저 알려 준다."},{question:"척은 왜 전기를 끊고 사나?",answer:"스스로 '전자기 과민증'이라 부르는 증상 때문이다. 전기\xb7전자기기가 몸에 통증을 준다고 믿어 집의 두꺼비집을 내리고 랜턴으로 생활한다. 이 회차는 증상이 진짜인지 아닌지에 대해 판단을 유보한 채, 형제가 서로를 어떻게 돌보고 어떻게 짐이 되는지만 보여 준다."}],quotes:[{speaker:"지미 맥길",en:"These kids... they made a mistake. One mistake. We're not talking murderers here.",ko:"이 아이들은 실수를 한 겁니다. 딱 한 번요. 살인자 얘기를 하는 게 아니에요.",context:"10대 셋을 변호하는 법정 변론이다. 혼신을 다해 '한 번의 실수'를 호소하지만, 곧이어 검사가 그 '실수'가 무엇인지 사진으로 보여 주면서 변론은 우스꽝스럽게 무너진다. 지미가 가진 재능과 그 재능이 놓인 바닥을 동시에 보여 주는 첫 장면이다."}],reception:["2015년 2월 8일 《워킹 데드》 중간 복귀편 뒤에 편성된 첫 방송은 약 690만 명이 보았고, AMC는 이를 당시 기준 '케이블 역사상 최대 규모의 시리즈 데뷔'로 발표했다. 원작의 후광과 밥 오덴커크를 주연으로 끌어올린 전환이 맞물린 결과였다.","평단은 코미디 조연을 비극의 주인공으로 다시 세운 선택을 호평했다. (개별 매체 점수와 순위는 이 사이트에서 별도로 대조하지 않았다. 아래 '확인 못 한 사실' 참고.)"],sketches:[{motif:"suzuki-esteem",caption:"운전석 문짝만 색이 다른 차",slot:"plot"},{motif:"cinnabon",caption:"흑백으로 시작하는 오마하의 아침",slot:"trivia"}]},{id:"s01e02",season:1,episode:2,titleEn:"Mijo",titleKo:"미호",airDate:"2015-02-09",writers:"피터 굴드",director:"미셸 매클래런",logline:"사막 한복판에서 목숨을 걸고 변론한다. 재능이 처음으로 사람을 살린다.",plot:["쌍둥이 사기꾼은 투코의 할머니 집을 건드린 대가로 붙잡히고, 지미도 자루를 뒤집어쓴 채 사막으로 끌려간다. 투코는 세 사람을 그 자리에서 처리하려 한다. 지미는 말로 승부한다. 쌍둥이는 자신이 고용한 사기꾼일 뿐이며, 이건 '예의의 문제'라고 투코의 언어로 협상한다.","지미는 사형을 다리 하나 부러뜨리는 것으로 깎는 데 성공한다. 변호사의 재능이 법정 밖, 가장 야만적인 자리에서 처음으로 사람을 살린 순간이다. 돌아온 지미는 토할 것 같은 표정으로 다시 국선 사건 더미 앞에 앉는다.","한편 지미는 손쉬운 돈의 맛을 떨치지 못한다. 그는 다시 사기와 법 사이의 경계를 서성이고, 네일 살롱 뒷방의 좁은 사무실에서 자신이 어느 쪽 사람인지 가늠한다. 나초 바르가라는 이름의 침착한 청년이 그 모든 과정을 멀리서 지켜보고 있었다."],titleMeaning:["'Mijo'는 스페인어 'mi hijo'(내 아들)를 줄인 애칭이다. 극 중에서 투코의 할머니가 투코를 부르는 말이자, 카르텔이라는 세계가 겉으로는 가족의 언어로 돌아간다는 것을 드러내는 단어다.","가장 폭력적인 인물이 '아들'이라는 다정한 호칭으로 불린다는 아이러니가 이 회차의 핵심이다. 지미가 투코를 설득하는 방식도 결국 '가족\xb7예의\xb7체면'이라는 카르텔의 문법을 읽어 낸 덕분이다. 영어로 법을 다루던 남자가 스페인어의 세계에서 살아남는 법을 배우는 첫 수업이다."],trivia:[{source:"제작 배경",text:"투코 살라망카는 《브레이킹 배드》 초반의 광포한 마약상으로, 배우 레이먼드 크루스가 같은 배역을 다시 연기했다. 프리퀄이 원작 인물을 더 이른 시점에서 다시 데려오는 방식의 첫 사례다."},{source:"팬덤 논의",text:"사막에서 지미가 투코와 벌이는 협상 장면은 이 시리즈의 정체성을 확정한 순간으로 꼽힌다. 총이 아니라 말로 형량을 흥정하는 변호사, 그것이 지미 맥길이다."},{source:"IMDb Trivia",text:"에피소드는 시즌 1에서 유일하게 전편 바로 다음 날(2월 9일) 방영됐다. AMC가 데뷔의 열기를 이어 가려고 이틀 연속 편성을 택한 것이다."}],redditQuestions:[{question:"지미는 어떻게 투코를 설득했나?",answer:"쌍둥이가 저지른 것이 '모욕'이라는 틀을 받아들이되, 그 대가가 죽음이면 과하다고 투코 자신의 명예 감각에 호소했다. 결국 '다리 하나씩'으로 합의한다. 법정에서 형량을 깎듯, 사막에서 목숨값을 깎은 셈이다."}],quotes:[{speaker:"지미 맥길",en:"I talked you down from a death sentence to six months probation. I'm the best lawyer ever.",ko:"사형에서 6개월 집행유예까지 깎아 줬잖아. 내가 역사상 최고 변호사라니까.",context:"사막에서 살아 돌아온 뒤, 자기 자신에게 던지는 자조 섞인 허세다. 실제로 그가 깎은 것은 형량이 아니라 부러질 뼈의 개수였다. '최고 변호사'라는 농담은 이후 그가 집착하게 되는 자기 이미지의 씨앗이 된다."}],sketches:[{motif:"desert-horizon",caption:"자루를 벗은 자리의 지평선",slot:"plot"},{motif:"nail-salon",caption:"다시 돌아온 뒷방 사무실",slot:"meaning"}]},{id:"s01e03",season:1,episode:3,titleEn:"Nacho",titleKo:"나초",airDate:"2015-02-16",writers:"토머스 슈나우즈",director:"테리 맥도너",logline:"케틀먼 부부가 사라진다. 지미는 아는 것을 말해야 할지 사이에 선다.",plot:["나초 바르가가 지미에게 접근한다. 케틀먼이 빼돌린 160만 달러를 자신이 가로채겠다며, 변호사인 지미에게 '그냥 못 본 척만 하라'고 제안한다. 지미는 거절하지만, 위험을 알리려 케틀먼 부부에게 익명으로 경고 전화를 건다.","다음 날 케틀먼 일가가 집에서 흔적 없이 사라진다. 나초가 납치범으로 지목되어 체포되고, 그는 유치장에서 지미에게 연락해 자신은 결백하다고, 진짜 알리바이를 대신 증명하라고 압박한다. 익명 전화를 건 지미는 이제 자신이 사건의 한복판에 들어와 있음을 깨닫는다.","지미는 케틀먼 부부가 스스로 사라졌다고 직감하고, 가족이 숨었을 만한 곳을 홀로 추적한다. 숲속에서 그가 찾아낸 것은, 횡령한 현금을 끌어안은 채 '우리는 피해자'라고 우기는 케틀먼 가족이다. 법이 닿지 않는 곳에서 사람들이 어떻게 자기합리화를 하는지, 지미는 거울을 보듯 바라본다."],titleMeaning:["제목은 이 회차에서 본격 등장하는 인물 나초 바르가의 이름이다. 겉으로는 조용한 카르텔 중간책이지만, 가장 머리가 잘 돌아가고 가장 인간적인 축에 속하는 인물이다.","지미의 영어권 이야기(케틀먼 사건)와 카르텔의 스페인어권 이야기가 '나초'라는 한 사람을 통해 처음으로 교차한다. 제목에 사람 이름을 건 것은, 이 세계에서 사건보다 사람이 먼저라는 이 시리즈의 태도를 보여 준다."],trivia:[{source:"제작 배경",text:"나초 바르가 역의 마이클 맨도는 원래 한두 시즌 조연으로 기획됐으나, 배우의 연기가 호평받으며 비중이 크게 늘어 시리즈의 중심 비극 중 하나로 성장했다."},{source:"팬덤 논의",text:"지미가 익명으로 경고 전화를 거는 장면은 그의 양면성을 압축한다. 사건을 돈으로 바꾸고 싶어 하면서도, 사람이 다치는 것은 막으려 한다. 이 모순이 5시즌 내내 지미를 괴롭힌다."},{source:"팬 커뮤니티",text:"케틀먼 가족이 숲에서 '캠핑 중이었다'고 우기는 장면은 팬덤에서 자기기만의 교과서로 자주 인용된다. 돈을 끌어안고도 자신을 피해자라 믿는 모습이 훗날 지미 자신의 변명들과 겹쳐 읽힌다."}],redditQuestions:[{question:"케틀먼 부부는 정말 납치된 건가?",answer:"아니다. 스스로 짐을 싸서 숲으로 달아난 것이다. 횡령한 돈을 지키려고 '피해자 행세'를 택했고, 그 바람에 애먼 나초가 납치범으로 몰렸다. 지미가 직접 숲에서 돈을 끌어안은 가족을 찾아내며 진상이 드러난다."}],quotes:[{speaker:"지미 맥길",en:"You're now a part of this, whether you like it or not.",ko:"좋든 싫든, 넌 이제 이 일에 엮인 거야.",context:"나초에게 하는 말이지만 사실은 지미 자신에게 돌아오는 말이다. 경고 전화 한 통으로 지미는 사건의 당사자가 되어 버렸다. 선의로 시작한 개입이 그를 더 깊은 곳으로 끌고 들어가는 이 시리즈의 전형적 구조다."}],sketches:[{motif:"cucumber-water",caption:"HHM 로비의 오이 물",slot:"plot"},{motif:"pay-phone",caption:"익명으로 건 경고 한 통",slot:"trivia"}]},{id:"s01e04",season:1,episode:4,titleEn:"Hero",titleKo:"히어로",airDate:"2015-02-23",writers:"제니퍼 허치슨",director:"콜린 벅시",logline:"지미가 자기 얼굴을 건 광고판으로 세간의 주목을 산다. 들키기 위해 꾸민 사고처럼.",plot:["케틀먼에게서 '입막음'으로 받은 돈으로 지미는 자신을 꾸민다. 그리고 HHM의 하워드 햄린이 쓰는 광고 서체와 색을 그대로 베낀 대형 광고판을 세운다. 'JAMES M. McGILL'. 하워드는 상표 침해로 철거를 요구한다.","지미는 철거 현장에 지역 방송을 부른다. 광고판 위에서 작업하던 인부가 미끄러져 매달리고, 지미가 올라가 그를 구한다. 모든 것이 카메라 앞에서 벌어진다. 뉴스가 '광고판에 매달린 사람을 구한 변호사'를 보도하고, 전화가 쏟아진다. 사고는 연출이었다.","척은 동생이 또 요령으로 성과를 냈다는 것을 직감한다. 이 회차는 척의 증상이 단순한 질병 이상의 무언가—질투와 자기 서사가 얽힌 것—임을 처음으로 내비친다. 지미는 '정직하게 안 되면 눈에 띄게라도 한다'는 방식을 처음으로 대규모로 실험한다."],titleMeaning:["표면적으로는 '영웅'이다. 지미는 광고판 위의 인부를 구해 뉴스의 영웅이 된다. 하지만 그 영웅담 전체가 전화를 끌어오기 위해 설계된 가짜라는 점에서, 제목은 그대로 반어다.","이 시리즈의 제목 놀이가 본격적으로 작동하는 첫 회차다. 그럴듯한 단어를 걸어 놓고 그 반대를 보여 주는 방식—'영웅'이라 쓰고 '연출'을 보여 주는—은 지미가 훗날 사울 굿맨으로서 완성할 자기 포장술의 원형이다."],trivia:[{source:"팬덤 논의",text:"지미가 베낀 서체는 HHM의 로고 글꼴이다. 형의 회사를 모방해 주목을 끈 뒤, 그 분노를 다시 홍보로 되돌리는 2단 전략이 팬들 사이에서 '지미식 마케팅'의 교본으로 불린다."},{source:"IMDb Trivia",text:"광고판 구조 장면은 안전 와이어와 스턴트로 촬영됐고, 지역 방송 리포터까지 포함한 '극 중 생중계'를 한 호흡으로 보여 준다."},{source:"팬 커뮤니티",text:"회상 장면에서 어린 지미가 아버지의 가게에서 사기꾼에게 당하는 모습이 등장한다. '세상에는 양과 늑대가 있다'는 아버지의 순진함이 지미를 어느 쪽으로 밀었는지를 두고 긴 토론이 이어진다."}],redditQuestions:[{question:"광고판 사고는 진짜였나?",answer:"연출이었다. 지미가 인부를 고용해 매달리게 하고, 방송을 미리 불러 두었다. '위기에 처한 사람을 구하는 변호사'라는 그림을 만들어 공짜 홍보를 얻은 것이다. 선행처럼 보이지만 처음부터 끝까지 지미가 짠 각본이다."}],quotes:[{speaker:"지미 맥길",en:"You don't want to hit the pi\xf1ata, you're not gonna get the candy.",ko:"피냐타를 안 치면 사탕은 안 떨어져.",context:"위험을 감수해야 이득이 온다는 지미식 처세의 압축이다. 정공법 대신 눈길을 끄는 한 방으로 판을 뒤집는 그의 방식이 이 회차에서 처음 큰 성공을 거둔다."}],sketches:[{motif:"billboard",caption:"하워드의 서체를 베낀 광고판",slot:"plot"},{motif:"bus-bench-ad",caption:"얼굴을 파는 변호사",slot:"meaning"}]},{id:"s01e05",season:1,episode:5,titleEn:"Alpine Shepherd Boy",titleKo:"알파인 셰퍼드 보이",airDate:"2015-03-02",writers:"브래들리 폴",director:"니콜 캐슬",logline:"지미가 노인 유언 사건에서 뜻밖의 적성을 발견한다. 그리고 척이 병원에 실려 간다.",plot:["광고가 끌어온 손님들은 하나같이 괴짜다. 지폐를 발행하겠다는 독립국 자칭 노인, 성적인 기능을 더한 발명가. 그러나 지미는 그 사이에서 유언\xb7상속 사건, 특히 노인 고객을 다루는 데 자신이 능하다는 것을 발견한다. 샌드파이퍼 요양원의 한 할머니가 그 시작이다.","척이 집 밖으로 나왔다가 전자기에 노출되어 쓰러지고 병원에 실려 간다. 의사는 증상의 신체적 원인을 찾지 못한다. 의사가 몰래 병실의 전원을 넣어도 척은 반응하지 않았다—증상이 심인성일 가능성을 강하게 시사하는 장면이다.","하워드는 척을 시설에 보내는 편이 낫다고 넌지시 권하지만, 지미는 형을 집으로 데려온다. 전기를 끊은 어두운 집에서 형을 돌보는 일이 다시 지미의 몫이 된다. 재능을 찾은 기쁨과 형이라는 짐이 같은 회차 안에 나란히 놓인다."],titleMeaning:["'알파인 셰퍼드 보이'는 극 중 한 할머니가 사 모으는 험멜풍 도자기 인형의 이름이다. 산골 양치기 소년을 본뜬 값비싼 소품으로, 지미가 새로 발 들인 노인\xb7상속 사건의 세계를 대표하는 물건이다.","원래 대본상의 제목은 'Jell-O'였다고 전해진다. 바뀐 제목은 더 조용하고 구체적이다. 거대한 사건이 아니라 한 노인의 작은 도자기 컬렉션에서 지미가 자기 자리를 찾는다는 이 회차의 방향과 맞는다."],trivia:[{source:"팬덤 논의",text:"의사가 몰래 병실 계측기의 전원을 켰는데도 척이 알아차리지 못하는 장면은, 그의 '전자기 과민증'이 심인성임을 강하게 암시하는 핵심 증거로 늘 인용된다."},{source:"제작 배경",text:"이 회차에서 비중 있게 등장하는 노인 요양 시설 '샌드파이퍼'는 이후 시즌을 관통하는 집단소송의 축이 된다. 작은 유언 사건으로 보였던 것이 거대한 법률 분쟁으로 자란다."},{source:"IMDb Trivia",text:"광고를 보고 찾아온 괴짜 고객들—지폐를 찍겠다는 남자 등—은 짧게 지나가지만, 지미의 변호사로서의 '급'과 그가 끌어오는 세계의 결을 코믹하게 요약하는 장치로 자주 회자된다."}],redditQuestions:[{question:"척의 증상은 진짜 병인가?",answer:"이 회차까지의 묘사는 '신체적 원인은 없다'는 쪽을 강하게 가리킨다. 의사가 전원을 몰래 켜도 척이 반응하지 않기 때문이다. 다만 드라마는 아직 단정하지 않고, 믿음과 질병 사이의 모호함 자체를 척이라는 인물의 핵심으로 남겨 둔다."}],quotes:[{speaker:"척 맥길",en:"I'm not crazy!",ko:"난 미친 게 아니야!",context:"병원에서 자신을 변호하듯 내뱉는 말이다. 증상의 실체가 흔들릴수록 척은 더 강하게 자기 정상성을 주장한다. 이 외침은 척이라는 인물의 자존심과 두려움을 한 문장에 담는다."}],sketches:[{motif:"switch-tape",caption:"테이프로 막은 스위치",slot:"plot"},{motif:"gas-lantern",caption:"전기를 끊은 집의 불빛",slot:"trivia"}]},{id:"s01e06",season:1,episode:6,titleEn:"Five-O",titleKo:"파이브-오",airDate:"2015-03-09",writers:"고든 스미스",director:"애덤 번스타인",logline:"마이크의 과거가 처음으로 열린다. 아들의 죽음, 그리고 부정한 경찰들.",plot:["앨버커키 법원 주차장 요금 부스의 과묵한 노인 마이크 에르만트라우트가 이 회차의 중심이 된다. 필라델피아에서 온 형사들이 그를 찾아오고, 지미는 커피에 수면 성분을 섞어 증거를 빼내는 좀도둑 같은 일로 그를 돕는다.","회상으로 진실이 드러난다. 마이크는 부패한 필라델피아 경찰이었고, 역시 경찰이던 아들 매트가 부패에 가담하길 거부하자 동료 경찰들이 그를 죽였다. 마이크는 아들을 '마지막 순간에 흔들리게' 만든 것이 자신이라 믿는다—정직을 권한 것이 아들을 죽음으로 몰았다는 자책이다.","마이크는 아들을 죽인 경찰들을 스스로 처단하고 앨버커키로 숨어든 참이었다. 며느리에게 모든 것을 털어놓는 마지막 독백에서, 그는 자신이 아들을 '부수었다'고 말한다. 조용한 주차 부스 노인의 내부가 한 회차 만에 비극의 깊이로 열린다."],titleMeaning:["'Five-O'는 경찰을 가리키는 미국 속어다. 1968년 드라마 《하와이 파이브-오》에서 온 말로, 이 회차가 통째로 '경찰'에 관한 이야기임을 가리킨다.","제목이 가리키는 경찰은 둘이다. 아들을 죽인 부패 경찰들과, 그들을 처단한 또 다른 경찰 마이크. 선과 악이 같은 제복 안에 있다는 것이 이 회차의 핵심이고, 'Five-O'라는 건조한 속어는 그 둘을 굳이 구분하지 않는다."],trivia:[{source:"팬덤 논의",text:"마이크가 며느리에게 하는 마지막 독백은 조너선 뱅크스의 대표 연기로 꼽히며, 시리즈를 통틀어 가장 자주 '최고의 순간'으로 거론되는 장면 중 하나다."},{source:"제작 배경",text:"주연 두 사람(지미\xb7척)에서 벗어나 조연 한 명의 과거만으로 한 회차를 통째로 채운 첫 사례다. 이 구조가 성공하면서, 이후 마이크\xb7나초\xb7거스 등 주변 인물의 독립 서사가 시리즈의 큰 축이 된다."},{source:"IMDb Trivia",text:"조너선 뱅크스는 마이크 역으로 《브레이킹 배드》에 이어 이 시리즈에서도 에미상 후보에 반복적으로 올랐다."}],redditQuestions:[{question:"마이크의 아들은 왜 죽었나?",answer:"경찰이던 아들 매트가 부패한 동료들의 '관행'에 끝까지 가담하지 않자, 그 동료들이 그를 살해했다. 마이크는 아들에게 '다들 받는 돈이니 받으라'고 조언한 적이 있고, 그 조언이 아들을 망설이게 해 죽음에 이르게 했다고 자책한다."}],quotes:[{speaker:"마이크 에르만트라우트",en:"I broke my boy.",ko:"내가 내 아들을 부쉈어.",context:"며느리에게 모든 진실을 털어놓는 독백의 마지막 말이다. 부패를 받아들이라 권한 자신이 결국 정직했던 아들을 죽음으로 몰았다는 자책이다. 마이크라는 인물의 모든 침묵이 이 한 문장에서 풀린다."}],reception:["방영 당시부터 시즌 1의 정점으로 꼽혔고, 종영 후 정리된 '시리즈 최고 회차' 목록에서도 거의 빠지지 않고 상위권에 오른다. 특히 조너선 뱅크스의 독백 연기가 반복적으로 호평의 중심이 됐다. (구체적 평점\xb7순위 수치는 이 사이트에서 개별 대조하지 않았다.)"],sketches:[{motif:"parking-booth",caption:"법원 주차장의 요금 부스",slot:"plot"},{motif:"courthouse",caption:"제복 안의 선과 악",slot:"meaning"}]},{id:"s01e07",season:1,episode:7,titleEn:"Bingo",titleKo:"빙고",airDate:"2015-03-16",writers:"제니퍼 허치슨",director:"라리사 콘드래키",logline:"지미가 올바른 선택을 한다. 그리고 그 대가로 스스로를 가둔다.",plot:["케틀먼 부부가 다시 나타나 지미에게 변호를 맡기려 하자, 지미는 그들의 돈이 떳떳하지 않음을 알고 괴로워한다. 그는 결국 케틀먼이 횡령금을 반환하고 죗값을 받도록 유도하는 '올바른' 길을 택한다. 대가로 자신의 몫은 사라진다.","지미는 노인\xb7상속 전문 변호사로 자리 잡기 위해 넓은 새 사무실을 꿈꾼다. 요양원 봉사와 빙고 진행으로 고객 신뢰를 쌓으며, 자신에게도 번듯한 자리가 가능할지 가늠한다. 그러나 케틀먼 사건을 '정도'로 처리하면서 그 꿈의 자금이 날아간다.","척을 위한 봉사와 올바른 선택이 쌓이지만, 지미의 내면에는 '제대로 해도 남는 게 없다'는 쓴맛이 함께 쌓인다. 빙고 공이 굴러 나오는 숫자처럼, 지미의 운은 통제 밖에서 정해지는 것처럼 보인다."],titleMeaning:["'빙고'는 지미가 요양원에서 진행하는 게임이다. 노인 고객들과 신뢰를 쌓는 통로이자, 지미가 새로 찾은 세계의 소도구다.","동시에 '빙고!'는 '딱 맞았다'는 감탄사다. 모든 숫자가 맞아떨어지는 순간을 뜻하지만, 이 회차에서 지미의 패는 맞아떨어지지 않는다. 올바른 선택이 그를 원하는 자리로 데려다주지 않는다는 반어가 제목에 깔려 있다."],trivia:[{source:"팬덤 논의",text:"지미가 케틀먼 사건을 '정도'로 처리하는 선택은 그가 아직 사울이 아니라는 증거로 자주 인용된다. 옳은 일을 하고도 손해를 보는 경험이 쌓여 그를 다른 방향으로 민다는 해석이다."},{source:"제작 배경",text:"빙고를 진행하는 지미의 모습은 밥 오덴커크의 스탠드업\xb7즉흥 코미디 이력을 그대로 활용한 장면으로 꼽힌다. 노인 관객을 쥐락펴락하는 입담이 캐릭터의 핵심 재능이다."},{source:"팬 커뮤니티",text:"지미가 꿈꾸던 넓은 사무실은 이후 그의 커리어 궤적을 재는 하나의 지표가 된다. 그 공간을 끝내 어떻게 얻고 잃는지가 팬들의 반복 관전 포인트다."}],quotes:[{speaker:"지미 맥길",en:"The Kettlemans... they have no idea how lucky they are that I'm their lawyer.",ko:"케틀먼 부부는 내가 자기들 변호사인 게 얼마나 행운인지 모른다니까.",context:"올바른 합의를 끌어낸 뒤의 혼잣말에 가깝다. 자신이 옳은 일을 했다는 자부심과, 그 대가로 아무것도 얻지 못했다는 허탈함이 뒤섞여 있다."}],sketches:[{motif:"bingo-cage",caption:"굴러 나오는 숫자",slot:"plot"},{motif:"legal-pad",caption:"다시 비는 장부",slot:"trivia"}]},{id:"s01e08",season:1,episode:8,titleEn:"RICO",titleKo:"리코",airDate:"2015-03-23",writers:"고든 스미스",director:"콜린 벅시",logline:"지미가 거대한 집단소송의 실마리를 잡는다. 그리고 척이 되살아난다.",plot:["지미는 샌드파이퍼 요양원이 노인 입주자들에게 조직적으로 과다 청구를 해 왔다는 정황을 발견한다. 쓰레기통까지 뒤져 서류를 모은 그는, 이것이 연방 'RICO'(조직범죄처벌법) 사건으로 키울 수 있는 거대한 건임을 직감한다.","자료를 검토하던 척이 변호사의 눈빛을 되찾는다. 전기를 끊은 집에서 랜턴과 종이만으로 두 형제는 밤새 서류를 파고든다. 법을 사랑하는 두 사람이 나란히 일하는, 시리즈에서 가장 따뜻한 장면 중 하나다. 척은 오랜만에 집 밖으로까지 나선다.","사건이 HHM 규모로 커지자 하워드는 지미를 밀어내려 하고, 지미는 자신이 발굴한 사건에서 배제될 위기에 놓인다. 마지막 장면, 서류를 부치러 집 앞에 나온 척이 어떤 깨달음에 사로잡힌 듯 멈춰 선다. 형제의 밤이 끝나가고 있다는 불길한 신호다."],titleMeaning:["'RICO'는 미국의 조직범죄처벌법(Racketeer Influenced and Corrupt Organizations Act)의 약자다. 지미가 샌드파이퍼 사건을 단순 과다청구가 아니라 조직적 범죄로 몰아갈 법적 무기를 가리킨다.","약자 하나로 된 제목은, 지미가 처음으로 '큰 법'의 세계에 손을 뻗는 회차임을 건조하게 못 박는다. 작은 유언 사건에서 시작한 것이 연방법 사건으로 자라나는 전환점이다."],trivia:[{source:"팬덤 논의",text:"척이 서류를 받아 들고 변호사로 되살아나는 장면은 이 형제가 '함께 일할 때 가장 행복하다'는 것을 보여 주는 동시에, 그 행복이 곧 깨질 것임을 예고하는 전환점으로 읽힌다."},{source:"제작 배경",text:"샌드파이퍼 집단소송은 이후 여러 시즌에 걸쳐 지미와 HHM, 그리고 돈의 흐름을 좌우하는 장기 플롯으로 기능한다. 이 회차가 그 씨앗을 심는다."},{source:"팬 커뮤니티",text:"마지막, 척이 집 앞 보도에 멈춰 서는 장면의 의미를 두고 첫 방영 당시 추측이 쏟아졌다. 그가 무엇을 깨달았는지는 다음 회차에서 밝혀진다."}],quotes:[{speaker:"척 맥길",en:"It's a RICO case.",ko:"이건 RICO 사건이야.",context:"동생이 모아 온 서류 더미를 훑어본 척이, 오랜 침체를 뚫고 변호사의 직감을 되찾으며 내뱉는 말이다. 이 한마디로 작은 사건이 거대한 소송으로 바뀌고, 두 형제의 밤샘 작업이 시작된다."}],sketches:[{motif:"legal-pad",caption:"쓰레기통에서 건진 서류",slot:"plot"},{motif:"newspaper-stack",caption:"랜턴 아래 쌓인 종이",slot:"meaning"}]},{id:"s01e09",season:1,episode:9,titleEn:"Pimento",titleKo:"피멘토",airDate:"2015-03-30",writers:"토머스 슈나우즈",director:"토머스 슈나우즈",logline:"형이 동생을 가로막은 진짜 이유가 드러난다. 가장 가까운 사람의 배신.",plot:["샌드파이퍼 사건이 HHM과 공동으로 진행되지만, 하워드는 끝내 지미를 사건에서 배제한다. 지미는 분노하면서도 그 결정의 배후를 의심한다. 한편 마이크는 '험한 일'을 돕는 일을 처음으로 맡아, 약물 거래 경호에서 총 없이 침착함만으로 상황을 장악한다.","지미는 하워드가 아니라 척이 자신을 막아 왔음을 알게 된다. 척은 '지미는 변호사가 되어선 안 된다'고 믿어 왔다. 동생의 재능은 인정하지만, 법을 장난감처럼 다루는 그가 진짜 변호사 자격을 갖는 것을 견딜 수 없었던 것이다.",'형제의 대결 장면에서 척은 끝내 속내를 쏟아낸다. "넌 변호사가 아니야, 원숭이한테 기관총을 쥐여 준 거지." 지미는 형이 자신을 한 번도 동료로 본 적이 없음을 깨닫는다. 돌아오는 차 안에서, 그는 무언가가 끝났음을 안다.'],titleMeaning:["'피멘토'는 마이크의 서브플롯에 등장하는, 그가 챙겨 먹는 피멘토 치즈 샌드위치에서 온 제목이다. 총 대신 샌드위치를 꺼내 무심히 베어 무는 마이크의 침착함이 그 장면의 핵심이다.","작고 평범한 음식 이름을 제목으로 삼은 선택은, 이 회차의 진짜 폭발—형제의 결별—을 일부러 비껴간다. 가장 큰 사건에 가장 사소한 이름을 붙이는 방식으로, 드라마는 배신의 충격을 더 조용하고 아프게 남긴다."],trivia:[{source:"팬덤 논의",text:"척의 대사 '원숭이에게 기관총을 쥐여 줬다'는 시리즈 전체에서 가장 잔인한 대사로 꼽힌다. 형이 동생을 어떻게 보고 있었는지가 한 문장에 담긴다."},{source:"제작 배경",text:"지미와 척의 대결 장면은 밥 오덴커크와 마이클 매킨의 긴 2인 연기로, 거의 연극처럼 한 공간에서 전개된다. 두 배우의 연기가 시즌 1의 평가를 끌어올린 핵심으로 거론된다."},{source:"팬 커뮤니티",text:"마이크가 총 없이 샌드위치를 먹으며 거래를 장악하는 장면은, 폭력의 세계에서도 그의 무기가 '머리와 침착함'임을 보여 주는 대표 장면으로 반복 인용된다."}],redditQuestions:[{question:"지미를 막은 건 하워드가 아니라 척이었나?",answer:"그렇다. 하워드는 척의 뜻을 대신 집행하는 '악역 연기'를 맡고 있었을 뿐이다. 지미가 변호사가 되는 것을 막아 온 진짜 장본인은 형 척이다. 동생의 재능을 알면서도, 그가 법조인으로 인정받는 것을 견디지 못했다."}],quotes:[{speaker:"척 맥길",en:"You're not a real lawyer... Slippin' Jimmy with a law degree is like a chimp with a machine gun.",ko:"넌 진짜 변호사가 아니야. 법학 학위를 쥔 슬리핑 지미는 기관총을 든 침팬지라고.",context:"형제의 결별이 터지는 순간이다. 척은 동생을 늘 사기꾼 '슬리핑 지미'로 보아 왔음을 끝내 실토한다. 이 말이 지미를 사울 굿맨 쪽으로 미는 가장 결정적 한 방으로 꼽힌다."}],reception:["형제 대결 장면을 중심으로 시즌 1의 또 다른 정점으로 꼽힌다. 밥 오덴커크와 마이클 매킨의 2인 연기, 그리고 마이크의 '피멘토 샌드위치' 장면이 함께 호평받았다. (개별 매체 점수\xb7순위는 이 사이트에서 대조하지 않았다.)"],sketches:[{motif:"pimento-sandwich",caption:"총 대신 샌드위치",slot:"plot"},{motif:"space-blanket",caption:"형이 두른 담요 안의 진심",slot:"meaning"}]},{id:"s01e10",season:1,episode:10,titleEn:"Marco",titleKo:"마르코",airDate:"2015-04-06",writers:"피터 굴드",director:"피터 굴드",logline:"시카고로 돌아가 옛 사기꾼 친구와 마지막으로 논다. 그리고 갈림길 앞에 선다.",plot:["형의 배신에 무너진 지미는 모든 것을 버리고 고향 시카고로 돌아간다. 옛 사기 파트너 마르코와 재회해, 바에서 낯선 이들을 속이는 '슬리핑 지미' 시절의 사기를 다시 벌인다. 일주일 내내 두 사람은 젊은 시절처럼 거리를 홀린다.","마지막 사기 도중 마르코가 심장마비로 쓰러져 죽는다. 친구는 '내 인생 최고의 한 주였다'는 말을 남긴다. 지미는 다시 앨버커키로 돌아갈 결심을 하고, 샌드파이퍼 사건으로 큰 로펌에 정식 합류할 기회가 그를 기다린다.","그러나 주차장에 도착한 지미는, 차에서 내리기 직전 멈춘다. 그는 '옳은 길'로 가는 대신 차를 돌린다. \"다시는 나를 막는 일이 없게 하겠어.\" 떳떳한 자리를 눈앞에서 포기하고, 지미는 자기 방식대로 가기로 한다. 사울 굿맨으로 가는 문이 여기서 열린다."],titleMeaning:["제목은 지미의 옛 사기 파트너이자 친구 마르코의 이름이다. 지미의 과거—'슬리핑 지미' 시절—를 의인화한 인물이고, 그의 죽음은 지미가 그 시절과 작별하는 동시에 그 시절로 돌아가는 역설을 만든다.","시즌을 사람 이름으로 닫는 것은 의미심장하다. 지미를 어느 방향으로도 밀 수 있었던 여러 힘 가운데, 결국 그를 결정한 것은 제도도 사건도 아니라 '한 친구와 보낸 한 주'였다. 가장 즐거웠던 시절이 그를 가장 위험한 선택으로 데려간다."],trivia:[{source:"팬덤 논의",text:"주차장에서 차를 돌리는 마지막 장면은 시즌 1 전체의 결론으로 꼽힌다. 지미가 '정도'를 눈앞에서 포기하는 순간이자, 사울 굿맨의 탄생을 예고하는 분기점이다."},{source:"제작 배경",text:"'슬리핑 지미'라는 별명과 시카고 시절의 사기 수법들은 이후 지미의 모든 선택을 이해하는 열쇠가 된다. 이 회차가 그 과거를 처음으로 길게 펼쳐 보인다."},{source:"팬 커뮤니티",text:"지미가 마지막에 흥얼거리는 노래와 '다시는 막히지 않겠다'는 혼잣말을 두고, 그가 이미 사울이 된 것인지 아직 아닌지에 대한 토론이 첫 방영 이래 끝나지 않고 있다."}],quotes:[{speaker:"지미 맥길",en:"I know what stopped me. And you know what? It's never stopping me again.",ko:"날 멈추게 한 게 뭔지 알아. 그리고 말이야, 다시는 그게 날 멈추게 두지 않을 거야.",context:"샌드파이퍼 사건으로 번듯한 로펌에 합류하러 가던 길, 주차장에서 차를 돌리며 하는 말이다. '옳은 길'을 포기하는 선언이자 시즌 1을 닫는 마지막 대사로, 사울 굿맨의 출발점으로 가장 자주 인용된다."}],reception:["시즌 피날레로서 지미의 전환점을 분명히 찍었다는 점에서 호평받았다. 밥 오덴커크는 이 시즌 연기로 이후 여러 시상식에서 주연으로 조명받기 시작했다. 《베터 콜 사울》은 이 첫 시즌부터 비평적 지지를 확고히 했지만, 역설적으로 시리즈 전체는 끝내 단 한 번도 에미상을 받지 못한다(본편 참조)."],sketches:[{motif:"matchbook",caption:"시카고 바의 마지막 사기",slot:"plot"},{motif:"suzuki-esteem",caption:"주차장에서 돌린 핸들",slot:"meaning"}]}]},{number:2,titleEn:"Davis & Main",titleKo:"시즌 2 \xb7 데이비스 앤 메인",years:"2016",summary:"지미가 번듯한 대형 로펌의 호화로운 자리를 얻지만, 그 옷이 몸에 맞지 않는다. 킴과의 거리, 형 척과의 전쟁, 그리고 서류 한 장을 고쳐 쓰는 작은 범죄가 돌이킬 수 없는 결과로 번진다.",episodes:[{id:"s02e01",season:2,episode:1,titleEn:"Switch",titleKo:"스위치",airDate:"2016-02-15",writers:"토머스 슈나우즈",director:"토머스 슈나우즈",logline:"지미가 호화로운 로펌 자리를 받아들인다. 그리고 그 규칙을 처음부터 비튼다.",plot:["지미는 샌드파이퍼 사건을 발판으로 대형 로펌 데이비스 앤 메인의 변호사가 된다. 회사 차(고급 세단), 코코볼로 원목 책상, 넓은 사무실이 주어진다. 그러나 첫날부터 그는 '끄고 나가라'는 사무실 스위치 경고문을 보란 듯이 무시한다—규칙에 길들지 않겠다는 작은 반항이다.","지미는 킴과 함께 고급 바에서 사기를 벌인다. '빅토르'와 '지젤'로 분해, 허세 가득한 투자자 켄에게 초고가 테킬라 사피로 아녜호를 연거푸 사게 만들고 계산서를 뒤집어씌운다. 둘에게 이 사기는 돈이 아니라 놀이이자, 서로에게만 통하는 언어다.","다음 날 지미의 책상에는 그 테킬라의 병마개가 전리품처럼 놓여 있다. 번듯한 자리와 몰래 즐기는 사기, 두 세계를 한 몸에 지닌 채 시즌이 시작된다. 지미는 아직 어느 쪽도 포기할 생각이 없다."],titleMeaning:["'Switch'는 일차적으로 지미가 무시하는 사무실 전등 스위치다. '끄고 나가라'는 규칙을 어기는 사소한 행동이, 규칙 전반을 향한 그의 태도를 요약한다.","동시에 'switch'는 전환이다. 국선 변호사에서 대형 로펌 변호사로, 지미에서 '빅토르'로, 정직에서 사기로—그는 끊임없이 두 모드를 오간다. 호화로운 사무실에서도 밤이면 바에서 사기를 치는 이 이중성이 시즌 2의 엔진이다."],trivia:[{source:"팬덤 논의",text:"지미와 킴이 켄에게 건 '사피로 아녜호' 사기에서, 그 켄은 《브레이킹 배드》에서 월터가 차를 폭발시킨 'KEN WINS' 번호판의 바로 그 허세남이라는 것이 팬덤의 정설이다. 두 시리즈가 같은 얼간이를 공유한다."},{source:"제작 배경",text:"병마개는 이후 킴의 책상 서랍에 간직되는 소품으로 이어진다. 두 사람의 관계가 '사기를 함께 치는 사이'라는 점을 말없이 보여 주는 물건이다."},{source:"IMDb Trivia",text:"오프닝 콜드 오픈에서 흑백의 '진'이 쓰레기장에 갇히는 장면이 등장한다. 벽에 'SG WAS HERE'를 새길까 망설이는 모습은, 지운 이름을 끝내 완전히 지우지 못하는 그의 상태를 보여 준다."}],redditQuestions:[{question:"'빅토르'와 '지젤'은 뭐 하는 사람들인가?",answer:"지미와 킴이 바에서 사기를 칠 때 쓰는 가짜 신분이다. 상대를 속여 비싼 술값을 떠안기는 즉흥극으로, 둘에게는 돈벌이라기보다 서로만 아는 놀이에 가깝다. 이 역할극이 두 사람 관계의 핵심 언어가 된다."}],quotes:[{speaker:"지미 맥길",en:"The universe is telling me to switch.",ko:"우주가 나한테 전환하라고 말하는 거야.",context:"규칙과 반항 사이에서 자기 행동을 합리화하는 지미식 농담이다. 스위치를 끄지 않는 사소한 반항을 거창한 운명론으로 포장하는 말버릇이, 그가 세상을 설득(하고 스스로를 설득)하는 방식의 축소판이다."}],sketches:[{motif:"zafiro-anejo",caption:"빅토르와 지젤의 술값",slot:"plot"},{motif:"cocobolo-desk",caption:"새 사무실의 원목 책상",slot:"trivia"}]},{id:"s02e02",season:2,episode:2,titleEn:"Cobbler",titleKo:"코블러",airDate:"2016-02-22",writers:"제니퍼 허치슨",director:"테리 맥도너",logline:"지미가 즉석에서 지어낸 '엽기 변명'으로 사건을 덮는다. 그리고 킴을 끌어들인다.",plot:["마약을 팔던 어수룩한 딜러 대니얼 웜월드(프라이스)가 나초에게 거래를 빼앗기고 경찰의 의심까지 산다. 집을 수색당할 위기에 처한 그를 위해, 지미는 경찰 앞에서 즉흥으로 기상천외한 변명을 지어낸다. 프라이스가 찍었다는 '파이 위에 앉는' 페티시 영상, 이른바 '스쿼트 코블러'다.","경찰은 민망함에 수색을 접고 물러난다. 지미의 입담이 또 한 번 사람을 구하지만, 이번엔 방식이 완전한 사기다. 코코볼로 책상이 놓인 번듯한 사무실의 변호사가 뒷골목의 거짓말로 문제를 '해결'한다.","킴은 지미가 이 일을 꾸미며 자신을 끌어들였다는 것을 알고 분노한다. 변호사로서 넘지 말아야 할 선을 지미가 아무렇지 않게 넘고, 자신까지 그 선 밖으로 데려간다는 것—이 긴장이 두 사람 사이에 처음으로 날을 세운다."],titleMeaning:["'코블러'는 과일을 넣어 구운 디저트이자, 지미가 지어낸 가짜 페티시 영상 '스쿼트 코블러'에서 온 말이다. 황당한 거짓말에 그럴듯한 전문 용어처럼 이름을 붙이는 것이 핵심 농담이다.","지미는 없는 사실을 '장르'와 '용어'로 포장해 진짜처럼 만든다. 이 능력—허구에 이름을 붙여 현실로 통용시키는 것—이 훗날 사울 굿맨의 핵심 기술이 된다. 가장 우스운 제목 뒤에 가장 중요한 성격 묘사가 숨어 있다."],trivia:[{source:"팬덤 논의",text:"'스쿼트 코블러'라는 가짜 용어를 지미가 즉석에서 지어내 경찰을 물리치는 장면은, 그의 즉흥 능력을 보여 주는 대표적 코믹 장면으로 꼽힌다."},{source:"제작 배경",text:"어수룩한 딜러 프라이스(대니얼)는 이후 마이크의 서브플롯과 얽히며, 마이크가 폭력의 세계로 더 깊이 들어가는 계기를 제공한다."},{source:"팬 커뮤니티",text:"킴이 '네가 날 끌어들였다'고 화를 내는 장면은, 두 사람 관계에서 반복될 근본 갈등—지미의 선 넘기가 킴을 어디까지 끌고 갈 것인가—의 첫 신호로 자주 인용된다."}],quotes:[{speaker:"지미 맥길",en:"You don't want a criminal lawyer. You want a 'criminal' lawyer.",ko:"'범죄 사건' 변호사가 필요한 게 아니라, '범죄자' 변호사가 필요한 거야.",context:"자신이 어떤 종류의 변호사인지 스스로 규정하는 말장난이다. 띄어쓰기 하나로 의미가 뒤집히는 이 농담은, 지미가 어느 쪽 세계에 속하게 될지를 미리 일러 준다."}],sketches:[{motif:"matchbook",caption:"즉석에서 지어낸 변명",slot:"plot"},{motif:"cocobolo-desk",caption:"번듯한 책상, 뒷골목의 거짓말",slot:"meaning"}]},{id:"s02e03",season:2,episode:3,titleEn:"Amarillo",titleKo:"아마릴로",airDate:"2016-02-29",writers:"조너선 글레이저",director:"스콧 위넌트",logline:"지미가 규칙을 어기고 광고를 찍는다. 성과는 나지만, 방식이 그를 고발한다.",plot:["샌드파이퍼 사건의 원고를 늘리기 위해, 지미는 요양원 버스에 올라 노인들에게 직접 접근한다. 효과는 크지만 변호사 윤리 규정에 어긋나는 호객이다. 데이비스 앤 메인은 TV 광고로 정식 홍보하길 원하지만 승인 절차가 느리다.","지미는 참지 못하고, 회사 승인 없이 직접 게릴라식으로 감성 광고를 찍어 지역 방송에 내보낸다. 전화가 쏟아지지만, 상사 클리프 메인은 절차를 무시한 독단에 분노한다. 성과를 내고도 방식 때문에 신뢰를 잃는, 지미의 반복되는 패턴이다.","척은 동생이 또 요령으로 일을 벌였음을 직감하고 광고의 출처를 캐기 시작한다. 한편 마이크는 손녀 케일리를 돌보며, 돈이 필요한 현실 때문에 '경호'라는 이름의 위험한 일을 조금씩 더 맡는다."],titleMeaning:["'아마릴로'는 텍사스의 도시로, 지미가 샌드파이퍼 원고를 모으러 버스를 세우는 곳이다. 노인들에게 직접 접근하는 호객의 현장이다.","지역 이름을 건조하게 내건 제목은, 지미의 '현장 영업'이 얼마나 물리적이고 발로 뛰는 일인지를 강조한다. 번듯한 로펌의 변호사가 버스에 올라 노인 한 명 한 명을 설득하는 거리의 감각이 제목에 담긴다."],trivia:[{source:"제작 배경",text:"지미가 직접 찍는 감성 광고는 밥 오덴커크의 코미디 이력을 활용한 장면으로, 조악하지만 효과적인 '지미표 광고'의 미학을 처음 길게 보여 준다."},{source:"팬덤 논의",text:"승인 없이 광고를 내보내는 선택은 지미가 조직의 규칙과 근본적으로 맞지 않는다는 것을 보여 준다. '성과는 내지만 방식이 문제'라는 구조가 시즌 내내 반복된다."},{source:"팬 커뮤니티",text:"마이크의 손녀 케일리를 향한 애정은 그의 모든 위험한 선택의 동기로 작동한다. 《브레이킹 배드》의 마이크를 이해하는 열쇠가 여기서부터 놓인다."}],quotes:[{speaker:"지미 맥길",en:"I just need to be me.",ko:"난 그냥 나답게 하면 돼.",context:"회사의 절차를 어기고 자기 방식대로 광고를 낸 것을 두고 하는 자기변호다. '나답게'라는 말이 곧 '규칙 바깥'을 뜻한다는 점에서, 지미의 자기합리화가 어떻게 작동하는지 보여 준다."}],sketches:[{motif:"bus-bench-ad",caption:"버스에 올라탄 호객",slot:"plot"},{motif:"billboard",caption:"승인 없이 내보낸 광고",slot:"meaning"}]},{id:"s02e04",season:2,episode:4,titleEn:"Gloves Off",titleKo:"글러브를 벗고",airDate:"2016-03-07",writers:"고든 스미스",director:"애덤 번스타인",logline:"마이크가 투코를 제거할 방법을 고른다. 총이 아니라, 맞는 쪽을.",plot:["마이크는 자신과 프라이스를 위협하는 투코 살라망카를 제거하기로 한다. 저격총까지 준비하지만, 살인은 또 다른 살인을 부른다는 것을 안다. 그는 다른 길을 택한다. 투코를 도발해 공공장소에서 자신을 폭행하게 만들고, 그 폭행으로 투코를 감옥에 보내는 것이다.","마이크는 맨몸으로 투코 앞에 서서 모욕을 거듭하고, 끝내 두들겨 맞는다. 경찰이 도착했을 때 투코의 손에는 총이, 바닥에는 마이크가 있다. 계획대로 투코는 체포된다. 마이크는 폭력을 쓰되 '최소한의 피'로 끝내는 자신만의 규칙을 세운다.","이 사건으로 투코의 삼촌 헥터 살라망카가 전면에 등장한다. 말을 못 하고 호출 벨로 의사를 전하는 노인이지만, 그 벨 소리 하나에 사람이 죽고 산다. 카르텔의 무게가 마이크의 세계로 성큼 들어온다. 한편 척은 지미의 광고 위반을 변호사회에 넘긴다."],titleMeaning:["'글러브를 벗고(Gloves Off)'는 '봐주지 않고 제대로 붙는다'는 관용구다. 마이크가 투코를 상대로 물러서지 않기로 한 결단을 가리킨다.","그러나 반어가 겹친다. 마이크는 글러브를 벗되 '때리기' 위해서가 아니라 '맞기' 위해 벗는다. 가장 영리한 폭력은 자신이 얻어맞는 것이라는 역설이, 마이크라는 인물의 냉정한 계산을 보여 준다."],trivia:[{source:"제작 배경",text:"헥터 살라망카는 《브레이킹 배드》에서 벨만으로 의사를 전하던 노인으로, 배우 마크 마골리스가 같은 배역을 다시 맡았다. 프리퀄은 그가 아직 말을 할 수 있던 더 이른 시점으로 거슬러 간다."},{source:"팬덤 논의",text:"마이크가 '맞기 위해' 글러브를 벗는 계획은, 그가 폭력을 쓰되 살인을 피하려는 원칙을 가진 인물임을 보여 주는 대표 장면이다. 이 원칙이 이후 반복적으로 시험대에 오른다."},{source:"팬 커뮤니티",text:"마이크가 반지를 끼고 투코를 도발하기 전, 거리를 재며 준비하는 과정의 디테일이 팬들 사이에서 '마이크식 작전'의 교본으로 자주 분석된다."}],quotes:[{speaker:"마이크 에르만트라우트",en:"The moment you decide to be a criminal... you've got a code.",ko:"범죄자가 되기로 결심한 순간, 넌 하나의 규칙을 갖게 돼.",context:"폭력의 세계에도 지켜야 할 선이 있다는 마이크의 신념이 드러나는 대목이다. 총을 쓰지 않고 상황을 끝내려는 그의 선택이 이 원칙에서 나온다."}],sketches:[{motif:"tio-bell",caption:"벨로 말하는 노인",slot:"plot"},{motif:"desert-horizon",caption:"저격 대신 고른 길",slot:"trivia"}]},{id:"s02e05",season:2,episode:5,titleEn:"Rebecca",titleKo:"레베카",airDate:"2016-03-14",writers:"앤 처키스",director:"존 시번",logline:"척의 옛 아내가 등장하며, 형제의 상처가 어디서 왔는지 드러난다.",plot:["지미의 광고 사건 여파로 킴이 책임을 뒤집어쓰고 지하 문서 검토실로 좌천된다. 킴은 묵묵히 그 벌을 견디며, 동시에 스스로의 길을 열기 위해 유력 고객 메사 베르데 은행을 직접 물어 온다. 지미에게 기대지 않고 자기 힘으로 올라서려는 결심이다.","회상 장면에서 척의 옛 아내 레베카가 등장한다. 아직 척의 '전자기 과민증'이 없던 시절, 가족 식사 자리에서 지미는 특유의 입담으로 레베카를 사로잡는다. 척은 동생이 노력 없이 사람들의 사랑을 얻는 것을 지켜보며 속으로 무너진다. 형의 질투가 언제부터 자라났는지를 보여 주는 열쇠다.","현재의 척은 킴에게 '지미를 조심하라'고 넌지시 경고한다. 그러나 킴은 자기 눈으로 본 지미를 믿는다. 척의 경고가 옳은지 그른지를 두고, 킴은 자신의 판단에 모든 것을 건다."],titleMeaning:["제목은 척의 옛 아내 레베카의 이름이다. 그녀는 짧게 등장하지만, 형제 사이의 오래된 상처가 어디서 비롯됐는지를 비추는 거울이 된다.","레베카 앞에서 지미는 쉽게 사랑받고 척은 애써도 겉돈다. 한 사람의 이름을 제목으로 걸어, 드라마는 척의 증상이 단순한 병이 아니라 '사랑받지 못한다는 오랜 감각'과 얽혀 있음을 암시한다."],trivia:[{source:"팬덤 논의",text:"식사 자리에서 지미가 농담으로 좌중을 사로잡고 척이 소외되는 회상은, 척의 질투가 질병보다 먼저 있었음을 보여 주는 핵심 증거로 인용된다."},{source:"제작 배경",text:"킴이 메사 베르데 은행을 스스로 끌어오는 전개는, 그녀가 지미의 조연이 아니라 독립된 야심을 가진 변호사임을 확정하는 전환점이다. 리아 시혼의 연기가 본격적으로 조명받기 시작한다."},{source:"팬 커뮤니티",text:"지미가 변호사 농담을 연달아 던지는 장면은 밥 오덴커크의 애드리브가 상당 부분 반영됐다는 이야기가 팬덤에서 반복 회자된다."}],quotes:[{speaker:"척 맥길",en:"Jimmy, when you're done... I'll turn it off myself.",ko:"지미, 네가 끝나면, 내가 직접 끌게.",context:"동생을 향한 척의 통제와 체념이 뒤섞인 대사다. 겉으로는 담담하지만, 동생을 믿지 못하면서도 놓지 못하는 형의 복잡한 감정이 배어 있다."}],sketches:[{motif:"cucumber-water",caption:"지하 문서 검토실로",slot:"plot"},{motif:"gas-lantern",caption:"병보다 먼저 있던 그늘",slot:"meaning"}]},{id:"s02e06",season:2,episode:6,titleEn:"Bali Ha'i",titleKo:"발리 하이",airDate:"2016-03-21",writers:"제니퍼 허치슨",director:"마이클 슬로비스",logline:"킴은 자기 길을 저울질하고, 마이크는 살라망카의 압박을 온몸으로 받는다.",plot:["킴은 여러 로펌에서 영입 제안을 받으며 자신의 가치를 확인한다. 안정된 길과 지미와 함께하는 불확실한 길 사이에서 저울질하지만, 밤이면 지미와 다시 바에 나가 '빅토르와 지젤' 사기를 벌이며 그 즐거움을 포기하지 못한다.","마이크에게 살라망카 쪽의 압박이 집요해진다. 어느 날 밤 집에서 잠을 깬 그는, 침대 머리맡에 놓인 쪽지를 발견한다. 누군가 집 안까지 소리 없이 들어왔다 나갔다는 뜻이다. 그를 찾아온 것은 말이 없는 살라망카 쌍둥이—소리 없이 다가와 모든 것을 멈출 수 있는 자들이다.","지미는 데이비스 앤 메인의 호화로운 삶이 자신에게 맞지 않음을 점점 분명히 느낀다. 번듯한 옷이 몸을 조여 오는 감각 속에서, 그는 자신이 어디에 속한 사람인지 다시 묻는다."],titleMeaning:["'발리 하이'는 뮤지컬 《남태평양》의 노래 제목으로, '닿을 수 없는 이상향'을 부르는 곡이다. 등장인물들이 각자 손에 잡히지 않는 삶을 그리는 이 회차의 정서를 가리킨다.","킴에게는 안정된 커리어가, 지미에게는 자유로운 자기 자신이, 마이크에게는 손녀와의 평온한 삶이 각각의 '발리 하이'다. 모두가 바라지만 아무도 온전히 닿지 못하는 섬—그 거리감이 제목에 담겨 있다."],trivia:[{source:"팬덤 논의",text:"침대 머리맡 쪽지로 쌍둥이의 침입을 알리는 연출은, 그들이 폭력을 쓰기 전에 '침묵'만으로 공포를 전한다는 점을 보여 준다. 《브레이킹 배드》의 쌍둥이를 아는 시청자에게는 특히 서늘하게 읽힌다."},{source:"제작 배경",text:"킴이 바에서 사기를 치며 느끼는 해방감은, 그녀가 '올바름'만으로 설명되지 않는 인물임을 보여 준다. 지미와 그녀가 왜 서로에게 끌리는지를 설명하는 핵심 장면으로 꼽힌다."},{source:"팬 커뮤니티",text:"살라망카 쌍둥이(레오넬\xb7마르코)는 《브레이킹 배드》에서 은빛 도끼와 침묵으로 각인된 인물들이다. 그들의 등장만으로 이 회차의 긴장이 한 단계 올라간다."}],quotes:[{speaker:"킴 웩슬러",en:"Maybe I don't want to walk away.",ko:"어쩌면 난 떠나고 싶지 않은 걸지도 몰라.",context:"안정된 길을 두고도 지미와의 불확실한 세계를 놓지 못하는 킴의 마음이 드러나는 대목이다. 그녀가 왜 번번이 지미 곁으로 돌아오는지를 가장 솔직하게 말한다."}],sketches:[{motif:"salamanca-twins",caption:"소리 없이 다녀간 자들",slot:"plot"},{motif:"parking-booth",caption:"압박을 견디는 밤",slot:"trivia"}]},{id:"s02e07",season:2,episode:7,titleEn:"Inflatable",titleKo:"인플레이터블",airDate:"2016-03-28",writers:"고든 스미스",director:"콜린 벅시",logline:"지미가 양이 아니라 늑대로 살기로 한다. 해고당하기 위해 일부러 최악이 된다.",plot:["회상 장면에서 어린 지미가 아버지의 가게를 본다. 아버지는 사기꾼에게 번번이 당하는 '양'이었고, 어린 지미는 그 순진함에 분노하며 몰래 가게 돈에 손을 댄다. '세상엔 늑대와 양이 있다'는 교훈이 그의 뿌리에 박힌다.","현재의 지미는 데이비스 앤 메인을 떠나기로 결심한다. 다만 제 발로 나가면 거액의 보너스를 포기해야 한다. 그래서 그는 '해고당하기' 위해 일부러 최악의 직원이 된다. 요란한 색의 양복, 사무실에서 백파이프 연주, 변기 물을 안 내리는 무례—회사가 견디다 못해 그를 내보내도록 만든다.","거리의 공기주입식 풍선 인형처럼, 지미는 몸에 맞지 않는 옷을 벗어던지고 자기 모습으로 부풀어 오른다. 킴과 그는 '각자 개업하되 사무실은 함께 쓰는' 동업을 상상한다. 지미는 다시 자유롭지만, 그 자유가 어느 방향을 향할지는 아직 정해지지 않았다."],titleMeaning:["'인플레이터블'은 거리의 공기주입식 풍선 인형이다. 바람을 넣으면 제멋대로 부풀어 춤추는 그 인형처럼, 지미가 억눌렸던 자기 본성을 되찾는 이 회차의 해방감을 가리킨다.","억지로 몸에 맞춘 정장(로펌의 규칙)을 벗고, 요란하고 통제되지 않는 본모습으로 돌아가는 전환이다. 사울 굿맨의 '요란함'이 이 풍선 인형의 이미지에서 시각적으로 예고된다."],trivia:[{source:"팬덤 논의",text:"지미가 해고당하려고 일부러 무례하게 구는 몽타주는 시리즈에서 가장 즐겨 인용되는 코믹 시퀀스 중 하나다. 요란한 색의 양복은 사울 굿맨 패션의 전조로 읽힌다."},{source:"제작 배경",text:"'늑대와 양' 회상은 지미의 도덕이 아버지의 순진함에 대한 반작용에서 자랐음을 보여 준다. 그가 왜 '당하느니 속이는 쪽'을 택하는지에 대한 심리적 뿌리다."},{source:"팬 커뮤니티",text:"지미와 킴이 사무실을 함께 쓰되 각자 개업하는 그림은, 두 사람 관계의 가장 행복한 가능성으로 자주 회자된다. 이 균형이 얼마나 오래 유지되는지가 관전 포인트다."}],quotes:[{speaker:"지미 맥길",en:"The wolf... or the sheep?",ko:"늑대냐, 양이냐.",context:"아버지의 순진함을 떠올리며 자신이 어느 쪽이 될지를 묻는 내면의 질문이다. 지미는 결국 '양이 되지 않겠다'는 쪽으로 기울고, 그 선택이 이 회차의 해방을 이끈다."}],sketches:[{motif:"inflatable-liberty",caption:"바람을 넣으면 부풀어 오르는",slot:"plot"},{motif:"matchbook",caption:"늑대와 양",slot:"meaning"}]},{id:"s02e08",season:2,episode:8,titleEn:"Fifi",titleKo:"피피",airDate:"2016-04-04",writers:"토머스 슈나우즈",director:"라리사 콘드래키",logline:"지미가 형을 무너뜨리기 위해 서류의 숫자 하나를 바꾼다.",plot:["킴이 메사 베르데 은행을 자기 고객으로 데려오려 하지만, 척과 하워드의 HHM이 그 고객을 가로챈다. 킴은 좌절하고, 지미는 형에게 분노한다. 그는 형을 무너뜨릴 방법을 찾는다.","지미는 HHM이 작성한 메사 베르데 지점 인가 서류를 몰래 손본다. 복사집에서 주소의 숫자를 '1261'에서 '1216'으로 바꿔치기해, 척이 규제 당국 앞에서 틀린 서류를 제출하게 만든다. 완벽주의자 척의 신용을 안에서부터 갉아먹으려는 치밀한 조작이다.","한편 마이크는 살라망카의 마약 운반 트럭을 노린다. 도로에 스파이크 호스를 깔아 트럭을 세우고 현금을 터는 계획을 세우며, 그 세계로 한 걸음 더 들어간다. 지미와 마이크, 두 사람 모두 '작은 조작'으로 큰 판을 흔들기 시작한다."],titleMeaning:["'피피(Fifi)'는 지미가 데려간 현장학습에서 등장하는 제2차 세계대전 B-29 폭격기의 애칭이다. 평화로운 박물관의 소품처럼 보이지만, 원래는 폭탄을 떨어뜨리던 무기다.","겉은 온화하고 속은 파괴적이라는 이 폭격기의 이중성이 회차의 주제와 겹친다. 지미가 복사집에서 조용히 바꾼 숫자 하나가, 피피처럼 나중에 큰 폭발을 일으킬 '시한장치'가 된다."],trivia:[{source:"팬덤 논의",text:"지미가 '1261'을 '1216'으로 바꾸는 서류 조작은 시즌 2의 핵심 사건이다. 작은 숫자 하나가 형제 전쟁의 방아쇠가 된다는 점에서, 시리즈에서 가장 많이 복기되는 조작 장면으로 꼽힌다."},{source:"제작 배경",text:"마이크가 도로에 스파이크 호스를 설치해 트럭을 터는 수법은, 그가 치밀한 '준비형 범죄자'임을 보여 주는 대표적 설정이다. 이 호스가 이후 사건의 실마리가 된다."},{source:"팬 커뮤니티",text:"복사집 장면에서 지미가 보여 주는 침착함과 꼼꼼함은, 그가 충동형이 아니라 '설계형' 사기꾼임을 보여 준다는 분석이 반복적으로 올라온다."}],redditQuestions:[{question:"지미가 메사 베르데 서류에서 정확히 무엇을 바꿨나?",answer:"지점 주소의 숫자를 '1261 로셀라'에서 '1216 로셀라'로 몰래 바꿔치기했다. 척이 규제 당국 앞에서 틀린 주소의 서류를 제출하게 만들어, 완벽주의자 형의 신용을 깎으려는 조작이다. 킴이 그 고객을 되찾을 길을 열려는 의도도 깔려 있다."}],quotes:[{speaker:"지미 맥길",en:"Chuck doesn't make mistakes.",ko:"척은 실수를 안 하지.",context:"바로 그 완벽함을 역이용하겠다는 뜻이 깔린 말이다. 지미는 형이 결코 틀리지 않는다는 평판을 무기로 삼아, 그 평판 자체를 무너뜨릴 덫을 놓는다."}],sketches:[{motif:"legal-pad",caption:"바뀐 숫자 하나",slot:"plot"},{motif:"desert-horizon",caption:"온화한 겉, 폭격기의 속",slot:"meaning"}]},{id:"s02e09",season:2,episode:9,titleEn:"Nailed",titleKo:"네일드",airDate:"2016-04-11",writers:"피터 굴드 \xb7 토머스 슈나우즈",director:"토머스 슈나우즈",logline:"척이 진실에 가까워진다. 그리고 쓰러진다.",plot:["척은 메사 베르데 서류의 오류가 자신의 실수가 아니라 조작임을 직감한다. 그는 복사집을 추적해 지미가 범인임을 입증할 증언을 거의 손에 넣는다. 지미의 범죄가 처음으로 형에게 들킬 위기에 놓인다.","마이크는 스파이크 호스로 살라망카의 트럭을 세우고 현금을 턴다. 그러나 그 과정에서 무고한 '선한 이웃' 운전자가 상황에 휘말린다. 마이크가 세운 '최소한의 피'라는 원칙이 처음으로 흔들리고, 그는 자신이 통제할 수 없는 결과를 마주한다.","척은 HHM 회의 중 메사 베르데 사건의 충격과 과로 속에서 정신을 잃고, 복사기 옆에서 쓰러지며 머리를 모서리에 부딪친다. 진실을 밝히기 직전의 척이 피를 흘리며 쓰러지고, 지미는 자신이 형을 어디까지 몰아붙였는지 깨닫지 못한 채 시즌의 마지막을 향한다."],titleMeaning:["'Nailed'는 '딱 잡았다/완벽히 해냈다'와 '못 박혔다/당했다'의 두 뜻을 겹친다. 척이 진실을 거의 '잡아낸' 것과, 그 과정에서 그가 '쓰러져 당하는' 것을 동시에 가리킨다.","지미 역시 서류 조작을 '완벽하게 해냈다'고 믿지만, 그 완벽함이 형을 쓰러뜨리는 못이 된다. 성공과 파멸이 한 단어 안에 포개지는, 이 시리즈 특유의 제목이다."],trivia:[{source:"팬덤 논의",text:"척이 복사집 점원을 추궁해 조작을 입증하려는 추적은, 완벽주의자의 집념을 보여 주는 동시에 그 집념이 자신을 어떻게 소진시키는지를 드러낸다."},{source:"제작 배경",text:"마이크의 트럭 강탈에 무고한 운전자가 휘말리는 전개는, 그의 '피를 최소화한다'는 원칙이 현실에서 얼마나 쉽게 깨지는지를 보여 주는 분기점으로 꼽힌다."},{source:"팬 커뮤니티",text:"척이 쓰러지는 마지막 장면을 두고, 지미의 조작이 어디까지 책임이 있는지에 대한 윤리 논쟁이 첫 방영 당시부터 이어졌다."}],quotes:[{speaker:"척 맥길",en:"He'll never give it up. He'll never change. Ever. Since he was nine.",ko:"그 녀석은 절대 안 그만둬. 절대 안 변해. 아홉 살 때부터 그랬어.",context:"지미가 조작의 범인임을 확신한 척이 쏟아내는 말이다. 동생을 향한 오랜 불신과 분노가 응축돼 있고, 그 집착이 곧 자신을 쓰러뜨리는 과로로 이어진다."}],sketches:[{motif:"space-blanket",caption:"진실 직전에 쓰러지다",slot:"plot"},{motif:"pay-phone",caption:"추적의 끝",slot:"trivia"}]},{id:"s02e10",season:2,episode:10,titleEn:"Klick",titleKo:"클릭",airDate:"2016-04-18",writers:"헤더 마리온 \xb7 빈스 길리건",director:"빈스 길리건",logline:"지미가 형을 위로하려 모든 것을 자백한다. 형은 그것을 녹음한다.",plot:["척의 머리 부상으로 지미는 죄책감에 시달린다. 병실과 집을 오가며 형을 돌보던 지미는, 전기를 끊은 어두운 집에서 척이 세상을 등지고 쇠약해지는 모습을 본다. 형을 안심시키기 위해, 지미는 메사 베르데 서류를 자신이 조작했다고 전부 털어놓는다.","지미는 형이 더는 자책하지 않도록, '네 실수가 아니라 내 짓이었다'고 고백한다. 형제애에서 나온 자백이다. 그러나 척은 그 순간을 기다리고 있었다. 소파 쿠션 밑에 숨겨 둔 녹음기가 지미의 자백을 전부 담아낸다.","한편 마이크는 트럭 강탈의 여파 속에서 헥터를 저격하려 한다. 사막에 자리를 잡고 조준하는 순간, 그의 차 앞유리에 끼워진 쪽지 하나가 그를 멈춰 세운다. 'DON'T'. 보이지 않는 누군가가 이미 이 판을 지켜보며 손을 쓰고 있다. 거스 프링의 그림자가 처음으로 드리운다."],titleMeaning:["'Klick'은 저격\xb7군사 용어로 1킬로미터를 뜻하는 속어이자, 녹음기 버튼이 눌리는 '딸깍' 소리이기도 하다. 마이크의 저격 서브플롯과 척의 녹음 장면을 하나의 소리로 묶는다.","두 개의 '클릭'이 시즌을 닫는다. 마이크가 끝내 누르지 못한 방아쇠와, 척이 몰래 누른 녹음 버튼. 한쪽은 멈춤이고 한쪽은 덫이다. 소리 하나로 두 세계의 긴장을 동시에 봉인하는 제목이다."],trivia:[{source:"팬덤 논의",text:"척이 지미의 자백을 녹음하는 반전은 시즌 2의 마지막을 뒤집는 충격으로 꼽힌다. 형제애에서 나온 고백이 법적 함정이었다는 점이 시즌 3 전체의 동력이 된다."},{source:"제작 배경",text:"마이크의 앞유리에 끼워진 'DON'T' 쪽지는 거스 프링이 개입하기 시작했다는 첫 신호다. 거스 본인은 아직 화면에 등장하지 않지만, 그의 통제가 이미 작동하고 있음을 보여 준다."},{source:"팬 커뮤니티",text:"빈스 길리건이 직접 연출한 이 피날레는, 척의 녹음과 마이크의 'DON'T'라는 두 갈고리로 다음 시즌을 걸어 두는 구조가 치밀하다는 평을 받는다."}],redditQuestions:[{question:"척은 왜 지미의 자백을 녹음했나?",answer:"지미의 서류 조작을 법적으로 입증할 증거가 없었기 때문이다. 척은 동생이 죄책감에 못 이겨 스스로 털어놓도록 상황을 만들고, 그 자백을 몰래 녹음기에 담았다. 형제애를 미끼로 삼은 함정이다."},{question:"마이크 차에 끼워진 'DON'T' 쪽지는 누가 뒀나?",answer:"이 회차는 범인을 직접 보여 주지 않는다. 다만 누군가 헥터를 '지금은' 죽게 두지 않으려 한다는 것만 분명하다. 마이크조차 모르는 더 큰 세력이 이 판을 조용히 관리하고 있다는 첫 신호다."}],quotes:[{speaker:"지미 맥길",en:"You were right. It was me. I did it.",ko:"형 말이 맞아. 나였어. 내가 그랬어.",context:"형을 안심시키려 서류 조작을 자백하는 순간이다. 진심 어린 고백이지만, 소파 밑 녹음기가 그 진심을 그대로 증거로 바꾼다. 시즌을 닫는 반전의 한가운데 놓인 대사다."}],sketches:[{motif:"gas-lantern",caption:"어두운 집에서의 자백",slot:"plot"},{motif:"switch-tape",caption:"딸깍, 눌린 두 개의 버튼",slot:"meaning"}]}]},{number:3,titleEn:"Chicanery",titleKo:"시즌 3 \xb7 속임수",years:"2017",summary:"형제 전쟁이 법정으로 간다. 척이 녹음한 자백을 무기로 꺼내 들고, 지미는 형의 가장 깊은 약점을 법정에서 폭로한다. 거스 프링이 등장해 마이크를 자기 판으로 끌어들이고, '사울 굿맨'이라는 이름이 처음으로 불린다.",episodes:[{id:"s03e01",season:3,episode:1,titleEn:"Mabel",titleKo:"메이블",airDate:"2017-04-10",writers:"빈스 길리건 \xb7 피터 굴드",director:"빈스 길리건",logline:"척은 녹음을 손에 쥐고, 마이크는 자신을 멈춰 세운 손의 정체를 쫓는다.",plot:["흑백의 오마하. 시나본 매장에서 숨어 지내던 '진'이 공황에 빠져 쓰러지고, 병원에서 가짜 신분이 들통날 뻔한다. 지운 이름으로 사는 삶이 언제든 무너질 수 있음을 보여 주는 콜드 오픈이다.","2003년. 척은 지미의 자백이 담긴 테이프를 손에 쥐었지만, 아직 쓰지 않는다. 지미는 형이 무엇을 가졌는지 모른 채 일상으로 돌아가려 한다. 킴과 함께 쓰는 사무실에서, 그는 정직한 변호사의 삶과 자기 본성 사이를 여전히 오간다.","마이크는 자신을 저격에서 멈춰 세운 'DON'T' 쪽지의 출처를 추적한다. 차를 분해하다시피 뒤진 끝에 연료 주입구 안에서 위치추적기를 발견한다. 그는 추적기를 역이용해, 자신을 감시하던 자가 누구인지 거꾸로 쫓기 시작한다. 한편 나초는 헥터의 심장약을 눈여겨본다."],titleMeaning:["'메이블'은 콜드 오픈의 흑백 장면에서 스치듯 등장하는 이름으로, '진'의 위태로운 현재를 여는 신호다. 과거와 현재가 겹쳐 흐르는 이 시리즈의 시간 구조를 상기시킨다.","거창한 사건명 대신 사소한 이름을 시즌 첫 회의 제목으로 삼은 것은, 가장 큰 운명(지미의 종착지)이 가장 작은 디테일 속에 이미 들어 있음을 암시한다. 흑백의 미래가 다시 한번 모든 이야기의 틀이 된다."],trivia:[{source:"제작 배경",text:"시즌마다 흑백 콜드 오픈으로 '진'의 현재를 먼저 보여 주는 구조가 이 시즌에서도 이어진다. 색의 유무로 시간선을 구분하는 연출이 시리즈의 서명과도 같은 장치가 되었다."},{source:"팬덤 논의",text:"마이크가 연료 주입구에서 추적기를 찾아내는 과정은 거의 대사 없이 긴 시간 전개된다. 조너선 뱅크스의 과묵한 연기와 절차의 디테일만으로 긴장을 만드는 시리즈의 특기가 집약된 장면으로 꼽힌다."},{source:"팬 커뮤니티",text:"나초가 헥터의 심장약에 주목하기 시작하는 이 시점이, 이후 길게 전개될 '약 바꿔치기' 계획의 출발점이라는 것이 재시청 때 분명해진다."}],redditQuestions:[{question:"마이크를 멈춰 세운 추적기는 누가 심었나?",answer:"이 회차에서 마이크는 추적기를 찾아내지만, 아직 그 배후를 확인하지는 못한다. 다만 자신을 감시하는 '보이지 않는 조직'이 실재한다는 것만은 분명해진다. 마이크는 추적기를 역이용해 그 배후를 거꾸로 추적하기로 한다."}],quotes:[{speaker:"마이크 에르만트라우트",en:"Somebody wants me to stay away from Hector.",ko:"누군가 내가 헥터한테서 떨어져 있길 바라는 거야.",context:"추적기와 'DON'T' 쪽지를 연결 지은 마이크의 결론이다. 자신보다 큰 세력이 이미 헥터를 '관리'하고 있다는 자각이, 그를 그 세력의 정체를 향해 밀어 넣는다."}],sketches:[{motif:"pill-capsule",caption:"주목받기 시작한 심장약",slot:"plot"},{motif:"cinnabon",caption:"흑백으로 열리는 현재",slot:"trivia"}]},{id:"s03e02",season:3,episode:2,titleEn:"Witness",titleKo:"증인",airDate:"2017-04-17",writers:"토머스 슈나우즈",director:"빈스 길리건",logline:"마이크의 추적이 한 치킨집 사장에게 닿는다. 그리고 척의 덫이 닫힌다.",plot:["마이크의 역추적은 로스 포요스 에르마노스라는 치킨 체인으로 이어진다. 매장을 지켜보던 마이크 앞에, 단정하고 예의 바른 점주 거스 프링이 모습을 드러낸다. 겉으로는 지역사회의 성실한 사업가, 속으로는 모든 것을 설계하는 자. 두 사람의 긴 관계가 여기서 시작된다.","지미는 척이 자신의 자백을 녹음한 테이프를 가지고 있다는 사실을 알게 된다. 분노한 그는 증인(에르네스토)을 통해 그 내용을 전해 듣고, 척의 집으로 쳐들어가 테이프를 부순다. 그러나 그 순간, 하워드가 증인으로 그 자리에 있었다. 지미의 침입과 파손 자체가 척이 쳐 놓은 덫이었다.","거스라는 새 얼굴과 척의 함정이 같은 회차에 놓인다. 한쪽에선 침묵으로 제국을 세우는 자가, 다른 한쪽에선 동생을 법으로 옭아매려는 형이 각자의 판을 완성한다."],titleMeaning:["'증인'은 두 겹이다. 마이크가 로스 포요스를 '지켜보는 증인'이 되는 것과, 하워드가 지미의 범행을 '목격하는 증인'으로 심어진 것.","지켜봄이 곧 함정이 되는 이 회차에서, 제목은 '보는 행위'의 양면을 가리킨다. 마이크의 감시는 거스라는 거대한 존재로 그를 끌어들이고, 척의 증인 배치는 지미를 법정으로 끌어낸다."],trivia:[{source:"제작 배경",text:"거스 프링 역의 지안카를로 에스포지토가 《브레이킹 배드》에 이어 같은 배역으로 돌아온 회차다. 치킨집 점주의 단정함 뒤에 숨은 냉혹함이 첫 등장부터 그대로 재현된다."},{source:"팬덤 논의",text:"척이 하워드를 증인으로 세워 둔 채 지미의 침입을 유도한 설계는, 녹음 함정(시즌 2)에 이은 두 번째 덫이다. 형제 전쟁이 법정으로 가는 결정적 장치다."},{source:"팬 커뮤니티",text:"마이크와 거스가 서로를 처음 인식하는 이 지점이, 두 인물의 긴 공조와 긴장의 출발점이라는 점에서 재시청 때 특히 의미가 커진다."}],redditQuestions:[{question:"지미가 테이프를 부쉈는데 왜 척에게 유리한가?",answer:"척이 하워드를 집에 증인으로 둔 채 지미를 자극했기 때문이다. 테이프의 '내용'보다 지미가 '남의 집에 침입해 물건을 부순 행위' 자체가 증언으로 남는다. 녹음은 사본이 또 있을 수 있고, 무엇보다 지미의 격한 반응 자체가 자백을 뒷받침한다."}],quotes:[{speaker:"거스 프링",en:"Is something wrong with your meal?",ko:"음식에 무슨 문제라도 있으십니까?",context:"매장을 감시하던 마이크에게 거스가 건네는 첫 말이다. 더없이 공손한 서비스업의 언어지만, 그 아래에는 '네가 나를 지켜보고 있다는 걸 안다'는 경고가 깔려 있다. 거스라는 인물의 이중성을 한 문장에 담는다."}],sketches:[{motif:"pollos-sign",caption:"치킨집 점주의 두 얼굴",slot:"plot"},{motif:"gas-lantern",caption:"증인이 앉아 있던 어두운 집",slot:"meaning"}]},{id:"s03e03",season:3,episode:3,titleEn:"Sunk Costs",titleKo:"매몰 비용",airDate:"2017-04-24",writers:"제니퍼 허치슨",director:"존 시번",logline:"지미가 기소되고, 마이크는 거스의 판에서 첫 수를 둔다.",plot:["척의 덫으로 지미는 주거침입\xb7증거인멸 등으로 기소된다. 변호사 자격이 위태로워진 그는 킴과 함께 방어를 준비한다. 형제의 다툼이 사적 영역을 넘어 지미의 커리어 전체를 겨누는 공적 재판으로 커진다.","거스는 마이크에게 '헥터를 직접 건드리지 말고 그의 사업을 흔들라'는 방향을 제시한다. 마이크는 사막 국경 도로의 전선 위에, 마약을 숨긴 신발을 던져 걸어 둔다. 헥터의 운반책 트럭이 그 구간을 지날 때 단속에 걸리도록, 보이지 않게 판을 흔드는 정교한 수다.","지미는 이미 쏟아부은 것—평판, 형과의 관계—을 포기하지 못해 더 깊이 들어간다. '여기까지 왔으니 멈출 수 없다'는 매몰 비용의 함정이, 법정을 앞둔 그를 더 위험한 선택으로 민다."],titleMeaning:["'매몰 비용(Sunk Cost)'은 이미 치러 돌이킬 수 없는 비용을 뜻하는 경제 용어다. 되돌릴 수 없는 것에 매여 더 나쁜 결정을 반복하는 심리를 가리킨다.","지미도 척도 서로에게 이미 너무 많은 것을 쏟아부어, 손해를 인정하고 물러서지 못한다. 거스의 판 역시 한 번 들인 수를 되돌릴 수 없다. 멈추지 못하는 사람들의 이야기에 꼭 맞는 제목이다."],trivia:[{source:"팬덤 논의",text:"마이크가 전선 위에 신발을 던져 거는 긴 시퀀스는 대사 없이 전개되며, '마이크식 정밀 작전'의 대표 장면으로 자주 꼽힌다."},{source:"제작 배경",text:"거스가 마이크에게 '직접 죽이지 말고 사업을 흔들라'고 지시하는 방식은, 폭력보다 통제를 앞세우는 거스식 전략의 전형이다."},{source:"팬 커뮤니티",text:"지미와 킴이 기소에 맞서 함께 전략을 짜는 과정은, 두 사람이 연인이자 법률 파트너로 묶여 가는 관계의 깊이를 보여 준다."}],quotes:[{speaker:"킴 웩슬러",en:"You're gonna fight this. And I'm gonna help you.",ko:"넌 이걸 끝까지 싸울 거고, 난 널 도울 거야.",context:"기소 앞에서 무너지려는 지미에게 킴이 건네는 다짐이다. 그녀가 지미의 싸움에 자기 커리어까지 걸기 시작한다는 점에서, 두 사람의 운명이 더 단단히 얽히는 지점이다."}],sketches:[{motif:"desert-horizon",caption:"전선 위에 걸린 신발",slot:"plot"},{motif:"courthouse",caption:"법정을 겨눈 기소",slot:"trivia"}]},{id:"s03e04",season:3,episode:4,titleEn:"Sabrosito",titleKo:"사브로시토",airDate:"2017-05-01",writers:"조너선 글레이저",director:"토머스 슈나우즈",logline:"헥터와 거스의 힘겨루기가 드러나고, 지미와 킴은 법정 전략을 세운다.",plot:["회상과 현재가 교차하며 헥터 살라망카와 거스 프링의 긴장이 드러난다. 헥터는 거스의 치킨 운송망을 자기 마약 운반에 쓰려 하고, 거스는 겉으론 순응하는 척하며 속으론 헥터를 끝낼 판을 짠다. 살라망카 쌍둥이가 거스의 매장에 들이닥쳐 힘을 과시한다.","마이크는 헥터의 거점을 털어 현금과 물건을 빼돌리고, 거스의 설계 안에서 움직인다. 폭력을 최소화하면서도 상대의 사업을 안에서 무너뜨리는 방식이 반복된다.","지미와 킴은 변호사회 청문회를 준비한다. 척의 자백 녹음이라는 결정적 증거 앞에서, 두 사람은 정면으로 반박하는 대신 '증거 그 자체가 아니라 그것을 내민 사람'을 겨누는 전략을 가다듬는다. 다음 회차의 폭로를 향한 포석이다."],titleMeaning:["'사브로시토'는 스페인어로 '아주 맛있는'이라는 뜻의 애칭이다. 로스 포요스의 음식과 광고 문구를 연상시키며, 거스의 '합법 사업'이라는 겉면을 가리킨다.","달콤한 치킨 광고 문구 뒤에서 벌어지는 카르텔의 힘겨루기—겉과 속의 대비가 제목에 압축돼 있다. 가장 맛있어 보이는 것이 가장 위험한 세계의 간판이라는 아이러니다."],trivia:[{source:"제작 배경",text:"살라망카 쌍둥이가 거스의 매장에 나타나는 장면은 《브레이킹 배드》의 은빛 도끼 쌍둥이를 아는 시청자에게 강한 긴장을 준다. 침묵과 위협만으로 공간을 장악하는 연출이 돋보인다."},{source:"팬덤 논의",text:"헥터와 거스의 반목은 《브레이킹 배드》에서의 복수극으로 이어지는 뿌리다. 이 회차가 두 사람 사이의 오랜 원한의 기초를 놓는다."},{source:"팬 커뮤니티",text:"지미와 킴이 청문회를 '증거가 아니라 증인을 겨냥한다'는 전략으로 전환하는 대목은, 다음 회차 'Chicanery'의 폭로를 위한 치밀한 설계로 재평가된다."}],quotes:[{speaker:"거스 프링",en:"I hide in plain sight, same as you.",ko:"나는 눈에 띄는 곳에 숨습니다. 당신처럼요.",context:"겉으로 멀쩡한 사업가 행세를 하며 범죄를 운영하는 자신의 방식을 드러내는 말이다. 합법의 가면 뒤에 숨는 거스의 전략이, 변호사 가면 뒤에 숨는 지미의 방식과 겹쳐 읽힌다."}],sketches:[{motif:"pollos-sign",caption:"달콤한 간판 뒤의 힘겨루기",slot:"plot"},{motif:"tio-bell",caption:"벨로 명령하는 노인",slot:"meaning"}]},{id:"s03e05",season:3,episode:5,titleEn:"Chicanery",titleKo:"속임수",airDate:"2017-05-08",writers:"고든 스미스",director:"대니얼 색하임",logline:"지미가 법정에서 형의 가장 깊은 비밀을 꺼낸다. 척이 스스로 무너진다.",plot:["변호사회 청문회가 열린다. 척의 녹음은 지미에게 치명적이지만, 지미와 킴은 녹음의 내용이 아니라 척의 '전자기 과민증'이라는 약점을 공략한다. 지미는 척이 증언하는 동안, 아무도 모르게 그의 상의 주머니에 충전된 배터리를 넣어 둔다.","증언대에서 척은 평소처럼 '전자기기 근처에선 괴롭다'고 단언한다. 그 순간 지미 측은, 척의 몸에 이미 몇십 분째 배터리가 들어 있었음을 폭로한다. 신체 반응이 없었다는 사실이 공개되자, 척은 증상이 심인성임을 눈앞에서 반박당한다.","자존심이 무너진 척은 증언대에서 이성을 잃고, 지미가 '1261을 1216으로 바꿨다'는 조작까지 스스로 장황하게 쏟아낸다. 통제된 완벽주의자가 공개 석상에서 무너지는 순간이다. 지미는 이겼지만, 형을 가장 깊은 곳에서 부쉈다."],titleMeaning:["'Chicanery'는 '교묘한 속임수\xb7궤변'을 뜻한다. 지미가 법정에서 쓴 배터리 트릭이자, 척이 평생 동생을 '속임수의 인간'이라 불러 온 바로 그 단어다.","제목은 형이 동생에게 붙인 낙인을, 동생이 형을 무너뜨리는 데 그대로 되돌려준다는 아이러니를 담는다. 척이 가장 경멸하던 '속임수'에 척 자신이 당하는, 시리즈에서 가장 잔혹하고 완성도 높은 한 수다."],trivia:[{source:"팬덤 논의",text:"지미가 척의 주머니에 배터리를 몰래 넣어 두는 설계는, 상대의 믿음 체계 자체를 증거로 뒤집는 방식이다. 시리즈 전체에서 가장 자주 '최고의 회차'로 거론되는 에피소드다."},{source:"제작 배경",text:"척이 증언대에서 무너지며 장황하게 쏟아내는 독백은 마이클 매킨의 대표 연기로 꼽힌다. 완벽주의자가 공개적으로 해체되는 과정을 한 호흡으로 보여 준다."},{source:"팬 커뮤니티",text:"레베카를 법정에 부른 설정이 척을 심리적으로 흔드는 또 다른 장치였다는 점이, 재시청 때 지미\xb7킴 전략의 치밀함으로 재평가된다."}],redditQuestions:[{question:"지미는 어떻게 척을 무너뜨렸나?",answer:"척이 증언하는 동안, 지미 측 사람이 몰래 그의 상의 주머니에 충전된 배터리를 넣어 두었다. 척은 '전자기기 근처면 반드시 괴롭다'고 단언했지만, 이미 오랫동안 배터리를 몸에 지니고도 아무 반응이 없었다는 사실이 폭로된다. 증상이 심인성임이 공개적으로 드러나자, 척은 자존심이 무너져 조작 사실까지 스스로 떠들어 버린다."}],quotes:[{speaker:"척 맥길",en:"He plays by his own rules, and he doesn't care who he hurts.",ko:"그 녀석은 제멋대로 굴고, 누구를 다치게 하든 신경 안 써.",context:"증언대에서 자제력을 잃고 지미를 성토하며 쏟아내는 말이다. 동생을 고발하려던 말이, 오히려 자신이 통제를 잃었다는 증거가 되어 버린다. 척의 완벽함이 무너지는 정점에 놓인 대사다."}],reception:["방영 직후부터 시리즈 최고의 회차로 널리 꼽혔고, 종영 후에도 거의 모든 '베스트 에피소드' 논의의 맨 앞자리에 선다. 마이클 매킨의 증언대 연기가 특히 반복적으로 호평의 중심이 됐다. (개별 매체 점수\xb7수상 결과는 이 사이트에서 대조하지 않았다. 다만 《베터 콜 사울》은 숱한 찬사에도 끝내 에미상을 받지 못한다 — 본편 참조.)"],sketches:[{motif:"space-blanket",caption:"증언대에서 무너진 완벽주의자",slot:"plot"},{motif:"switch-tape",caption:"주머니 속 배터리",slot:"meaning"}]},{id:"s03e06",season:3,episode:6,titleEn:"Off Brand",titleKo:"오프 브랜드",airDate:"2017-05-15",writers:"앤 처키스",director:"키스 고든",logline:"지미가 변호사 자격을 1년간 잃는다. 그리고 한 이름을 지어낸다.",plot:["청문회 결과 지미는 변호사 자격이 1년간 정지된다. 당장 생계가 막힌 그는 그동안 사 둔 방송 광고 시간을 되팔아야 한다. 광고를 직접 제작하고 파는 일을 하며, 지미는 자신을 변호사 '지미 맥길'과 분리할 새 간판이 필요해진다.","광고 영업을 하던 지미는, 즉석에서 떠오른 이름을 입에 올린다. '사울 굿맨'. 발음하면 \"그거면 다 잘됐어(s'all good, man)\"처럼 들리는 말장난이다. 변호사가 아닌 척, 광고쟁이 '사울 굿맨'으로서의 첫 자아가 이렇게 농담처럼 태어난다.","나초는 헥터의 심장약을 가짜로 바꿔치기할 준비를 한다. 헥터가 자기 아버지의 합법 사업까지 마약 운반에 쓰려 하자, 나초는 아버지를 지키기 위해 헥터를 조용히 제거할 계획을 품는다. 거스의 세계와 지미의 세계가 각자의 '가짜 이름', 각자의 '바꿔치기'로 움직인다."],titleMeaning:["'오프 브랜드'는 정품이 아닌 '유사\xb7대체 상표'를 뜻한다. 변호사 '지미 맥길'을 쓸 수 없게 된 지미가, 그 대체재로 내세우는 '사울 굿맨'을 가리킨다.","진짜 자아를 쓸 수 없을 때 꺼내 드는 복제 자아—그것이 '오프 브랜드'다. 농담처럼 시작된 이 가짜 이름이 결국 진짜보다 더 커진다는 점에서, 제목은 사울 굿맨의 탄생 신화를 정확히 요약한다."],trivia:[{source:"팬덤 논의",text:"'사울 굿맨(Saul Goodman)'이라는 이름이 \"s'all good, man(다 잘됐어)\"의 말장난이라는 점은 《브레이킹 배드》 시절부터 알려진 설정이다. 이 회차는 그 이름이 태어나는 순간을 처음으로 보여 준다."},{source:"제작 배경",text:"'사울 굿맨'이 처음엔 변호사가 아니라 '광고 영업용 가명'으로 등장한다는 점이, 이 이름이 얼마나 우연하고 즉흥적으로 시작됐는지를 보여 준다."},{source:"팬 커뮤니티",text:"나초가 아버지를 지키려고 헥터를 제거하려는 동기는, 그를 단순한 악당이 아니라 '가족을 위한 비극의 인물'로 만드는 핵심이다."}],redditQuestions:[{question:"'사울 굿맨'이라는 이름은 어디서 왔나?",answer:'이 회차에서 지미가 광고를 팔며 즉석에서 지어낸 가명이다. 영어로 빠르게 발음하면 "s\'all good, man(다 괜찮아)"처럼 들리는 말장난이다. 처음엔 변호사 이름이 아니라 방송 광고 영업용 가명으로 쓰이기 시작한다.'}],quotes:[{speaker:"지미 맥길",en:"'S all good, man!",ko:"다 잘됐어, 친구!",context:"광고 카메라 앞에서 즉흥으로 내뱉은 말이 그대로 이름이 된다. 가벼운 농담 한마디에서 '사울 굿맨'이라는 평생의 가면이 태어나는, 시리즈의 분기점이 되는 대사다."}],sketches:[{motif:"bus-bench-ad",caption:"광고쟁이 사울 굿맨",slot:"plot"},{motif:"pill-capsule",caption:"바꿔치기를 준비하는 손",slot:"trivia"}]},{id:"s03e07",season:3,episode:7,titleEn:"Expenses",titleKo:"비용",airDate:"2017-05-22",writers:"토머스 슈나우즈",director:"토머스 슈나우즈",logline:"자격 정지의 청구서가 모두에게 날아든다. 지미도, 킴도, 마이크도.",plot:["변호사 자격이 정지된 지미는 사회봉사 명령을 채우며 광고 영업으로 근근이 버틴다. 수입은 줄고 보험료와 사무실 비용은 그대로다. 그는 다시 '요령'으로 돈을 메울 방법을 찾기 시작한다—정직한 길이 비용을 감당하지 못할 때 그가 늘 돌아가는 자리다.","킴은 지미의 몫까지 떠안으며 메사 베르데 업무에 과부하가 걸린다. 혼자 밤을 새우고 주차장 구석에서 담배로 긴장을 눌러 가며, 그녀는 자신이 얼마나 무리하고 있는지 인정하지 않는다. 성공의 비용이 그녀의 몸으로 청구되기 시작한다.","마이크는 수의사 칼데라의 범죄 알선 네트워크와 지원 모임을 통해 자신이 선 자리를 가늠한다. 세 사람 모두 각자의 '비용'을 치르는 중이고, 그 청구서가 점점 커진다."],titleMeaning:["'비용(Expenses)'은 지미가 자격 정지로 떠안은 금전적 부담을 가리킨다. 보험료\xb7사무실 유지비처럼 수입이 끊겨도 멈추지 않는 지출이다.","그러나 제목의 비용은 돈만이 아니다. 킴의 건강, 마이크의 양심, 지미의 정직까지—모든 선택에는 보이지 않는 청구서가 따른다. 이 시리즈가 집요하게 추적하는 것이 바로 그 '숨은 비용'이다."],trivia:[{source:"팬덤 논의",text:"킴이 주차장에서 혼자 담배를 피우는 장면은, 겉으론 완벽해 보이는 그녀가 안에서 무너지고 있음을 보여 주는 반복 모티프다. 과로의 비용이 그녀 몸에 쌓인다."},{source:"제작 배경",text:"수의사 칼데라가 운영하는 '범죄자 지원 네트워크'는 이 세계의 지하 경제를 보여 주는 장치로, 마이크가 거스의 조직으로 더 깊이 들어가는 통로가 된다."},{source:"팬 커뮤니티",text:"지미가 봉사 명령을 때우는 장면들은 그가 '제도가 부과한 비용'을 얼마나 못 견디는지를 보여 준다. 요령으로 비용을 메우려는 충동이 다시 고개를 든다."}],quotes:[{speaker:"킴 웩슬러",en:"I'm fine.",ko:"난 괜찮아.",context:"과로로 한계에 다다른 킴이 반복하는 말이다. 괜찮지 않은 사람이 괜찮다고 되뇌는 이 짧은 부정이, 그녀가 치르는 '성공의 비용'을 가장 서늘하게 드러낸다."}],sketches:[{motif:"parking-garage",caption:"주차장 구석의 담배",slot:"plot"},{motif:"legal-pad",caption:"혼자 떠안은 업무",slot:"meaning"}]},{id:"s03e08",season:3,episode:8,titleEn:"Slip",titleKo:"슬립",airDate:"2017-06-05",writers:"헤더 마리온",director:"애덤 번스타인",logline:"지미가 넘어지는 척 돈을 만든다. 척은 넘어진 자신을 일으키려 한다.",plot:["돈에 쪼들린 지미는 옛 사기 수법으로 돌아간다. 가게에서 일부러 미끄러져 넘어지는 '슬립 앤 폴' 사고를 연출해 합의금을 뜯어낼 판을 짠다. 변호사 자격이 없는 지금, 그는 점점 더 노골적으로 '사울 굿맨'의 방식을 쓴다.","척은 자신의 전자기 과민증을 극복하려 시도한다. 의사 크루즈의 도움을 받아, 집 안에 조금씩 전기를 되돌리며 증상이 믿음의 문제임을 스스로 인정하려 애쓴다. 평생을 지배한 두려움과 정면으로 싸우는 척의 가장 용기 있는 순간이다.","나초의 약 바꿔치기 계획이 무르익는다. 세 갈래 이야기 모두에서 사람들은 '한 번 미끄러진 자리'에서 다시 일어서려 하거나, 일부러 미끄러져 이득을 취한다. 넘어짐의 두 얼굴이 한 회차에 담긴다."],titleMeaning:["'슬립(Slip)'은 지미가 꾸미는 '미끄러져 넘어지는' 사기에서 왔다. 동시에 '실족\xb7타락'을 뜻하기도 한다.","지미는 일부러 미끄러져 돈을 벌고, 척은 자기 두려움에서 일어서려 미끄러짐을 무릅쓴다. 같은 단어가 한쪽에선 사기의 기술로, 다른 쪽에선 회복의 용기로 갈린다. 두 형제가 '넘어짐'을 얼마나 다르게 다루는지를 보여 주는 제목이다."],trivia:[{source:"팬덤 논의",text:"지미의 '슬립 앤 폴' 연기는 그의 사기 기술이 자격 정지 기간에 오히려 더 거리낌 없어졌음을 보여 준다. '사울'의 방식이 점점 전면에 나선다."},{source:"제작 배경",text:"척이 의사와 함께 집에 전기를 되돌리려 시도하는 장면은, 그의 증상이 심인성임을 본인도 직면하려 한다는 점에서 인물의 가장 인간적인 분투로 평가된다."},{source:"팬 커뮤니티",text:"'슬리핑 지미'라는 옛 별명과 이 회차의 '슬립'이 겹치면서, 지미의 과거가 현재로 다시 번져 나오고 있음을 보여 준다는 해석이 자주 제기된다."}],quotes:[{speaker:"지미 맥길",en:"I'm a lawyer, not a criminal.",ko:"난 변호사지, 범죄자가 아니야.",context:"점점 사기에 가까워지는 자신을 두고 내뱉는 자기변명이다. 정작 변호사 자격은 정지된 상태라는 점에서, 이 말은 그가 아직 붙잡고 있는(그러나 놓치고 있는) 자아를 드러낸다."}],sketches:[{motif:"matchbook",caption:"일부러 미끄러지는 기술",slot:"plot"},{motif:"gas-lantern",caption:"두려움에 맞서 되돌린 불빛",slot:"meaning"}]},{id:"s03e09",season:3,episode:9,titleEn:"Fall",titleKo:"추락",airDate:"2017-06-12",writers:"고든 스미스",director:"민키 스파이로",logline:"지미가 가장 아끼던 노인 고객을 배신한다. 그리고 척이 다시 일어선다.",plot:["샌드파이퍼 집단소송의 합의를 앞당겨 당장 큰돈을 쥐려고, 지미는 가장 신뢰하던 노인 고객 아이린을 이용한다. 그녀의 친구들이 아이린에게 등을 돌리도록 교묘히 소문을 퍼뜨려, 외로워진 아이린이 합의를 서두르게 만든다. 노인들의 신뢰를 재능으로 삼던 지미가, 그 신뢰를 처음으로 무기로 쓴다.","척은 증상을 극복하고 변호사로 복귀하려 한다. 그는 HHM에 대한 지분과 자존심을 걸고 하워드를 압박하고, 하워드는 결국 사재를 털어 척을 회사에서 '정산'해 내보낸다. 척은 겉으론 이겼지만, 평생의 정체성이던 회사에서 떠밀려 난다.","킴은 과로의 한계에 다다른다. 쉬지 못하고 운전대를 잡은 그녀의 위태로운 모습이, 이 세계의 모든 성취가 치르는 대가를 예고한다. 모두가 각자의 방식으로 '추락'을 향해 간다."],titleMeaning:["'추락(Fall)'은 등장인물 모두에게 겹친다. 아이린을 배신하는 지미의 도덕적 추락, 회사에서 밀려나는 척의 추락, 과로로 무너지기 직전인 킴의 추락.","가장 아끼던 사람을 이용하는 지미의 선택이 이 시즌 그의 가장 낮은 지점이다. 제목의 '추락'은 사건이 아니라 인물의 내면에서 일어나는 일—한 사람이 자기 밑바닥을 지나는 순간을 가리킨다."],trivia:[{source:"팬덤 논의",text:"지미가 노인 아이린을 외톨이로 만들어 합의를 재촉하는 장면은, 그가 '사람의 신뢰'라는 자신의 가장 큰 재능을 처음으로 무기로 돌려 쓴 사례다. 팬들이 지미의 가장 잔인한 선택 중 하나로 꼽는다."},{source:"제작 배경",text:"하워드가 사재를 털어 척을 정산해 내보내는 전개는, HHM이라는 로펌과 세 인물(척\xb7하워드\xb7지미)의 관계가 돌이킬 수 없이 갈라지는 지점이다."},{source:"팬 커뮤니티",text:"킴의 과로 묘사가 쌓이면서, 많은 시청자가 다음 회차에서 벌어질 일을 불안하게 예감했다는 반응이 첫 방영 당시 다수 올라왔다."}],quotes:[{speaker:"지미 맥길",en:"It's all good.",ko:"다 괜찮아.",context:"아이린을 이용한 일을 애써 덮으며 스스로를 다독이는 말이다. '사울 굿맨'의 그 말버릇이, 정작 전혀 괜찮지 않은 배신 위에 덧씌워진다. 이름과 행동 사이의 간극이 가장 아프게 벌어지는 순간이다."}],sketches:[{motif:"bingo-cage",caption:"노인들의 신뢰를 무기로",slot:"plot"},{motif:"parking-garage",caption:"쉬지 못하는 밤",slot:"trivia"}]},{id:"s03e10",season:3,episode:10,titleEn:"Lantern",titleKo:"랜턴",airDate:"2017-06-19",writers:"제니퍼 허치슨",director:"피터 굴드",logline:"지미가 아이린에게 저지른 일을 되돌리려 한다. 그리고 척이 어둠 속에서 불을 켠다.",plot:["지미는 아이린을 외톨이로 만든 일에 양심의 가책을 느끼고, 자신의 평판을 희생해서라도 그 관계를 되돌려 놓는다. 노인들 앞에서 스스로를 나쁜 사람으로 깎아내려 아이린을 다시 친구들 품으로 돌려보낸다. 사울의 방식 한가운데서 지미의 양심이 마지막으로 반짝인다.","회사에서 밀려나고 지미와도 완전히 틀어진 척은 홀로 집에 남는다. 애써 되돌리려던 전기 극복은 실패하고, 그는 집 안에 전기가 '새어 든다'는 망상에 사로잡혀 벽을 뜯고 전선을 끊는다. 밤새 집을 부수던 척은 끝내 탁자 위 가스 랜턴을 발로 걷어찬다.","쓰러진 랜턴의 불이 신문 더미에 옮겨붙는다. 전기를 두려워해 랜턴으로 살던 사람이, 바로 그 불꽃에 삼켜진다. 화면은 번지는 불을 비추며 끝난다. 형제의 전쟁이 가장 비극적인 방식으로 멈추는, 시즌을 닫는 장면이다."],titleMeaning:["'랜턴'은 척이 전기 대신 의지해 온 가스등이다. 그가 세상과 타협한 유일한 불빛이자, 그의 집을 밝히던 생명선이다.","그 안전의 상징이 끝내 그를 삼킨다. 전기를 피해 택한 불이 집을 태운다는 역설에, 척이라는 인물의 모든 모순이 응축된다. 가장 조심스럽던 사람이 가장 원초적인 불에 무너지는, 잔혹하도록 완결된 제목이다."],trivia:[{source:"팬덤 논의",text:"척이 랜턴을 걷어차 집에 불이 번지는 마지막 장면은 시즌 3의 결말이자 시리즈에서 가장 자주 회자되는 비극적 이미지다. 전기를 피하던 사람이 불로 무너진다는 아이러니가 핵심이다."},{source:"제작 배경",text:"마이클 매킨이 연기한 척의 마지막 분투—벽을 뜯고 전선을 끊는 긴 시퀀스—는 거의 대사 없이 전개되며, 심리적 붕괴를 행동만으로 그려 낸 연출로 높이 평가된다."},{source:"팬 커뮤니티",text:"지미가 아이린 사건을 자기 평판을 깎아 되돌려 놓는 장면과, 같은 시각 척이 무너지는 장면이 교차 편집된 구성이 회차의 비극을 극대화한다는 분석이 많다."}],redditQuestions:[{question:"척의 집에 난 불은 어떻게 시작됐나?",answer:"척이 전기가 '새어 든다'는 망상에 사로잡혀 밤새 집의 전선과 두꺼비집을 뜯어내던 중, 탁자 위에 놓인 가스 랜턴을 발로 걷어차면서 시작된다. 쓰러진 랜턴의 불이 그가 쌓아 둔 신문 더미에 옮겨붙는다. 전기를 피해 살던 사람이 그 대안으로 택한 불에 삼켜지는 결말이다."}],quotes:[{speaker:"척 맥길",en:"You've never mattered all that much to me.",ko:"넌 나한테 그렇게까지 중요한 적이 없었어.",context:"마지막으로 지미를 떼어 내려고 척이 던지는 가장 잔인한 말이다. 동생을 지키려는 뒤틀린 의도였는지 진심이었는지는 끝내 모호하게 남고, 그 모호함이 척의 비극을 더 아프게 만든다."}],reception:["척의 결말을 중심으로 시즌 3의 정점이자 시리즈의 비극적 이정표로 꼽힌다. 마이클 매킨의 연기와 교차 편집 구성이 특히 높이 평가됐다. (개별 매체 점수\xb7순위는 이 사이트에서 대조하지 않았다.)"],sketches:[{motif:"gas-lantern",caption:"걷어차인 랜턴",slot:"plot"},{motif:"newspaper-stack",caption:"불이 옮겨붙은 신문 더미",slot:"meaning"}]}]},{number:4,titleEn:"Winner",titleKo:"시즌 4 \xb7 승자",years:"2018",summary:"척의 죽음이 지미를 얼어붙게 하고, 그 얼음이 녹을 때 드러나는 것은 슬픔이 아니라 차가움이다. 거스는 헥터를 되살려 복수의 판을 짜고, 마이크는 독일 기술자들과 지하 실험실을 파 내려간다. 지미가 마침내 '사울 굿맨'의 이름으로 법정에 서기로 한다.",episodes:[{id:"s04e01",season:4,episode:1,titleEn:"Smoke",titleKo:"스모크",airDate:"2018-08-06",writers:"피터 굴드",director:"민키 스파이로",logline:"형이 죽었다. 지미는 눈물 대신 이상한 평온을 보인다.",plot:["척의 집에 난 불이 그의 죽음으로 이어진다. 지미는 형의 장례와 뒷정리를 담담히 처리하고, 겉으로는 슬퍼 보이지 않는다. 그 평온이 주변 사람들을, 특히 하워드를 더 불안하게 만든다. 하워드는 자신이 척을 회사에서 정산해 내보낸 것이 죽음을 불렀다며 자책한다.",'지미는 하워드의 자책을 받아 주기는커녕, 그 죄책감을 하워드에게 그대로 떠넘긴다. "그건 네 십자가야." 슬픔을 느끼지 못하는 자리에서, 지미는 자신의 고통을 남에게 전가하는 법을 배운다. 척의 죽음이 그를 더 단단하고 더 차갑게 만든다.',"한편 거스는 쓰러진 헥터를 '죽게 두지 않는다'. 멕시코에서 최고의 의사를 데려와 헥터를 되살린다. 헥터를 당장 죽이는 것은 거스에게 너무 쉬운 복수다. 그는 헥터가 모든 것을 지켜보며 천천히 무너지길 원한다. 복수의 긴 계획이 여기서 시작된다."],titleMeaning:["'스모크(연기)'는 척의 집을 태운 불이 남긴 것이다. 불은 꺼졌지만 연기는 공기 중에 남아, 사라지지 않는 상실의 잔향을 가리킨다.","동시에 연기는 '실체가 없는 것'이다. 지미의 슬픔은 연기처럼 보일 듯 보이지 않고, 끝내 형태를 갖추지 못한다. 눈에 보이지만 잡을 수 없는 감정—그것이 척의 죽음 이후 지미의 상태다."],trivia:[{source:"팬덤 논의",text:"지미가 척의 죽음에 눈에 띄게 슬퍼하지 않는 전개는, 그의 감정 처리 방식이 얼마나 뒤틀려 있는지를 보여 준다. 이 '얼어붙은 슬픔'이 시즌 4 전체를 지배한다."},{source:"제작 배경",text:"거스가 헥터를 '살려 두는' 선택은 《브레이킹 배드》에서 벨만으로 등장하는 헥터의 상태를 설명하는 기원이다. 복수를 위해 적을 일부러 살려 두는 거스식 잔혹함이 확립된다."},{source:"팬 커뮤니티",text:"지미가 하워드에게 죄책감을 떠넘기는 '네 십자가' 장면은, 슬픔을 느끼지 못하는 자가 타인을 어떻게 이용하는지를 보여 주는 대표 장면으로 꼽힌다."}],quotes:[{speaker:"지미 맥길",en:"Well, Howard... I guess that's your cross to bear.",ko:"글쎄, 하워드. 그건 네가 짊어질 십자가인 것 같은데.",context:"척의 죽음을 자책하는 하워드에게 지미가 던지는 말이다. 위로 대신 죄책감을 상대에게 떠넘기는 이 한마디가, 슬픔을 처리하지 못한 지미의 차가움을 드러낸다."}],sketches:[{motif:"gas-lantern",caption:"불이 지나간 자리",slot:"plot"},{motif:"pollos-sign",caption:"헥터를 살려 두는 손",slot:"trivia"}]},{id:"s04e02",season:4,episode:2,titleEn:"Breathe",titleKo:"숨",airDate:"2018-08-13",writers:"토머스 슈나우즈",director:"미셸 매클래런",logline:"지미가 일자리를 구하려다 걷어찬다. 나초는 거스의 손아귀에 든다.",plot:["지미는 복사기\xb7문서 회사의 영업직 면접을 본다. 뜻밖에 잘 풀려 그 자리에서 채용되지만, 지미는 돌연 태도를 바꿔 '당신들은 나를 왜 이렇게 쉽게 믿느냐'며 면접관을 몰아세우고 제 발로 걷어찬다. 정상적인 삶이 손에 들어오는 순간 스스로 무너뜨리는, 그의 자기파괴적 충동이 드러난다.","거스는 헥터를 쓰러뜨린 약 바꿔치기의 범인이 나초임을 사실상 간파하고, 나초를 자기 손아귀에 넣는다. 아버지를 지키려던 나초의 선택이, 그를 더 무서운 주인 아래로 데려간다. 그는 이제 거스와 살라망카 사이에 낀 이중 스파이가 된다.","킴은 새 로펌에서 자리를 잡아 가지만, 지미의 불안정한 상태가 두 사람 사이에 그늘을 드리운다. 지미가 '숨 쉬듯' 거짓과 자기파괴를 반복하는 동안, 킴은 그 리듬을 언제까지 함께 견딜 수 있을지 가늠한다."],titleMeaning:["'숨(Breathe)'은 되살아난 헥터가 기계의 도움으로 겨우 쉬는 호흡이자, 지미가 정상적인 삶 앞에서 오히려 숨 막혀 하는 상태를 동시에 가리킨다.","누군가는 억지로 숨을 이어 가고(헥터), 누군가는 숨 쉴 자리를 제 손으로 걷어찬다(지미). 생존의 가장 기본인 호흡을 제목으로 삼아, 드라마는 '살아 있음'이 각 인물에게 얼마나 다른 무게인지 보여 준다."],trivia:[{source:"팬덤 논의",text:"지미가 좋은 일자리를 스스로 걷어차는 면접 장면은, 그의 자기파괴 충동을 보여 주는 핵심 사례로 자주 인용된다. 정상성이 손에 들어올수록 그는 그것을 견디지 못한다."},{source:"제작 배경",text:"나초가 거스의 통제 아래 들어가는 전개는, 그를 살라망카와 거스 양쪽에 끼인 가장 위태로운 인물로 만든다. 마이클 맨도의 비극적 연기가 본격화된다."}],quotes:[{speaker:"지미 맥길",en:"You don't want me. Nobody does.",ko:"당신들은 나를 원하지 않아. 아무도 안 원해.",context:"면접에서 채용 통보를 받은 직후, 지미가 돌변해 쏟아내는 말이다. 정상적인 신뢰를 받는 순간 그것을 견디지 못하고 스스로 걷어차는, 척의 죽음 이후 그의 자기파괴를 압축한다."}],sketches:[{motif:"pill-capsule",caption:"바꿔치기의 대가",slot:"plot"},{motif:"legal-pad",caption:"새 로펌에 자리 잡는 킴",slot:"trivia"}]},{id:"s04e03",season:4,episode:3,titleEn:"Something Beautiful",titleKo:"아름다운 것",airDate:"2018-08-20",writers:"고든 스미스",director:"대니얼 색하임",logline:"지미가 값비싼 도자기 인형을 턴다. 마이크는 감시의 대상이 된다.",plot:["지미는 광고\xb7영업 인맥을 범죄 쪽으로 넓히며, 아이라와 함께 한 사무실을 턴다. 목표는 수집가들이 탐내는 독일제 도자기 인형, 값비싼 '소년' 험멜이다. 치밀한 침입과 바꿔치기로 인형을 손에 넣는 과정이, 그가 이제 '사건을 변호하는 사람'이 아니라 '사건을 설계하는 사람'이 되었음을 보여 준다.","마이크는 거스의 조직에서 보안을 맡으며, 동시에 자신이 감시당하고 있음을 느낀다. 거스의 세계는 모두가 모두를 지켜보는 구조다. 마이크는 그 구조 안에서 자기 자리를 신중히 저울질한다.","킴은 지미와의 관계 속에서, 그가 벌이는 '작은 범죄'들이 점점 커지는 것을 지켜본다. 아름다워 보이는 물건 하나를 훔치는 일이, 사실은 두 사람의 삶에서 무언가가 조용히 깨지고 있다는 신호다."],titleMeaning:["'아름다운 것(Something Beautiful)'은 지미가 훔치는 값비싼 도자기 인형을 가리킨다. 산골 소년을 본뜬 정교하고 값나가는 수집품이다.","그러나 제목은 반어로도 읽힌다. 가장 아름다운 물건을 손에 넣는 방식이 도둑질이라는 것—아름다움과 그것을 얻는 추한 방법 사이의 간극이, 지미가 세상과 맺는 관계의 본질을 비춘다."],trivia:[{source:"팬덤 논의",text:"지미가 터는 '소년' 험멜 인형은 이후 시즌에서도 다시 등장하며, 그의 범죄 인맥과 돈의 흐름을 잇는 소품으로 기능한다."},{source:"제작 배경",text:"지미가 아이라 같은 전문 좀도둑과 손잡는 전개는, 그가 '변호'에서 '설계'로 넘어가는 전환을 보여 준다. 사울 굿맨의 범죄 네트워크가 이 무렵부터 짜이기 시작한다."}],quotes:[{speaker:"지미 맥길",en:"It's a Hummel. People pay stupid money for these.",ko:"험멜이야. 사람들이 이런 거에 말도 안 되는 돈을 쓰거든.",context:"훔친 도자기 인형의 값어치를 설명하는 지미의 말이다. 예술품의 가치를 오직 '뜯어낼 수 있는 금액'으로만 보는 그의 시선이, 세상을 대하는 사울식 태도를 드러낸다."}],sketches:[{motif:"hummel-figurine",caption:"값나가는 소년 인형",slot:"plot"},{motif:"parking-booth",caption:"감시받는 자",slot:"meaning"}]},{id:"s04e04",season:4,episode:4,titleEn:"Talk",titleKo:"토크",airDate:"2018-08-27",writers:"헤더 마리온",director:"존 시번",logline:"지미는 형 이야기를 끝내 입에 담지 못하고, 마이크는 지하로 내려간다.",plot:["마이크는 상실을 다루는 지원 모임에 나가지만, 정작 자기 이야기는 하지 않는다. 지미 역시 척에 대해 말하기를 거부한다. 두 남자 모두 '말하라'는 요구 앞에서 입을 닫는다. 감정을 말로 꺼내는 일이, 이들에게는 가장 어려운 일이다.","거스의 실험실 건설이 본격화된다. 마이크는 독일에서 데려온 전문 기술자들의 보안과 통제를 맡는다. 세탁소 지하를 거대한 공간으로 파 내려가는 극비 공사가 시작되고, 마이크는 그 비밀을 지키는 책임자가 된다.","말하지 못하는 지미와 지하로 내려가는 마이크가 한 회차에 놓인다. 한쪽은 감정을 묻고, 다른 쪽은 거대한 비밀을 땅속에 묻는다. 묻어 둔 것들이 언젠가 어떻게 터져 나올지가, 이 시리즈가 쌓아 가는 긴장이다."],titleMeaning:["'토크(Talk)'는 지원 모임에서 요구되는 '말하기'이자, 지미와 마이크가 끝내 하지 못하는 바로 그것이다.","제목이 가리키는 것은 '말함'이 아니라 '말하지 못함'이다. 가장 흔한 단어를 걸어 놓고, 두 남자가 그 단어를 얼마나 두려워하는지를 보여 준다. 침묵으로 쌓이는 감정이 이 회차의 진짜 내용이다."],trivia:[{source:"제작 배경",text:"세탁소 지하 실험실 건설은 《브레이킹 배드》의 거대한 지하 실험실로 이어지는 기원이다. 독일 기술자들을 데려와 극비로 파 내려가는 설정이 이 회차에서 본격화된다."},{source:"팬덤 논의",text:"지미와 마이크가 각자의 방식으로 '말하기를 거부'하는 이 회차의 대비는, 두 인물이 감정을 다루는 법이 얼마나 닮았는지를 보여 준다."}],quotes:[{speaker:"마이크 에르만트라우트",en:"I'm here. That's as far as I go.",ko:"난 여기 나와 있어. 거기까지야.",context:"지원 모임에서 '말하라'는 권유에 마이크가 긋는 선이다. 참석은 하되 속은 열지 않겠다는 태도가, 감정을 땅속 비밀처럼 묻어 두는 그의 방식을 요약한다."}],sketches:[{motif:"superlab-dig",caption:"지하로 내려가는 공사",slot:"plot"},{motif:"dam-schematic",caption:"독일식 설계도",slot:"trivia"}]},{id:"s04e05",season:4,episode:5,titleEn:"Quite a Ride",titleKo:"대단한 질주",airDate:"2018-09-03",writers:"앤 처키스",director:"마이클 모리스",logline:"먼 미래의 사울이 모든 것을 불태우고, 현재의 지미는 뒷세계로 더 들어간다.",plot:["컬러 화면의 콜드 오픈은 훨씬 먼 미래, 사울 굿맨이 변호사로 전성기를 누리던 시절의 마지막 밤을 보여 준다. 모든 것이 무너지기 직전, 사울은 사무실의 증거를 파쇄하고 금붙이를 챙긴 뒤 '사라지게 해 주는 사람'에게 전화를 건다. 새 신분을 사서 흔적도 없이 사라지는 그 통로다.","현재의 지미는 변호사 자격 정지 기간을 범죄 인맥으로 채운다. 선불폰을 범죄자들에게 파는 길거리 영업을 시작하며, 그는 법의 바깥 세계에 자신의 고객층을 만든다. 미래의 파멸과 현재의 번창이 한 회차에 나란히 놓인다.","두 시간선을 겹쳐 보면, 지금 지미가 쌓아 올리는 모든 것이 결국 어디로 가는지가 분명해진다. 질주는 화려하지만, 그 끝에는 가명과 도피뿐이다."],titleMeaning:["'대단한 질주(Quite a Ride)'는 사울의 전성기와 몰락을 동시에 가리키는 반어다. 화려하게 내달렸지만, 그 질주의 종착지는 모든 것을 버리고 숨는 삶이다.","먼 미래의 사울이 사무실을 비우며 내뱉을 법한 말이기도 하다. 즐거운 질주였다는 자평 뒤에, 그 질주가 남긴 폐허가 겹쳐 보인다. 시간선을 겹쳐 쓰는 이 시리즈의 특기가 제목에 그대로 담겨 있다."],trivia:[{source:"제작 배경",text:"콜드 오픈은 《브레이킹 배드》 종반, 사울이 앨버커키를 떠나기 직전의 밤을 보여 준다. '사라지게 해 주는 사람(진공청소기 가게 운영자)'에게 전화하는 장면은 원작과 직접 이어진다."},{source:"팬덤 논의",text:"선불폰을 범죄자에게 파는 길거리 영업은, 지미가 법의 바깥에 자기 고객층을 만드는 과정을 보여 준다. 훗날 사울 굿맨의 의뢰인들이 여기서 싹튼다."}],quotes:[{speaker:"사울 굿맨",en:"It's showtime.",ko:"쇼타임이군.",context:"콜드 오픈에서 모든 것을 버리고 도피를 준비하는 미래의 사울이 보이는 태도다. 파멸의 순간조차 '쇼'로 받아들이는 그 가벼움이, 질주의 끝에서도 변하지 않는 사울의 본질을 보여 준다."}],sketches:[{motif:"vacuum-shop",caption:"사라지게 해 주는 사람",slot:"plot"},{motif:"pay-phone",caption:"흔적을 지우는 전화",slot:"trivia"}]},{id:"s04e06",season:4,episode:6,titleEn:"Pi\xf1ata",titleKo:"피냐타",airDate:"2018-09-10",writers:"제니퍼 허치슨",director:"앤드루 스탠턴",logline:"거스가 복수의 뿌리를 털어놓고, 킴은 자신이 진짜 원하는 일을 엿본다.",plot:["거스가 부하에게 어린 시절의 이야기를 들려준다. 굶주린 코아티가 나무의 열매를 전부 따 먹도록 일부러 내버려 두었다가, 가장 배부른 순간에 그것을 잡았다는 이야기다. 헥터를 당장 죽이지 않고 '가장 많이 가진 순간'에 무너뜨리려는 그의 복수 철학이 피냐타처럼 드러난다.","킴은 대형 고객 업무에 지쳐 가면서, 자신이 진짜 하고 싶은 일이 '힘없는 사람을 변호하는 공익 사건'임을 깨닫는다. 돈이 되는 일과 마음이 가는 일 사이에서, 그녀의 내적 갈등이 선명해진다.","지미는 자격 정지가 풀릴 날을 준비하며, 복귀 후 어떤 변호사가 될지 저울질한다. 각자가 '때가 오면 무엇을 칠 것인가'를 가늠하는 회차다. 거스는 적을, 킴은 제도를, 지미는 자기 자신을 겨눈다."],titleMeaning:["'피냐타'는 매달아 두고 터뜨리는 사탕 꾸러미다. 거스가 헥터를 바라보는 방식—가장 가득 찼을 때 터뜨리겠다는 복수의 비유로 쓰인다.","속을 가득 채워 둔 뒤 한 번에 터뜨린다는 피냐타의 구조가, 이 시리즈의 긴 복수극과 겹친다. 당장의 타격이 아니라 '가장 아플 때를 기다리는' 인내가 제목에 담겨 있다."],trivia:[{source:"제작 배경",text:"거스가 코아티와 열매나무 이야기를 들려주는 장면은, 그의 복수 철학—'가장 많이 가진 순간에 빼앗는다'—을 응축한 대목으로 자주 인용된다."},{source:"팬덤 논의",text:"킴이 공익 변호에 끌리는 전개는, 그녀가 지미와 달리 '올바른 일'에 진짜 갈증을 느끼는 인물임을 보여 준다. 두 사람의 가치관 차이가 이후 갈등의 씨앗이 된다."}],quotes:[{speaker:"거스 프링",en:"I will do it when I am ready.",ko:"내가 준비됐을 때 하겠다.",context:"헥터를 향한 복수를 서두르지 않겠다는 거스의 선언이다. 당장의 분풀이가 아니라 '가장 아플 순간'을 기다리는 그의 인내가, 피냐타의 비유와 정확히 맞물린다."}],sketches:[{motif:"tio-bell",caption:"가장 가득 찼을 때를 기다린다",slot:"plot"},{motif:"bus-bench-ad",caption:"복귀 뒤의 간판을 고르는 일",slot:"meaning"}]},{id:"s04e07",season:4,episode:7,titleEn:"Something Stupid",titleKo:"서머싱 스투피드",airDate:"2018-09-17",writers:"앨리슨 탯록",director:"데버라 차우",logline:"지미와 킴이 같은 집에 살면서 점점 멀어진다. 한 해가 분할 화면으로 흐른다.",plot:["한 곡의 노래 위로, 지미와 킴이 보내는 여러 달이 분할 화면으로 흐른다. 화면 한쪽에선 지미가 선불폰과 뒷거래의 세계로, 다른 쪽에선 킴이 법률가의 성취로 각자 나아간다. 같은 집, 같은 침대를 쓰면서도 두 사람의 삶은 화면처럼 선으로 갈라져 있다.","킴은 지미가 벌이는 일들을 점점 모르게 되고, 지미는 킴에게 자기 세계를 숨긴다. 둘 사이의 거리가 대사가 아니라 구도로 그려진다. 나란히 있지만 닿지 않는 두 사람의 상태가 한 회차의 형식 그 자체가 된다.","자격 정지 해제가 다가오며, 지미는 복귀 심사를 준비한다. 그러나 그가 형 척의 죽음에 대해 어떤 진심도 꺼내지 못한다는 점이, 심사의 가장 큰 변수로 남는다."],titleMeaning:["제목은 프랭크\xb7낸시 시내트라의 노래 'Somethin' Stupid'에서 왔다. 분할 화면 몽타주에 깔리는 곡으로, 사랑하는 사이에 '괜한 말 한마디'로 모든 걸 망치는 순간을 노래한다.","두 사람은 아직 결정적인 '바보 같은 말'을 하지 않았지만, 침묵 속에서 이미 멀어지고 있다. 노래 제목을 빌려, 드라마는 앞으로 올 파국이 어떤 말 한마디에서 터질지를 미리 암시한다."],trivia:[{source:"제작 배경",text:"노래 한 곡 길이 동안 분할 화면으로 수개월을 압축하는 오프닝 몽타주는, 두 사람의 거리감을 대사 없이 형식으로 보여 준 연출로 높이 평가된다."},{source:"팬덤 논의",text:"같은 공간에 있으면서도 화면이 선으로 갈라지는 구도는, 지미와 킴의 관계가 겉으론 멀쩡해 보여도 안에서 분리되고 있음을 상징한다."}],quotes:[{speaker:"킴 웩슬러",en:"You're always doing something.",ko:"넌 항상 뭔가를 꾸미고 있잖아.",context:"지미가 자기 세계를 숨긴다는 것을 어렴풋이 느낀 킴의 말이다. 비난도 애정도 아닌 이 담담한 관찰이, 두 사람 사이에 벌어진 거리를 조용히 드러낸다."}],sketches:[{motif:"parking-garage",caption:"나란히, 그러나 갈라진",slot:"plot"},{motif:"legal-pad",caption:"각자의 성취",slot:"trivia"}]},{id:"s04e08",season:4,episode:8,titleEn:"Coushatta",titleKo:"쿠샤타",airDate:"2018-09-24",writers:"고든 스미스",director:"짐 매케이",logline:"지미가 가짜 편지 수백 통으로 법을 속인다. 킴이 그 지휘를 맡는다.",plot:["지미의 의뢰인 휴얼이 폭행 혐의로 중형을 앞두자, 지미는 거대한 사기를 설계한다. 존재하지 않는 시골 교회 신도들이 휴얼의 인품을 보증한다는 '탄원 편지'를 수백 통 만들어 검사 측에 쏟아붓는 것이다. 가짜 신도, 가짜 교회, 가짜 전화번호까지—한 편의 연극을 통째로 연출한다.","놀랍게도 이 사기를 현장에서 지휘하는 사람은 킴이다. 올바름에 갈증을 느끼던 그녀가, 지미의 사기 한가운데서 가장 유능한 연출자가 된다. 킴 안에 있던 '빅토르와 지젤'의 그 즐거움이, 이번엔 훨씬 큰 판에서 되살아난다.","작전은 성공하고 휴얼은 가벼운 처분으로 풀려난다. 그러나 이 성공이 두 사람에게 남긴 것은 안도가 아니라, '우리는 이런 걸 함께 아주 잘한다'는 위험한 확인이다."],titleMeaning:["'쿠샤타'는 가짜 교회 신도들이 있다고 꾸민 루이지애나의 지명이다. 존재하지 않는 공동체에 실재하는 지명을 붙여, 거짓을 진짜처럼 만드는 사기의 핵심을 보여 준다.","실제 지명을 허구의 간판으로 쓰는 방식은, '스쿼트 코블러'(시즌 2)의 확장판이다. 지미는 다시 한번 없는 것에 그럴듯한 이름을 붙여 현실로 통용시킨다. 다만 이번엔 그 규모가 수백 통에 이른다."],trivia:[{source:"팬덤 논의",text:"킴이 공중전화 부스에서 수십 명의 '가짜 신도' 전화를 혼자 받아넘기는 장면은, 그녀의 사기 재능이 지미 못지않음을 보여 주는 대표 장면으로 꼽힌다."},{source:"제작 배경",text:"'가짜 탄원 편지 수백 통'이라는 설정은 '스쿼트 코블러' 이후 지미식 사기의 규모가 어디까지 커졌는지를 보여 준다. 공동체 하나를 통째로 날조한다."}],quotes:[{speaker:"킴 웩슬러",en:"First Tabernacle of Coushatta. How can I direct your call?",ko:"쿠샤타 제일교회입니다. 어디로 연결해 드릴까요?",context:"존재하지 않는 교회의 '교환원'을 자처하며 킴이 받는 전화다. 사기의 지휘를 맡은 그녀가 보여 주는 천연덕스러움이, 킴 안에도 지미와 같은 즐거움이 있음을 드러낸다."}],sketches:[{motif:"matchbook",caption:"날조된 수백 통의 편지",slot:"plot"},{motif:"bus-bench-ad",caption:"없는 공동체의 간판",slot:"meaning"}]},{id:"s04e09",season:4,episode:9,titleEn:"Wiedersehen",titleKo:"비더제엔",airDate:"2018-10-01",writers:"제니퍼 허치슨",director:"빈스 길리건",logline:"지미의 복귀 심사가 진심의 부재로 무너진다. 지하에서는 물이 솟는다.",plot:["지미는 변호사 복귀 심사에 선다. 심사위원들은 그가 형 척에 대해 한마디도 진심을 꺼내지 않는 것을 지적하고, 지미의 복귀를 기각한다. 척의 이름을 '전략적으로만' 다루는 그의 태도가, 아직 그가 상실을 정직하게 대면하지 못했음을 드러낸다.","킴은 그 결과에 분노한다. 지미가 심사를 '연기 못 한 공연'처럼 여긴다는 것, 진심이 아니라 기술의 문제로만 본다는 것에 그녀는 처음으로 깊은 두려움을 느낀다. 두 사람 사이의 금이 선명해진다.","독일 기술자들이 파 내려간 지하 실험실에서 지하수가 솟아오르며 공사가 멈춘다. 베르너 지글러와 그의 팀은 고향을 그리워하고, 마이크는 통제가 느슨해지는 것을 감지한다. 모든 '설계'가 예상 밖의 변수에 부딪히는 회차다."],titleMeaning:["'비더제엔(Wiedersehen)'은 독일어로 '다시 만나요'라는 작별 인사다. 고향을 그리는 독일 기술자들의 입에서 나오는 말이자, 이별을 예고하는 단어다.","다시 만나자는 인사가 가장 불길하게 쓰이는 회차다. 지미와 킴 사이에도, 마이크와 베르너 사이에도, '다시 만남'이 평온하게 이루어지지 않을 것임을 제목이 미리 일러 준다."],trivia:[{source:"팬덤 논의",text:"지미가 복귀 심사에서 척 이야기를 '전략'으로만 다룬 것이 기각의 결정적 이유가 된다. 심사위원들은 그의 말에 진심이 없다는 것을 꿰뚫어 본다."},{source:"제작 배경",text:"지하수로 공사가 멈추고 독일 기술자들이 향수병에 걸리는 전개는, 다음 회차에서 벌어질 베르너의 이탈과 그 비극적 결말을 위한 포석이다."}],redditQuestions:[{question:"지미는 왜 복귀 심사에서 떨어졌나?",answer:"심사위원들이 보기에 지미의 말에 진심이 없었기 때문이다. 특히 죽은 형 척을 언급할 때, 그는 슬픔이 아니라 '유리한 인상'을 위해 그 이름을 꺼냈다. 심사위원들은 그 계산을 간파하고, 지미가 아직 변호사로서의 진정성을 회복하지 못했다고 판단한다."}],quotes:[{speaker:"킴 웩슬러",en:"You just have to stop. You can't keep doing this.",ko:"넌 그만둬야 해. 계속 이럴 순 없어.",context:"심사 결과를 두고 킴이 지미에게 던지는 경고다. 그녀가 두려워하는 것은 결과가 아니라, 지미가 진심과 연기를 더는 구분하지 못한다는 사실이다."}],sketches:[{motif:"courthouse",caption:"진심이 빠진 심사",slot:"plot"},{motif:"dam-schematic",caption:"솟아오른 지하수",slot:"trivia"}]},{id:"s04e10",season:4,episode:10,titleEn:"Winner",titleKo:"위너",airDate:"2018-10-08",writers:"피터 굴드 \xb7 토머스 슈나우즈",director:"애덤 번스타인",logline:"지미가 눈물로 심사를 이긴다. 그리고 문을 나서며 그것이 연기였다고 말한다.",plot:["지미는 복귀 심사를 다시 받는다. 이번엔 척의 이름을 걸고, 형에게서 받은 영향과 상실을 눈물로 호소한다. 심사위원들은 감동하고, 지미의 변호사 복귀를 승인한다. 심지어 그는 척을 기리는 장학금까지 거론하며 진정성의 화신처럼 보인다.","그러나 복도로 나서는 순간, 지미는 표정을 싹 바꾸고 킴에게 말한다. \"다 연기였어.\" 그는 죽은 형의 이름마저 도구로 썼고, 그것이 통했다는 사실에 희열을 느낀다. 그리고 복귀하면서 '지미 맥길'이 아니라 '사울 굿맨'이라는 이름으로 개업하겠다고 선언한다. 킴은 자신이 사랑한 사람이 눈앞에서 다른 존재가 되는 것을 지켜본다.","같은 시각, 향수병에 걸린 베르너가 가족을 만나러 몰래 공사장을 벗어난다. 조직의 비밀이 새어 나갈 위기 앞에서, 마이크는 그를 추적한다. 그리고 사막에서, 마이크는 자신이 아끼게 된 그 남자를 자기 손으로 처리해야 하는 가장 괴로운 선택에 이른다."],titleMeaning:["'위너(승자)'는 지미가 심사에서 거둔 '승리'를 가리킨다. 그는 이겼다. 형의 이름을 미끼로, 진심을 연기해 원하는 것을 손에 넣었다.","그러나 이 승리가 그에게서 무엇을 앗아 갔는지가 제목의 진짜 무게다. 이기기 위해 마지막 남은 진심마저 연기로 써 버린 사람은, 승자인 동시에 자기 자신을 잃은 자다. 사울 굿맨의 탄생은 곧 지미 맥길의 패배다."],trivia:[{source:"팬덤 논의",text:"지미가 심사장에선 눈물로 호소하고, 복도에선 '다 연기였어'라며 돌변하는 장면은 시즌 4의 결말이자 '사울 굿맨'이 지미를 덮는 순간으로 꼽힌다. 밥 오덴커크의 표정 전환이 특히 회자된다."},{source:"제작 배경",text:"마이크가 베르너를 처리해야 하는 결말은, 그가 거스의 세계에서 치러야 할 가장 혹독한 대가를 보여 준다. 조너선 뱅크스의 침묵 연기가 이 비극을 떠받친다."},{source:"팬 커뮤니티",text:"지미가 복귀하면서 '사울 굿맨' 이름으로 개업하겠다고 선언하는 마지막은, 시리즈 제목이 비로소 인물의 운명과 완전히 포개지는 지점으로 평가된다."}],redditQuestions:[{question:"지미의 심사장 눈물은 진심이었나?",answer:"아니다. 복도로 나오자마자 그는 킴에게 '다 연기였다'고 밝힌다. 죽은 형 척의 이름과 추모 장학금까지 도구로 써서 심사위원을 울린 것이다. 진심을 완벽하게 흉내 내 원하는 걸 얻고 그 사실을 즐기는 이 장면이, 그가 '사울 굿맨'으로 넘어갔음을 보여 준다."},{question:"왜 하필 '사울 굿맨'이라는 이름으로 개업하나?",answer:"지미 맥길이라는 이름에는 형 척과의 관계, 변호사로서의 과거가 모두 얽혀 있다. 그 무게를 떼어 내려고, 그는 자격 정지 기간에 광고 영업용으로 쓰던 가명 '사울 굿맨'을 정식 간판으로 삼는다. 과거와의 단절을 이름으로 선언하는 셈이다."}],quotes:[{speaker:"지미 맥길",en:"And I'm gonna do it as Saul Goodman.",ko:"그리고 난 그걸 사울 굿맨으로서 할 거야.",context:"복귀가 확정된 직후 킴에게 던지는 선언이다. 눈물의 연기로 '지미 맥길'을 되찾자마자, 그 이름을 버리고 '사울 굿맨'을 택하겠다고 말한다. 시리즈의 제목과 인물의 운명이 완전히 포개지는 순간이다."}],reception:["지미의 돌변과 베르너의 결말을 양 축으로 시즌 4의 정점으로 꼽힌다. 밥 오덴커크와 조너선 뱅크스의 연기가 함께 호평받았다. (개별 매체 점수\xb7순위는 이 사이트에서 대조하지 않았다.)"],sketches:[{motif:"courthouse",caption:"눈물로 이긴 심사",slot:"plot"},{motif:"desert-horizon",caption:"사막에서의 가장 괴로운 선택",slot:"meaning"}]}]},{number:5,titleEn:"Bagman",titleKo:"시즌 5 \xb7 돈가방",years:"2020",summary:"지미가 법적으로 '사울 굿맨'이 되고, 그 간판이 그를 카르텔 변호사로 끌고 들어간다. 랄로 살라망카라는 새 위협이 판을 흔들고, 사막 한복판의 돈가방 하나가 지미와 킴, 마이크의 운명을 돌이킬 수 없이 묶는다.",episodes:[{id:"s05e01",season:5,episode:1,titleEn:"Magic Man",titleKo:"매직 맨",airDate:"2020-02-23",writers:"피터 굴드",director:"브론웬 휴즈",logline:"'사울 굿맨'이 정식으로 개업한다. 이름을 바꾸자 고객의 종류가 바뀐다.",plot:["지미는 '사울 굿맨'이라는 이름으로 정식 개업한다. 휴대폰을 공짜로 나눠 주고 '한정 할인'을 내걸며, 길거리 범죄자들을 고객으로 끌어모은다. 킴은 그가 '지미'가 아니라 '사울'로 사는 것이 무엇을 뜻하는지 불안하게 지켜본다.","이름을 바꾸자 세계가 바뀐다. 성실한 노인\xb7상속 사건 대신, 선불폰을 든 거리의 피의자들이 사울을 찾는다. 사울은 그들에게 '마술사'처럼 보인다—법의 틈을 비집어 무엇이든 빠져나가게 해 주는 사람. 하지만 그 마술의 대가가 곧 청구된다.","한편 랄로 살라망카가 세탁소 지하 실험실 공사의 중단과 그 배후를 캐기 시작한다. 겉으론 웃고 다니지만 누구보다 날카로운 이 인물이, 거스의 비밀에 코를 들이민다. 새로운 위협이 조용히 판 위에 올라선다."],titleMeaning:["'매직 맨(마술사)'은 사울 굿맨이 고객들에게 보이는 모습이다. 법의 틈을 손놀림처럼 다뤄 불가능을 가능으로 바꾸는 사람.","그러나 마술은 '속임수'의 다른 말이다. 관객이 보는 것은 기적이지만, 실제로 일어나는 것은 손기술과 눈속임이다. 사울이라는 이름 자체가 하나의 마술—진짜를 가리고 가짜를 진짜처럼 보이게 하는 장치임을 제목이 드러낸다."],trivia:[{source:"팬덤 논의",text:"지미가 공짜 휴대폰과 '한정 할인'으로 길거리 범죄자 고객층을 만드는 전개는, 《브레이킹 배드》 사울 굿맨의 의뢰인층이 어떻게 형성됐는지를 보여 준다."},{source:"제작 배경",text:"랄로 살라망카 역의 토니 돌턴은 전 시즌 말미에 합류해 이 시즌의 중심 위협이 된다. 웃음과 위협을 동시에 내뿜는 연기가 시리즈의 긴장을 한 단계 끌어올린다."},{source:"팬 커뮤니티",text:"킴이 지미를 '사울'로 부를 때와 '지미'로 부를 때의 차이가, 두 사람 관계의 온도를 재는 척도로 자주 분석된다. 이름이 곧 거리다."}],quotes:[{speaker:"사울 굿맨",en:"When you're in trouble, better call Saul!",ko:"곤란할 땐, 사울을 부르세요!",context:"새 간판 '사울 굿맨'의 광고 문구다. 시리즈의 제목이 극 중 광고 슬로건으로 완성되는 순간이고, 이 한 줄로 지미가 어떤 종류의 변호사가 되었는지가 결정된다."}],sketches:[{motif:"worlds-best-mug",caption:"세계 2위를 자처하는 간판",slot:"plot"},{motif:"travel-wire",caption:"비밀을 캐기 시작하는 랄로",slot:"trivia"}]},{id:"s05e02",season:5,episode:2,titleEn:"50% Off",titleKo:"반값 할인",airDate:"2020-02-24",writers:"앨리슨 탯록",director:"노르베르토 바르바",logline:"사울의 '반값' 한마디가 거리에 소동을 부른다. 마이크는 애도 속에 무너진다.",plot:["사울이 홧김에 내건 '모든 사건 반값' 광고가 거리를 흔든다. 그 말을 곧이들은 두 마약 중독자가, 반값 혜택을 노려 일부러 사고를 치고 다닌다. 사울의 입에서 나온 농담 같은 한마디가, 통제 밖의 결과를 낳는 전형적인 장면이다.","베르너를 자기 손으로 처리해야 했던 마이크는 깊은 애도와 자책에 빠져 있다. 손녀 앞에서도 평정을 잃고, 거리에서 불량배들에게 시비를 걸었다가 얻어맞는다. 늘 통제의 화신이던 그가 통제를 잃은 모습은, 베르너의 죽음이 그에게 남긴 상처의 깊이를 보여 준다.","랄로는 거스와 그 조직의 틈을 계속 들여다본다. 사울의 소동과 마이크의 추락이 각자 따로 벌어지는 듯 보이지만, 모두 같은 카르텔의 그물 안에서 서서히 엮여 간다."],titleMeaning:["'반값 할인(50% Off)'은 사울이 내건 광고 문구다. 변호를 세일 상품처럼 파는 그의 방식이, 법을 어떻게 싸구려로 만드는지를 보여 준다.","할인은 가치를 깎는 일이다. 사울은 자기 재능의 값을 스스로 반으로 내리고, 그 대가로 질 낮은 사건과 통제 불능의 고객을 떠안는다. 가격을 깎을수록 그가 끌어오는 세계가 더 거칠어진다는 역설이 제목에 담겨 있다."],trivia:[{source:"팬덤 논의",text:"'반값'을 노려 사고를 치는 두 중독자는 이후에도 짧게 재등장하며, 사울의 말 한마디가 낳는 통제 불능의 파급을 코믹하면서도 불길하게 보여 준다."},{source:"제작 배경",text:"마이크가 평정을 잃고 거리에서 얻어맞는 장면은, 늘 냉정하던 그가 베르너의 죽음으로 얼마나 무너졌는지를 드러낸다. 조너선 뱅크스의 연기가 인물의 균열을 그려 낸다."}],quotes:[{speaker:"사울 굿맨",en:"It's two for one. Group discount.",ko:"두 명이면 하나 값. 단체 할인이야.",context:"농담처럼 던진 할인 문구가 거리의 소동으로 돌아오는 상황을 요약한다. 사울의 말은 늘 가볍지만 그 결과는 가볍지 않다는, 이 인물의 기본 공식이 작동한다."}],sketches:[{motif:"bus-bench-ad",caption:"반값이라는 미끼",slot:"plot"},{motif:"parking-booth",caption:"평정을 잃은 마이크",slot:"meaning"}]},{id:"s05e03",season:5,episode:3,titleEn:"The Guy for This",titleKo:"이 일의 적임자",airDate:"2020-03-02",writers:"앤 처키스",director:"마이클 모리스",logline:"사울이 카르텔의 '그 사람'이 된다. 킴은 한 노인의 집 편에 선다.",plot:["랄로의 지시로 사울은 유치장에 갇힌 크레이지-8을 빼낸다. 이 일을 계기로 사울은 카르텔이 법적 문제를 맡기는 '그 사람'이 된다. 거액이 들어오지만, 그 돈은 되돌릴 수 없는 소속의 표식이다. 한번 '그 사람'이 되면 빠져나올 수 없다.","킴은 메사 베르데 은행의 콜센터 부지 개발 때문에 집을 빼앗길 처지에 놓인 노인 애커 씨를 알게 된다. 자신의 대형 고객이 힘없는 노인을 밀어내는 상황 앞에서, 킴은 처음으로 고객이 아니라 노인의 편에 서기로 한다.","사울은 카르텔로, 킴은 공익으로—두 사람이 정반대 방향으로 깊이 들어간다. 그러나 곧 킴은 그 노인을 지키기 위해 '사울의 방식'이 필요하다는 것을 알게 된다. 두 세계가 다시 위험하게 포개진다."],titleMeaning:["'이 일의 적임자(The Guy for This)'는 랄로가 사울을 가리키는 말이다. 카르텔이 법적 뒤처리를 맡길 때 찾는 바로 그 사람이라는 뜻이다.","'적임자'가 된다는 것은 곧 대체 불가능한 공범이 된다는 뜻이다. 능력을 인정받는 호칭처럼 들리지만, 실은 돌아올 수 없는 다리를 건넜다는 선고다. 사울은 이제 카르텔의 장부에 이름이 오른 사람이다."],trivia:[{source:"팬덤 논의",text:"사울이 크레이지-8을 빼내며 카르텔의 '그 사람'이 되는 이 회차가, 《브레이킹 배드》의 사울 굿맨—마약 조직의 변호사—으로 가는 결정적 전환점으로 꼽힌다."},{source:"제작 배경",text:"크레이지-8은 《브레이킹 배드》 파일럿에서 월터에게 죽는 바로 그 인물이다. 프리퀄이 원작 인물을 더 이른 시점에 배치하는 또 하나의 연결점이다."},{source:"팬 커뮤니티",text:"킴이 노인 애커의 편에 서는 전개는, 그녀의 공익에 대한 갈증과 지미의 '방식'이 어떻게 충돌하고 결합하는지를 보여 주는 핵심 축으로 자주 논의된다."}],quotes:[{speaker:"사울 굿맨",en:"You're now part of the game.",ko:"넌 이제 이 게임의 일부가 된 거야.",context:"카르텔의 일을 맡으며 스스로에게도 돌아오는 말이다. '그 사람'이 된다는 것이 능력의 인정이 아니라 발을 뺄 수 없는 소속임을, 사울은 알면서도 받아들인다."}],sketches:[{motif:"pay-phone",caption:"카르텔이 찾는 '그 사람'",slot:"plot"},{motif:"legal-pad",caption:"노인의 집 편에 선 킴",slot:"meaning"}]},{id:"s05e04",season:5,episode:4,titleEn:"Namaste",titleKo:"나마스테",airDate:"2020-03-09",writers:"고든 스미스",director:"고든 스미스",logline:"사울이 하워드를 겨냥한 유치한 전쟁을 벌이고, 마이크는 여전히 추락한다.",plot:["하워드가 사울에게 HHM의 변호사 자리를 거듭 제안한다. 정상적인 삶으로의 초대지만, 사울은 그것을 조롱으로 받아들인다. 그는 하워드의 고급 차에 볼링공을 떨어뜨리고, 점심 자리에 성노동자를 보내 창피를 주는 등 유치하고 집요한 괴롭힘을 벌인다.","킴은 애커 노인의 집을 지키기 위해 메사 베르데와 정면으로 맞선다. 자신의 가장 큰 고객을 상대로 싸우면서, 그녀는 점점 사울의 '전술'에 기대게 된다. 올바른 목적을 위해 떳떳하지 않은 수단을 쓰는 경계 위에 그녀도 올라선다.","마이크는 여전히 베르너의 죽음에서 헤어나오지 못한다. 세 사람 모두 각자의 방식으로 선을 넘거나, 넘은 대가를 치르는 중이다."],titleMeaning:["'나마스테'는 '내 안의 빛이 당신 안의 빛에게 인사한다'는 평화의 인사다. 이 회차의 온갖 유치한 전쟁과 정면으로 어긋나는 반어적 제목이다.","평온을 비는 인사를 걸어 놓고, 그 아래에서 벌어지는 것은 볼링공과 모욕과 복수다. 겉의 평화와 속의 적의를 대비시키는 방식으로, 드라마는 사울이라는 인물의 위선적 명랑함을 비춘다."],trivia:[{source:"팬덤 논의",text:"사울이 하워드의 차에 볼링공을 떨어뜨리는 장면은 그의 치졸하고 집요한 복수심을 보여 주는 대표적 코믹\xb7불길 장면으로 꼽힌다."},{source:"제작 배경",text:"하워드가 거듭 정상적인 일자리를 제안할수록 사울이 더 거칠게 반발하는 구도는, 그가 '정상성'을 얼마나 견디지 못하는지를 반복적으로 보여 준다."}],quotes:[{speaker:"하워드 햄린",en:"I wanted to extend a professional courtesy.",ko:"직업적인 호의를 베풀고 싶었을 뿐이야.",context:"사울에게 일자리를 제안하는 하워드의 선의가, 사울에게는 모욕으로 번역된다. 정상적인 호의조차 적의로 받아들이는 사울의 뒤틀린 수용 방식을 드러내는 대목이다."}],sketches:[{motif:"matchbook",caption:"하워드를 겨눈 유치한 전쟁",slot:"plot"},{motif:"courthouse",caption:"목적과 수단 사이",slot:"trivia"}]},{id:"s05e05",season:5,episode:5,titleEn:"Dedicado a Max",titleKo:"막스에게 바친다",airDate:"2020-03-16",writers:"헤더 마리온",director:"짐 매케이",logline:"마이크가 거스의 세계에서 숨을 고르고, 거스의 복수의 뿌리가 드러난다.",plot:["무너진 마이크는 거스의 손에 이끌려 멕시코의 한 마을에서 몸과 마음을 추스른다. 그곳에서 마이크는 거스가 왜 그토록 오래, 그토록 차갑게 복수를 준비하는지 조금씩 이해하게 된다. 거스의 모든 행동 뒤에는 오래전 살해당한 동업자 막스가 있다.","거스가 세운 로스 포요스의 어느 시설에는 '막스에게 바친다'는 헌사가 새겨져 있다. 사랑하는 이를 잃은 거스가 그 상실을 수십 년짜리 복수의 설계로 바꾼 사람이라는 것—그 차가움의 기원이 드러난다.","킴과 사울은 애커 사건을 끝내기 위해, 메사 베르데가 부지에서 '유적'을 발견한 것처럼 꾸미는 교묘한 사기를 벌인다. 공익을 위한 싸움이 결국 사울식 날조로 마무리되고, 킴은 이기지만 그 승리의 방식에 자신도 물든다."],titleMeaning:["'막스에게 바친다(Dedicado a Max)'는 거스가 세운 시설에 새겨진 헌사다. 그의 모든 사업과 복수가 죽은 동업자 막스를 향한 것임을 드러낸다.","겉으론 치킨 체인의 자선 명판이지만, 실제로는 수십 년에 걸친 복수의 비문이다. 사랑을 복수로밖에 표현하지 못하는 거스의 내면이, 이 짧은 헌사 한 줄에 응축된다."],trivia:[{source:"제작 배경",text:"'막스'는 거스의 살해당한 동업자로, 《브레이킹 배드》에서 암시되던 거스의 복수 동기를 설명하는 인물이다. 이 헌사가 그 오랜 원한의 뿌리를 명시한다."},{source:"팬덤 논의",text:"킴이 애커 사건을 '유적 날조'로 끝내는 전개는, 그녀가 좋은 목적을 위해 사울의 방식을 쓰는 데 점점 능숙해지고 있음을 보여 준다. 승리의 뒷맛이 개운하지 않은 이유다."}],quotes:[{speaker:"마이크 에르만트라우트",en:"You can't fix what's already broken.",ko:"이미 부서진 건 되돌릴 수 없어.",context:"베르너의 죽음을 곱씹는 마이크의 체념이다. 되돌릴 수 없는 상실을 안고 살아가는 법을, 그는 거스의 긴 복수에서 역설적으로 읽어 낸다."}],sketches:[{motif:"desert-horizon",caption:"멕시코 마을에서의 회복",slot:"plot"},{motif:"pollos-sign",caption:"막스에게 바친 비문",slot:"meaning"}]},{id:"s05e06",season:5,episode:6,titleEn:"Wexler v. Goodman",titleKo:"웩슬러 대 굿맨",airDate:"2020-03-23",writers:"토머스 슈나우즈",director:"마이클 모리스",logline:"킴과 사울의 방식이 정면으로 충돌한다. 그리고 킴이 뜻밖의 제안을 한다.",plot:["애커 사건과 메사 베르데를 둘러싸고 킴과 사울의 전술이 충돌한다. 사울은 킴의 고객을 상대로 벌인 사기가 킴에게 어떤 타격을 주는지 가늠하지 못하고, 킴은 사울의 '좋은 뜻'이 자신의 커리어를 위험에 빠뜨리는 것에 분노한다. 두 사람은 처음으로 서로의 방식을 정면으로 비판한다.","격렬한 다툼 끝에, 두 사람은 갈라설 수도 있는 기로에 선다. 그러나 킴은 정반대의 결론에 이른다. 그녀는 사울에게 '헤어지거나—아니면 결혼하거나'를 제안한다. 충돌의 끝에서 더 깊이 묶이기로 하는, 두 사람다운 역설적 결정이다.","'빅토르와 지젤'로 함께 사기를 치던 시절부터, 두 사람을 묶은 것은 안정이 아니라 공범의 짜릿함이었다. 결혼이라는 가장 제도적인 선택조차, 이들에게는 또 하나의 '함께 벌이는 일'로 다가온다."],titleMeaning:["'웩슬러 대 굿맨(Wexler v. Goodman)'은 법정 사건명 형식을 빌린 제목이다. 킴(웩슬러)과 사울(굿맨)의 대립을, 마치 두 사람이 서로를 상대로 소송을 건 것처럼 표현한다.","연인의 다툼을 사건명으로 적는 이 제목은, 두 사람 관계가 사랑인 동시에 끝없는 협상\xb7대립임을 드러낸다. 그리고 그 '소송'의 판결이 이별이 아니라 결혼이라는 점이, 이들 관계의 비틀린 본질을 보여 준다."],trivia:[{source:"팬덤 논의",text:"격렬한 다툼 끝에 킴이 '헤어지거나 결혼하거나'를 제안하는 반전은 시즌 5에서 가장 많이 회자되는 장면 중 하나다. 충돌을 결속으로 바꾸는 킴의 선택이 두 사람 관계의 핵심을 드러낸다."},{source:"제작 배경",text:"제목을 법정 사건명 형식으로 지은 것은, 이 커플의 관계가 늘 '대립을 통한 결합'이라는 점을 형식으로 보여 주려는 의도로 읽힌다."}],quotes:[{speaker:"킴 웩슬러",en:"Maybe we should get married.",ko:"어쩌면 우리 결혼해야 할지도 몰라.",context:"헤어질 수도 있던 격한 다툼의 끝에서 킴이 내놓는 뜻밖의 결론이다. 갈라서는 대신 더 깊이 묶이기를 택하는 이 제안이, 두 사람 관계의 역설적 논리를 완성한다."}],sketches:[{motif:"zafiro-anejo",caption:"빅토르와 지젤, 다시",slot:"plot"},{motif:"legal-pad",caption:"사건명이 된 연애",slot:"meaning"}]},{id:"s05e07",season:5,episode:7,titleEn:"JMM",titleKo:"JMM",airDate:"2020-03-30",writers:"앨리슨 탯록",director:"멜리사 번스타인",logline:"킴과 사울이 결혼한다. 같은 날, 사울은 하워드에게 본색을 드러낸다.",plot:["킴과 사울이 법원에서 간소하게 결혼한다. 사랑의 서약이라기보다, 서로에 대해 증언하지 않아도 되는 '부부 특권'을 포함한 실용적 결속에 가깝다. 두 사람은 이 결혼이 무엇을 지키고 무엇을 위험하게 하는지 알면서도 손을 맞잡는다.","같은 시기, 살인 혐의로 체포된 랄로의 변호를 맡으면서 사울은 카르텔 사건의 한복판에 선다. 보석을 받아 내려는 그의 수완이 거스의 긴 계획과 충돌하기 시작한다. 사울은 자신이 얼마나 위험한 판에 올라섰는지 아직 다 알지 못한다.","하워드가 사울의 유치한 괴롭힘의 배후를 알아채고 그를 찾아와 따진다. 사울은 사과 대신 본색을 드러낸다. 자신은 더 큰 세계로 가는 중이고, 하워드 같은 사람은 그 길을 이해하지 못한다고. 가면이 벗겨진 사울의 민낯이 처음으로 길게 드러나는 장면이다."],titleMeaning:["'JMM'은 하워드의 로펌이 내건 사훈 'Justice Matters Most(정의가 가장 중요하다)'의 약자이자, 지미의 본명 James Morgan McGill의 머리글자다.","같은 세 글자가 두 가지를 동시에 가리킨다. 하워드가 믿는 정의와, 지미가 버리고 가는 본명. 사울이 '정의'와 '자기 이름'을 한꺼번에 등지는 이 회차에, 그 두 가지를 겹쳐 담은 제목이다."],trivia:[{source:"팬덤 논의",text:"사울이 하워드에게 '넌 이 게임을 이해 못 해'라고 쏘아붙이는 장면은, 지미 맥길의 마지막 흔적마저 사울 굿맨에게 덮이는 순간으로 꼽힌다."},{source:"제작 배경",text:"'JMM'이 사훈인 동시에 지미 본명의 이니셜이라는 이중 의미는, 제목으로 두 세계를 겹쳐 쓰는 이 시리즈의 특기를 압축한 사례로 자주 인용된다."}],quotes:[{speaker:"사울 굿맨",en:"I am the one who knocks? No. I'm the guy who makes sure you never have to answer the door.",ko:"문을 두드리는 자? 아니지. 난 당신이 그 문을 아예 안 열어도 되게 해 주는 사람이야.",context:"하워드에게 자신이 어떤 세계로 가고 있는지 과시하는 사울의 허세다. (원작의 유명한 대사를 비틀어 읽는 해석적 각색이며, 대사를 그대로 옮긴 인용이 아니다.) 사울의 자기도취가 정점에 이르는 대목이다."}],sketches:[{motif:"courthouse",caption:"법원에서의 결혼",slot:"plot"},{motif:"cucumber-water",caption:"본색을 마주한 하워드",slot:"trivia"}]},{id:"s05e08",season:5,episode:8,titleEn:"Bagman",titleKo:"돈가방",airDate:"2020-04-06",writers:"고든 스미스",director:"빈스 길리건",logline:"사울이 사막에서 700만 달러를 짊어진다. 그리고 거의 죽는다.",plot:["랄로의 보석금 700만 달러를 국경 너머에서 받아 오는 일을, 사울은 '쉬운 심부름'으로 여기고 떠난다. 그러나 돈을 넘겨받는 순간 매복한 총격이 쏟아지고, 사울의 차는 벌집이 된다. 멀리서 지켜보던 마이크가 저격으로 그를 구한다.","차가 못 쓰게 되자 두 사람은 돈가방을 짊어지고 사막을 걸어서 횡단해야 한다. 물은 총에 뚫린 통에서 새어 나가고, 태양은 가차 없다. 변호사 가방 대신 수백만 달러를 등에 지고, 사울은 생애 가장 긴 하루를 건넌다.","탈진과 갈증 속에서 사울은 포기하려 하지만 마이크가 그를 몰아세운다. 두 사람은 끝내 사막을 건너 돈을 지켜 낸다. 사울이 카르텔의 돈을 몸으로 짊어진 이 하루가, 그가 그 세계에서 결코 빠져나올 수 없음을 몸에 새긴다."],titleMeaning:["'돈가방(Bagman)'은 범죄 조직의 현금을 운반하는 사람을 가리키는 은어다. 변호사 사울이 문자 그대로 카르텔의 '돈 운반책'이 되었음을 가리킨다.","서류 가방을 들던 손이 수백만 달러를 등에 지는 자리로 바뀐다. 제목은 사울의 직업적 정체가 '변호'에서 '운반'으로—법의 대리인에서 범죄의 일부로 넘어갔음을 건조하게 못 박는다."],trivia:[{source:"제작 배경",text:"빈스 길리건이 연출한 이 회차는 거의 전편을 사막에서 두 배우만으로 끌고 간다. 대사보다 걷기\xb7갈증\xb7침묵으로 긴장을 쌓는 구성이 시리즈의 대표적 성취로 꼽힌다."},{source:"팬덤 논의",text:"총에 뚫린 물통에서 물이 새어 나가는 설정은, 두 사람의 생존 시간이 눈앞에서 줄어드는 것을 시각화한다. 사막 횡단의 긴장을 떠받치는 핵심 소품이다."},{source:"팬 커뮤니티",text:"밥 오덴커크가 코미디 배우에서 극한 생존극의 주연으로 완전히 넘어갔음을 보여 준 회차로 자주 언급된다."}],redditQuestions:[{question:"사울은 왜 혼자 사막까지 돈을 받으러 갔나?",answer:"랄로가 자신의 보석금 700만 달러를 '믿을 만한 사람'이 직접 받아 오길 원했기 때문이다. 사울은 이를 큰돈이 걸린 간단한 심부름으로 여겼지만, 그 돈의 출처가 카르텔인 이상 매복과 배신이 따르는 일이었다. 마이크가 몰래 뒤를 봐주고 있었던 것이 그를 살린다."}],quotes:[{speaker:"마이크 에르만트라우트",en:"We keep walking.",ko:"계속 걷는 거야.",context:"탈진해 주저앉으려는 사울을 일으켜 세우는 마이크의 명령이다. 사막 횡단 내내 반복되는 이 짧은 말이, 생존을 밀어붙이는 유일한 동력이 된다. 걷기를 멈추면 죽는다는 단순한 진실이다."}],reception:["사막 2인극이라는 과감한 형식으로 시즌 5, 나아가 시리즈 전체의 대표 회차로 꼽힌다. 빈스 길리건의 연출과 두 배우의 체력적 연기가 함께 호평받았다. (개별 매체 점수\xb7순위는 이 사이트에서 대조하지 않았다.)"],sketches:[{motif:"desert-walk",caption:"돈가방을 지고 사막을 건너다",slot:"plot"},{motif:"bullet-canteen",caption:"총에 뚫린 물통",slot:"trivia"}]},{id:"s05e09",season:5,episode:9,titleEn:"Bad Choice Road",titleKo:"나쁜 선택의 길",airDate:"2020-04-13",writers:"토머스 슈나우즈",director:"토머스 슈나우즈",logline:"사울이 살아 돌아오지만, 랄로가 집 안까지 따라온다. 킴이 맞선다.",plot:["사막에서 살아 돌아온 사울은 깊은 트라우마에 빠진다. 겉으론 돈을 지켜 냈지만, 그가 넘어온 것은 돌아올 수 없는 다리였다. 킴은 변한 그의 모습에서 두 사람의 삶이 어디로 가고 있는지 직감한다.","랄로는 사막의 매복이 내부자의 소행임을 의심하며, 사울의 이야기에 구멍이 없는지 캐려 한다. 어느 밤 그는 예고 없이 사울과 킴의 아파트로 찾아온다. 사울의 거짓말이 조금만 어긋나도 두 사람의 목숨이 날아갈 상황이다.","그 순간 킴이 나선다. 그녀는 랄로 앞에서 조금도 물러서지 않고, 오히려 그를 정면으로 몰아세운다. 변호사의 논리와 배짱만으로 카르텔 살인자를 돌려보내는 이 장면은, 킴이 이미 이 위험한 세계의 '플레이어'가 되었음을 보여 준다."],titleMeaning:["'나쁜 선택의 길(Bad Choice Road)'은 마이크가 사울에게 건넨 말에서 왔다. 한번 잘못된 길에 들어서면, 그다음부터는 선택지가 모두 나빠진다는 뜻이다.","사막을 건넌 뒤 사울에게 남은 길은 모두 '나쁜 선택'뿐이다. 되돌아갈 수 없는 지점을 지난 사람에게 세상은 더 나은 길을 내주지 않는다. 제목은 사울과 킴이 함께 들어선 외길의 성격을 요약한다."],trivia:[{source:"팬덤 논의",text:"킴이 랄로를 정면으로 몰아세워 돌려보내는 아파트 장면은, 리아 시혼의 연기와 함께 시즌 5의 하이라이트로 꼽힌다. 킴이 이 세계에서 사울만큼 대담하다는 것을 증명한다."},{source:"제작 배경",text:"'나쁜 선택의 길'이라는 마이크의 대사는, 사막 횡단 이후 사울에게 남은 선택지가 왜 모두 어두운지를 설명하는 이 시즌의 주제문으로 자주 인용된다."}],quotes:[{speaker:"마이크 에르만트라우트",en:"You take the bad choice road, every choice after that is a bad one.",ko:"나쁜 선택의 길로 들어서면, 그다음 선택은 전부 나쁜 거야.",context:"사막에서 사울을 다잡으며 건넨 말이자 회차의 제목이 된 대사다. 한번 잘못된 길에 들어선 사람에게 더 나은 선택지는 없다는 이 경고가, 사울과 킴 모두에게 드리운다."}],sketches:[{motif:"desert-horizon",caption:"건너온 외길",slot:"plot"},{motif:"pay-phone",caption:"구멍을 찾는 랄로",slot:"trivia"}]},{id:"s05e10",season:5,episode:10,titleEn:"Something Unforgivable",titleKo:"용서할 수 없는 것",airDate:"2020-04-27",writers:"피터 굴드 \xb7 어리얼 러바인",director:"피터 굴드",logline:"킴이 하워드를 겨눈 선을 넘자고 말한다. 멕시코에서는 랄로가 습격당한다.",plot:["킴은 사울이 벌이던 하워드 괴롭힘을 더 큰 판으로 키우자고 제안한다. 하워드의 평판을 완전히 무너뜨려 샌드파이퍼 합의를 앞당기고 큰돈을 쥐자는, 돌이킬 수 없는 계획이다. 늘 선을 긋던 킴이 먼저 선을 넘자고 말하는 이 반전에, 사울마저 멈칫한다.","멕시코의 요새 같은 저택에서, 랄로는 거스가 보낸 암살단의 습격을 받는다. 총격전이 벌어지고, 랄로는 욕조 아래 숨겨진 비밀 통로—우물처럼 좁고 깊은 터널—로 내려가 사다리를 타고 탈출한다. 모두가 그가 죽었다고 믿는 순간, 그는 어둠 속으로 사라진다.","킴의 미소와 랄로의 생존이 같은 밤에 놓인다. 한쪽에선 '용서할 수 없는 일'을 벌이기로 한 부부가, 다른 쪽에선 죽은 줄 알았던 위협이 되살아난다. 시즌은 두 개의 시한폭탄을 켜 둔 채 끝난다."],titleMeaning:["'용서할 수 없는 것(Something Unforgivable)'은 킴이 하워드에게 저지르자고 제안하는 일을 가리킨다. 한번 하면 되돌릴 수도 용서받을 수도 없는 선을 그녀가 먼저 넘자고 한다.","그러나 '용서할 수 없는 것'은 거스의 복수, 랄로의 생존, 사울이 이미 저지른 일들까지—이 세계의 모든 인물이 지고 가는 짐이기도 하다. 제목은 특정 사건을 넘어, 이 이야기가 다루는 죄 그 자체를 가리킨다."],trivia:[{source:"팬덤 논의",text:"킴이 먼저 '하워드를 무너뜨리자'고 제안하는 반전은 시즌 5의 마지막 충격으로 꼽힌다. 올바름에 갈증을 느끼던 그녀가 가장 위험한 쪽으로 기우는 순간이다."},{source:"제작 배경",text:"랄로가 욕조 밑 비밀 통로로 탈출하는 설정은, 그가 죽지 않고 다음 시즌의 위협으로 되살아나는 장치다. 요새 저택의 습격 시퀀스는 시리즈에서 가장 큰 규모의 액션으로 꼽힌다."}],redditQuestions:[{question:"랄로는 어떻게 암살단을 피해 살아남았나?",answer:"저택 욕실 바닥에 숨겨 둔 비밀 통로 덕분이다. 욕조를 들어내면 우물처럼 깊은 터널이 나오고, 랄로는 사다리를 타고 내려가 그 아래로 빠져나간다. 암살단은 그를 죽였다고 보고하지만, 랄로는 어둠 속에서 살아 나온다."}],quotes:[{speaker:"킴 웩슬러",en:"Wouldn't you rather have it all?",ko:"다 가지는 편이 낫지 않겠어?",context:"하워드를 무너뜨리자는 제안을 사울에게 건네는 킴의 말이다. 늘 선을 긋던 그녀가 먼저 선을 넘자고 하는 이 순간이, 두 사람의 역할이 뒤바뀌는 충격적 전환을 만든다."}],sketches:[{motif:"well-ladder",caption:"욕조 아래의 비밀 통로",slot:"plot"},{motif:"pollos-sign",caption:"거스가 보낸 암살단",slot:"trivia"}]}]},{number:6,titleEn:"Saul Gone",titleKo:"시즌 6 \xb7 사울의 끝",years:"2022",summary:"13편으로 치르는 마지막 시즌. 하워드를 겨눈 장난이 살인으로, 살인이 모든 것의 붕괴로 번진다. 지미는 완전한 사울 굿맨이 되고, 그 끝에서 흑백의 '진'으로, 다시 한 번만 '지미 맥길'로 돌아갈 기회를 마주한다. 거의 모든 제목이 'X와 Y' 형식으로, 두 세계가 끝내 하나로 무너지는 시즌이다.",episodes:[{id:"s06e01",season:6,episode:1,titleEn:"Wine and Roses",titleKo:"와인과 장미",airDate:"2022-04-18",writers:"피터 굴드",director:"마이클 모리스",logline:"지미와 킴이 하워드를 무너뜨릴 '작전'을 가동한다. 랄로는 살아 있다.",plot:["컬러 콜드 오픈은 훨씬 먼 미래, 사울 굿맨의 호화 저택이 통
