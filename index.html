째로 비워지는 모습을 보여 준다. 금빛 장식과 사치품이 압수\xb7경매되는 그 폐허가, 지금 지미가 쌓는 모든 것의 종착지다.","현재의 지미와 킴은 하워드 햄린을 파멸시킬 정교한 작전에 착수한다. 하워드의 평판을 약물 중독처럼 꾸며 샌드파이퍼 조정을 교란하고, 거액의 합의금을 앞당기려는 계획이다. 두 사람은 이 '놀이'에 지난 어느 때보다 몰두한다.","모두가 죽었다고 믿은 랄로 살라망카는 멕시코에서 살아남아, 자신을 노린 배후가 거스임을 입증할 증거를 모은다. 사울의 작전과 랄로의 역습이 각자의 궤도를 돌며, 충돌을 향해 다가간다."],titleMeaning:["'와인과 장미(Wine and Roses)'는 'days of wine and roses'라는 관용구에서 왔다. 화려하지만 덧없이 지나가는 좋은 시절을 뜻한다.","콜드 오픈의 텅 빈 저택이 그 관용구의 답이다. 와인과 장미의 날들은 반드시 끝나고, 남는 것은 압수 딱지가 붙은 폐허뿐이다. 이 시즌 거의 모든 제목이 'X와 Y' 형식을 따른다는 점에서, 첫 편의 제목이 그 리듬을 연다."],trivia:[{source:"제작 배경",text:"시즌 6은 13편으로, 시리즈에서 가장 긴 시즌이자 마지막 시즌이다. 거의 모든 회차 제목이 'X와 Y' 형식(와인과 장미, 당근과 채찍 등)으로 통일돼 있다."},{source:"팬덤 논의",text:"콜드 오픈의 저택 압수 장면은 《브레이킹 배드》 이후 사울이 맞는 몰락을 미리 보여 준다. 사치품 하나하나가 그가 치를 대가의 목록처럼 읽힌다."}],quotes:[{speaker:"킴 웩슬러",en:"We're not hurting him. Not really.",ko:"우리가 그를 진짜로 해치는 건 아니야. 정말로.",context:"하워드를 겨눈 작전을 스스로 정당화하는 킴의 말이다. '진짜로는 아니다'라는 단서가, 그녀가 이미 넘은 선을 애써 부정하고 있음을 드러낸다. 이 자기기만이 시즌의 비극을 예고한다."}],sketches:[{motif:"matchbook",caption:"하워드를 겨눈 작전",slot:"plot"},{motif:"vacuum-shop",caption:"먼 미래, 비워지는 저택",slot:"trivia"}]},{id:"s06e02",season:6,episode:2,titleEn:"Carrot and Stick",titleKo:"당근과 채찍",airDate:"2022-04-18",writers:"토머스 슈나우즈 \xb7 어리얼 러바인",director:"빈스 길리건",logline:"옛 얼굴들이 작전에 동원되고, 나초는 사막에서 쫓긴다.",plot:["지미와 킴은 하워드 작전에 뜻밖의 인물들을 끌어들인다. 오래전 등장했던 케틀먼 부부가 다시 소환되어, 자기도 모르게 작전의 부품이 된다. 지미와 킴은 사람들을 체스 말처럼 배치하는 데 거리낌이 없어졌다.","거스의 조직이 랄로의 생존을 의심하며 경계를 조인다. 거스는 보이지 않는 적을 상대로 방어선을 치고, 조직원들은 숙청의 공기 속에서 움직인다.","나초는 사막에서 쫓긴다. 거스와 살라망카 양쪽에서 버림받은 그는, 아버지만은 지키려 한다. 가족을 위해 모든 것을 건 한 남자의 마지막이 가까워 온다."],titleMeaning:["'당근과 채찍(Carrot and Stick)'은 보상과 위협을 번갈아 쓰는 조종술을 뜻한다. 지미와 킴이 사람들을 작전에 끌어들이는 방식이자, 거스가 조직을 다루는 방식이다.","모두가 누군가를 당근과 채찍으로 움직인다. 그러나 조종하는 자 역시 더 큰 손에 조종당하고 있다는 것—이 세계의 먹이사슬을 제목이 건조하게 요약한다."],trivia:[{source:"팬덤 논의",text:"케틀먼 부부의 재등장은 시즌 1의 첫 사건을 마지막 시즌으로 소환하는 수미상관으로, 지미\xb7킴이 사람을 도구로 쓰는 데 얼마나 능숙해졌는지를 보여 준다."},{source:"제작 배경",text:"나초의 도주극은 마이클 맨도의 마지막 비중 있는 서사로, 가족을 지키려는 그의 동기가 비극의 정점으로 치닫는 과정을 그린다."}],quotes:[{speaker:"나초 바르가",en:"Keep my father out of this.",ko:"우리 아버지는 이 일에서 빼.",context:"쫓기는 와중에도 나초가 지키려는 단 하나의 선이다. 범죄의 한복판에서도 가족만은 지키려는 그 마음이, 그를 이 세계의 가장 인간적인 비극으로 만든다."}],sketches:[{motif:"bus-bench-ad",caption:"작전에 동원되는 옛 얼굴들",slot:"plot"},{motif:"desert-horizon",caption:"사막에서 쫓기는 나초",slot:"meaning"}]},{id:"s06e03",season:6,episode:3,titleEn:"Rock and Hard Place",titleKo:"진퇴양난",airDate:"2022-04-25",writers:"고든 스미스",director:"고든 스미스",logline:"나초가 아버지를 지키기 위해, 마지막으로 자기 운명을 스스로 택한다.",plot:["거스와 살라망카 사이에 낀 나초에게 더는 빠져나갈 길이 없다. 양쪽 모두 그를 희생양으로 쓰려 하고, 어느 쪽에 붙어도 아버지가 위험해진다. 그는 진퇴양난의 한가운데서, 자신이 통제할 수 있는 마지막 한 가지를 택하기로 한다.","살라망카 일가 앞에 끌려 나온 나초는, 거스의 각본대로 움직이는 대신 그들의 면전에서 진실을 쏟아낸다. 헥터를 무너뜨린 것이 자신이었다고, 너희 모두를 경멸한다고. 그리고 누구의 손에도 죽지 않겠다는 듯, 스스로 자기 삶을 끝낸다.","가족을 지키기 위해 모든 멸시와 죽음을 자기 것으로 끌어안은 나초의 최후는, 이 세계에서 '선택'이 얼마나 좁은지를 보여 준다. 그가 지킬 수 있었던 것은 아버지의 안전과, 자기 죽음의 방식뿐이었다."],titleMeaning:["'진퇴양난(Rock and Hard Place)'은 'between a rock and a hard place', 어느 쪽으로도 갈 수 없는 상황을 뜻하는 관용구다. 거스와 살라망카 사이에 낀 나초의 자리를 정확히 가리킨다.","양쪽 모두 죽음뿐일 때, 나초가 쥔 유일한 자유는 '어떻게 죽을지'였다. 제목의 두 '단단한 것' 사이에서, 그는 자기 죽음의 주인이 되는 길을 택한다. 좁은 운명 안에서 끝까지 존엄을 지킨 선택이다."],trivia:[{source:"팬덤 논의",text:"나초의 최후 연설과 죽음은 시리즈에서 가장 가슴 아픈 장면 중 하나로 꼽힌다. 가족을 지키기 위해 모든 모욕과 죽음을 스스로 끌어안는 선택이 핵심이다."},{source:"제작 배경",text:"마이클 맨도는 이 회차의 연기로 나초라는 인물을 비극의 중심에 세웠다. 원래 조연으로 기획됐던 인물이 시리즈의 도덕적 무게추가 된 사례다."}],quotes:[{speaker:"나초 바르가",en:"I'm not sorry. I'd do it all again.",ko:"후회 안 해. 다시 해도 똑같이 할 거야.",context:"살라망카 일가 앞에서 헥터를 무너뜨린 일을 스스로 밝히며 던지는 말이다. 죽음을 앞두고도 굴복하지 않는 이 선언이, 가족을 지키려던 그의 선택에 존엄을 부여한다."}],reception:["나초의 죽음을 중심으로 시즌 6 전반부의 정서적 정점으로 꼽힌다. 마이클 맨도의 연기가 특히 반복적으로 호평받았다. (개별 매체 점수\xb7순위는 이 사이트에서 대조하지 않았다.)"],sketches:[{motif:"desert-horizon",caption:"빠져나갈 길 없는 사막",slot:"plot"},{motif:"pill-capsule",caption:"모든 것을 끌어안은 선택",slot:"meaning"}]},{id:"s06e04",season:6,episode:4,titleEn:"Hit and Run",titleKo:"뺑소니",airDate:"2022-05-02",writers:"앤 처키스",director:"리아 시혼",logline:"거스는 보이지 않는 위협에 신경을 곤두세우고, 작전은 계속된다.",plot:["거스는 랄로가 어딘가 살아 있다는 확신 속에서 극도의 경계 태세에 들어간다. 집 곳곳에 비상용 무기를 숨기고, 조직의 보안을 다시 짠다. 늘 완벽하게 통제하던 그가 처음으로 '보이지 않는 적'에게 쫓기는 쪽이 된다.","지미와 킴의 하워드 작전은 다음 단계로 넘어간다. 하워드가 사설탐정까지 붙여 수상함을 캐기 시작하면서, 작전은 점점 더 정교하고 위험해진다. 두 사람은 들키지 않으려 더 큰 거짓말을 쌓는다.","킴은 공익 변호사로서의 일과 사울과 함께 벌이는 작전 사이를 오간다. 낮에는 힘없는 의뢰인을 돕고 밤에는 하워드를 함정에 빠뜨리는 이 분열이, 그녀 안에서 점점 커진다."],titleMeaning:["'뺑소니(Hit and Run)'는 치고 달아나는 행위다. 거스의 경계, 작전의 전개, 조직의 움직임이 모두 '빠르게 치고 빠지는' 긴장 속에 놓여 있음을 가리킨다.","제목은 또한 책임을 지지 않고 달아나는 태도를 뜻한다. 지미와 킴은 사람을 치고도 그 결과에서 달아날 수 있다고 믿는다. 그러나 이 세계에서 '치고 달아나기'가 끝내 가능한지를, 시즌은 되묻는다."],trivia:[{source:"제작 배경",text:"이 회차는 킴 역의 리아 시혼이 연출을 맡은 감독 데뷔작이다. 오랜 세월 인물을 연기해 온 배우가 카메라 뒤로 간 사례로 주목받았다."},{source:"팬덤 논의",text:"거스가 집 안 곳곳에 무기를 숨기는 장면은, 《브레이킹 배드》의 치밀한 거스를 아는 시청자에게 그의 편집증적 대비가 어디서 왔는지를 보여 준다."}],quotes:[{speaker:"거스 프링",en:"He's out there.",ko:"그자는 저기 어딘가에 있어.",context:"죽은 줄 알았던 랄로가 살아 있음을 직감하는 거스의 말이다. 늘 통제의 화신이던 그가 처음으로 '보이지 않는 적'에 쫓기는 쪽이 되었음을 드러낸다."}],sketches:[{motif:"pollos-sign",caption:"경계 태세에 들어간 거스",slot:"plot"},{motif:"parking-garage",caption:"낮과 밤으로 갈린 킴",slot:"trivia"}]},{id:"s06e05",season:6,episode:5,titleEn:"Black and Blue",titleKo:"블랙 앤 블루",airDate:"2022-05-09",writers:"앨리슨 탯록",director:"멜리사 번스타인",logline:"하워드가 작전의 냄새를 맡고 반격한다. 거스와 랄로의 수 싸움이 조여든다.",plot:["하워드는 지미와 킴이 자신을 겨냥하고 있음을 점점 확신한다. 그는 사설탐정의 조사를 근거로 지미를 찾아가 정면으로 따지고, 두 사람의 작전이 들통날 위기에 놓인다. 그러나 하워드조차 작전의 진짜 규모와 목적은 상상하지 못한다.","거스와 랄로는 서로를 향해 수를 둔다. 랄로는 거스의 극비 실험실 공사를 증거로 잡으려 하고, 거스는 랄로가 노출될 틈을 노린다. 보이지 않는 두 사람의 체스가, 곧 피를 부를 판으로 조여든다.","하워드의 반격과 카르텔의 수 싸움이 각자 임계점에 다다른다. 모든 긴장이 한 지점으로 수렴하기 직전, 시즌은 숨을 고른다."],titleMeaning:["'블랙 앤 블루(Black and Blue)'는 멍든 상태를 뜻하는 표현이다. 하워드가 받는 심리적 타격과, 거스\xb7랄로가 주고받는 보이지 않는 상처를 가리킨다.","겉으로는 멀쩡해 보여도 속은 멍들어 있다는 이 표현이, 이 시즌 인물들의 공통 상태다. 드러나지 않는 상처가 가장 깊다는 것을, 두 색의 멍으로 이름 붙였다."],trivia:[{source:"팬덤 논의",text:"하워드가 지미를 찾아가 '네가 날 노리는 걸 안다'고 따지는 장면은, 희생자가 될 인물이 작전의 존재를 먼저 간파한다는 점에서 긴장을 끌어올린다."},{source:"제작 배경",text:"거스와 랄로가 직접 마주치지 않으면서도 서로를 조여 가는 '보이지 않는 결투' 구조는, 폭력을 아끼며 긴장을 쌓는 이 시리즈의 특기를 보여 준다."}],quotes:[{speaker:"하워드 햄린",en:"You two are soulmates in the way you destroy everything in your path.",ko:"너희 둘은 앞을 가로막는 걸 전부 부순다는 점에서 천생연분이야.",context:"작전을 간파한 하워드가 지미와 킴에게 던지는 통찰이다. 두 사람을 가장 정확히 꿰뚫은 이 말이, 곧 그에게 닥칠 비극을 더 아프게 만든다."}],sketches:[{motif:"courthouse",caption:"작전을 간파한 하워드",slot:"plot"},{motif:"cocobolo-desk",caption:"흔들리는 HHM의 책상",slot:"meaning"}]},{id:"s06e06",season:6,episode:6,titleEn:"Axe and Grind",titleKo:"도끼를 갈며",airDate:"2022-05-16",writers:"어리얼 러바인",director:"지안카를로 에스포지토",logline:"어린 킴의 과거가 드러나고, 작전이 마지막 단계로 돌입한다.",plot:["회상 속 어린 킴이 등장한다. 가게에서 물건을 훔치다 들킨 그녀를, 어머니는 거짓말로 빼낸다. 규칙을 비웃는 어머니의 방식에 분노하면서도, 어린 킴은 그 영리한 거짓말에 매혹된다. 킴이 왜 '올바름'과 '교묘한 속임수'에 동시에 끌리는지, 그 뿌리가 드러난다.","하워드를 무너뜨릴 작전이 마지막 단계로 들어간다. 지미와 킴은 샌드파이퍼 조정 자리에서 하워드를 결정적으로 망신 줄 함정을 완성한다. 작은 소품 하나까지 치밀하게 맞춘, 그들 인생 최대의 공연이다.","그러나 마지막 순간 예기치 못한 변수가 끼어든다. 킴은 작전을 미루거나 멈출 기회 앞에서, 끝내 '계속한다'를 택한다. 멈출 수 있었던 바로 그 지점을 지나치는 선택이, 이후 모든 비극의 분기점이 된다."],titleMeaning:["'도끼를 갈며(Axe and Grind)'는 'have an axe to grind', 즉 개인적 원한이나 속셈을 품고 벼른다는 관용구를 비튼 제목이다. 하워드를 겨눈 지미와 킴의 오랜 벼름을 가리킨다.","도끼를 간다는 이미지는, 오래 준비한 일격이 임박했음을 알린다. 그러나 날을 세울수록 베이는 것이 상대만은 아니라는 것—벼른 도끼가 결국 누구에게 떨어질지, 제목은 서늘하게 유보한다."],trivia:[{source:"제작 배경",text:"이 회차는 거스 역의 지안카를로 에스포지토가 연출을 맡았다. 주연 배우가 감독으로 참여한 두 번째 사례다."},{source:"팬덤 논의",text:"어린 킴의 좀도둑질 회상은, 그녀가 '규칙을 비웃는 쾌감'에 끌리는 성향이 어디서 왔는지를 설명한다. 킴을 이해하는 핵심 열쇠로 자주 인용된다."},{source:"팬 커뮤니티",text:"킴이 작전을 멈출 수 있었던 순간에 '계속한다'를 택하는 장면은, 다음 회차의 비극을 피할 수 있었던 마지막 분기점으로 재시청 때 거듭 복기된다."}],quotes:[{speaker:"킴 웩슬러",en:"We're going ahead.",ko:"그대로 진행해.",context:"멈출 수 있었던 바로 그 순간, 킴이 작전을 밀어붙이기로 하는 말이다. 이 짧은 결정이 하워드의 운명을, 그리고 두 사람의 삶을 돌이킬 수 없이 바꾼다."}],sketches:[{motif:"legal-pad",caption:"어린 킴과 작전의 완성",slot:"plot"},{motif:"hummel-figurine",caption:"치밀하게 맞춘 소품들",slot:"trivia"}]},{id:"s06e07",season:6,episode:7,titleEn:"Plan and Execution",titleKo:"계획과 실행",airDate:"2022-05-23",writers:"토머스 슈나우즈",director:"토머스 슈나우즈",logline:"작전이 완벽하게 실행된다. 그리고 밤이 오자, 모든 것이 무너진다.",plot:["샌드파이퍼 조정 자리에서 작전이 완벽하게 실행된다. 하워드는 약물에 취해 공개적으로 무너진 것처럼 보이고, 그의 평판은 조작된 증거 앞에서 산산조각 난다. 지미와 킴의 공연은 흠잡을 데 없이 성공한다.","그날 밤, 모든 것을 잃은 하워드가 진실을 깨닫고 지미와 킴의 아파트로 찾아온다. 그는 두 사람이 자신에게 무슨 짓을 했는지 정확히 짚어 내며, 처음으로 그들을 도덕적으로 압도한다. 성공의 승리감이 수치로 바뀌는 순간이다.","그 대화가 끝나기 전, 초대받지 않은 손님이 문을 열고 들어온다. 랄로 살라망카다. 그는 하워드를 '방해물'로 여겨, 아무런 망설임 없이 그 자리에서 쏘아 죽인다. 지미와 킴의 장난이 끝내 무고한 사람의 죽음으로 번지는, 중반부를 닫는 충격이다."],titleMeaning:["'계획과 실행(Plan and Execution)'은 완벽하게 설계되고 완벽하게 수행된 작전을 가리킨다. 지미와 킴의 공연은 '계획'대로 '실행'됐다.","그러나 'execution'은 '처형'이라는 뜻도 품는다. 완벽한 실행의 끝에 놓인 것이 하워드의 처형이라는 점에서, 제목은 성공과 살인을 한 단어로 겹쳐 쓴다. 가장 잘 짜인 계획이 가장 끔찍한 결과를 낳는다."],trivia:[{source:"팬덤 논의",text:"하워드의 죽음은 시리즈에서 가장 충격적인 반전으로 꼽힌다. 완벽한 작전의 승리가 무고한 죽음으로 뒤집히는 구조가 핵심이다."},{source:"제작 배경",text:"중반부 피날레로 편성된 이 회차는, 완벽한 성공의 한가운데에 가장 잔혹한 결말을 놓아 시즌 후반부의 모든 죄책감과 붕괴의 방아쇠가 된다."}],redditQuestions:[{question:"하워드는 왜 죽었나? 작전과 무슨 상관인가?",answer:"직접적인 인과는 아니다. 하워드는 작전을 간파하고 그날 밤 지미\xb7킴의 아파트로 따지러 왔을 뿐이다. 하필 그때 랄로가 거스 관련 일로 그 집에 들이닥쳤고, 하워드를 '성가신 목격자'로 보고 즉석에서 쏴 죽인다. 지미와 킴의 장난이 하워드를 '엉뚱한 시간, 엉뚱한 장소'로 몰아넣은 것이 비극의 연결 고리다."}],quotes:[{speaker:"하워드 햄린",en:"You two... have a great life together.",ko:"너희 둘이, 평생 잘 먹고 잘 살아라.",context:"작전을 간파한 하워드가 두 사람에게 던지는 마지막 말에 가깝다. 분노와 경멸이 담긴 이 작별 인사 직후 랄로의 총이 그를 덮치면서, 말의 무게가 끔찍하게 뒤집힌다."}],reception:["하워드의 죽음과 랄로의 등장을 결합한 중반부 피날레로, 시즌 6에서 가장 충격적이고 자주 언급되는 회차다. (개별 매체 점수\xb7순위는 이 사이트에서 대조하지 않았다.)"],sketches:[{motif:"matchbook",caption:"완벽하게 실행된 공연",slot:"plot"},{motif:"courthouse",caption:"조정 자리의 함정",slot:"meaning"}]},{id:"s06e08",season:6,episode:8,titleEn:"Point and Shoot",titleKo:"조준과 발사",airDate:"2022-07-11",writers:"고든 스미스",director:"빈스 길리건",logline:"랄로가 부부를 장기말로 쓴다. 어둠 속 실험실에서 모든 것이 끝난다.",plot:["하워드의 시신 앞에서, 랄로는 지미와 킴을 자기 계획의 장기말로 쓴다. 그는 거스를 죽이기 위한 양동작전으로 킴을 어딘가로 보내고, 사울을 인질처럼 붙잡아 둔다. 두 사람의 장난이 이제 생사의 판 한복판으로 끌려 들어간다.","랄로는 증거를 찍기 위해 거스의 극비 실험실 공사 현장으로 향한다. 그러나 거스는 그를 기다리고 있었다. 전원이 꺼진 칠흑 같은 지하에서, 거스는 미리 숨겨 둔 총으로 어둠 속의 랄로를 쏜다. 오래 이어진 두 사람의 수 싸움이, 빛 하나 없는 구덩이에서 끝난다.","랄로와 하워드, 두 사람의 시신은 아무도 모르게 실험실 콘크리트 아래 묻힌다. 거스는 적을 제거했고, 사울과 킴은 살아남았다. 그러나 그들이 치른 대가—하워드의 죽음과 그 은폐—는 두 사람의 삶을 안에서부터 무너뜨리기 시작한다."],titleMeaning:["'조준과 발사(Point and Shoot)'는 겨누고 쏘는 가장 단순한 동작이다. 랄로가 하워드를 쏜 방식이자, 거스가 어둠 속 랄로를 쏜 방식이다.","복잡한 계략의 끝에 남는 것은 결국 '겨누고 쏘는' 단순한 행위다. 온갖 설계와 수 싸움도 마지막엔 한 발의 총알로 정리된다는 것—제목은 이 세계의 폭력이 가진 잔혹한 단순함을 가리킨다."],trivia:[{source:"제작 배경",text:"거스가 전원을 끄고 어둠 속에서 랄로를 쏘는 지하 실험실 대결은, 《브레이킹 배드》의 거대한 실험실이 완성되기 전 그 구덩이에서 벌어진 사건이라는 점에서 두 시리즈를 잇는다."},{source:"팬덤 논의",text:"랄로와 하워드가 실험실 아래 함께 묻히는 결말은, 《브레이킹 배드》의 그 실험실이 사실 두 사람의 무덤 위에 세워졌음을 뜻한다. 재시청 때 원작의 공간이 다르게 보이게 만드는 설정이다."}],quotes:[{speaker:"거스 프링",en:"...",ko:"(침묵 속의 한 발)",context:"거스가 어둠 속에서 랄로를 쏘는 이 대결은 거의 대사 없이 전개된다. 빛과 소리를 지운 연출이, 오래 이어진 두 사람의 긴장을 한순간의 침묵으로 끝맺는다."}],sketches:[{motif:"superlab-dig",caption:"어둠 속 지하의 대결",slot:"plot"},{motif:"well-ladder",caption:"콘크리트 아래 묻힌 것",slot:"meaning"}]},{id:"s06e09",season:6,episode:9,titleEn:"Fun and Games",titleKo:"재미와 놀이",airDate:"2022-07-18",writers:"앤 처키스",director:"마이클 모리스",logline:"죄책감이 두 사람을 갈라놓는다. 그리고 사울 굿맨의 시대가 열린다.",plot:["거스와 마이크가 하워드의 죽음을 완벽하게 은폐한다. 겉으로 지미와 킴의 삶은 아무 일 없던 것처럼 돌아가지만, 두 사람은 자신들이 무고한 사람을 죽음으로 몰았다는 사실을 견디지 못한다. 죄책감이 두 사람 사이를 소리 없이 벌려 놓는다.","킴은 마침내 가장 고통스러운 결론에 이른다. 그녀는 변호사 자격을 스스로 내려놓고, 지미를 떠난다. 두 사람이 함께 있는 한 서로를 더 나쁜 사람으로 만들 뿐이라는 것—사랑하기 때문에 떠난다는 가장 아픈 역설이다. 지미는 그녀를 붙잡지 못한다.","그리고 시간이 훌쩍 뛴다. 화면은 완전한 '사울 굿맨'의 시대로 넘어간다. 요란한 사무실, 과장된 광고, 콧수염과 금붙이. 킴을 잃은 자리에서, 지미 맥길의 마지막 흔적마저 지워지고 사울 굿맨만 남는다."],titleMeaning:["'재미와 놀이(Fun and Games)'는 지미와 킴이 서로를 '놀이'처럼 여기며 벌여 온 모든 사기와 작전을 가리킨다. 빅토르와 지젤에서 시작된 그 놀이의 끝이다.","그러나 'all fun and games until...'이라는 관용구가 말하듯, 재미는 누군가 다칠 때 끝난다. 하워드의 죽음으로 놀이는 끝났고, 남은 것은 상실뿐이다. 가장 즐거웠던 관계의 이름을 가장 슬픈 결말에 붙인, 잔인한 제목이다."],trivia:[{source:"팬덤 논의",text:"킴이 지미를 떠나는 장면은 시리즈에서 가장 가슴 아픈 이별로 꼽힌다. '함께 있으면 서로를 더 나쁘게 만든다'는 이유가, 두 사람 관계의 핵심을 비극적으로 요약한다."},{source:"제작 배경",text:"킴이 떠난 직후 완전한 '사울 굿맨'으로 시간이 뛰는 구성은, 지미 맥길이라는 인물이 사실상 이 회차에서 끝난다는 것을 보여 준다. 사울은 킴을 잃은 자리에 들어선 껍데기다."}],redditQuestions:[{question:"킴은 왜 지미를 떠났나?",answer:"하워드의 죽음에 자신들의 작전이 연결돼 있다는 죄책감 때문이다. 킴은 자신과 지미가 함께 있는 한 서로를 더 나쁜 사람으로 밀어붙인다는 것을 깨닫고, 변호사 자격까지 내려놓은 뒤 그를 떠난다. 미워서가 아니라, 사랑하기 때문에 떠나는 이별이다."}],quotes:[{speaker:"킴 웩슬러",en:"I love you too. But so what?",ko:"나도 널 사랑해. 그런데 그게 무슨 소용이야?",context:"지미를 떠나며 킴이 남기는 말이다. 사랑이 두 사람을 더 나은 사람으로 만들지 못한다는 뼈아픈 자각이 담겨 있다. 시리즈에서 가장 자주 인용되는 이별의 대사다."}],reception:["킴의 이별과 사울 시대로의 전환을 담아 시즌 6 후반부의 정서적 분기점으로 꼽힌다. 리아 시혼의 연기가 특히 호평받았다. (개별 매체 점수\xb7순위는 이 사이트에서 대조하지 않았다.)"],sketches:[{motif:"parking-garage",caption:"사랑하기에 떠나는 길",slot:"plot"},{motif:"worlds-best-mug",caption:"사울 굿맨만 남은 자리",slot:"meaning"}]},{id:"s06e10",season:6,episode:10,titleEn:"Nippy",titleKo:"니피",airDate:"2022-07-25",writers:"앨리슨 탯록",director:"미셸 매클래런",logline:"흑백의 '진'이 다시 사기꾼이 된다. 쇼핑몰에서 벌이는 완벽한 한탕.",plot:["흑백의 오마하. 숨어 살던 '진 터카빅'의 정체를 눈치챈 택시기사 제프가 그를 협박하려 하자, 진은 그를 꺾는 대신 자기편으로 끌어들인다. 그리고 오래 잠들어 있던 사기꾼의 본능을 되살린다.","진의 계획은 백화점 창고를 터는 치밀한 작전이다. 매일 밤 경비원과 친해지며 '추운 날씨'와 시나몬 롤로 그의 경계를 녹이고, 경비가 자리를 비우는 정확한 시간을 재서 제프가 물건을 빼내게 한다. 변호사도 아니고 사울도 아닌, 가장 순수한 형태의 '슬리핑 지미'가 돌아온다.","작전은 완벽하게 성공한다. 그러나 성공의 순간, 진의 얼굴에 떠오르는 것은 기쁨이 아니다. 숨어 살기로 한 사람이 다시 판을 벌이고 말았다는 것—멈출 수 있었던 자리에서 또 한 번 미끄러졌다는 자각이다."],titleMeaning:["'니피(Nippy)'는 '쌀쌀한, 추운'이라는 뜻의 일상어다. 진이 경비원과 친해지려 매일 건네는 날씨 이야기, 그 사소한 잡담의 소품이다.","거창한 범죄를 가장 평범한 날씨 이야기로 푸는 것이 이 회차의 핵심이다. '춥네요' 한마디로 사람의 경계를 녹이는 기술—그 소름 끼치는 평범함이, 진 안에 여전히 살아 있는 사기꾼을 드러낸다."],trivia:[{source:"제작 배경",text:"오마하의 '진' 시간선은 시리즈 내내 흑백으로 처리되어, 색을 가진 과거와 구분된다. 이 회차는 그 흑백의 현재를 거의 한 편 통째로 다룬 드문 사례다."},{source:"팬덤 논의",text:"날씨 잡담과 시나몬 롤로 경비원의 경계를 녹이는 수법은, 사울의 요란함도 지미의 입담도 아닌 '순수한 슬리핑 지미'의 귀환으로 읽힌다. 숨어 살기로 한 사람이 끝내 본성을 못 버린다는 것이 핵심이다."}],quotes:[{speaker:"진 터카빅",en:"It's nippy out there.",ko:"밖이 좀 쌀쌀하네요.",context:"경비원의 경계를 녹이려 진이 매일 건네는 날씨 인사다. 가장 평범한 잡담이 치밀한 사기의 입구라는 점에서, 이 한마디가 진 안에 살아 있는 사기꾼을 드러낸다."}],sketches:[{motif:"cinnabon",caption:"시나몬 롤로 녹이는 경계",slot:"plot"},{motif:"gene-glasses",caption:"진 터카빅의 가면",slot:"trivia"}]},{id:"s06e11",season:6,episode:11,titleEn:"Breaking Bad",titleKo:"브레이킹 배드",airDate:"2022-08-01",writers:"토머스 슈나우즈",director:"토머스 슈나우즈",logline:"원작의 시간선이 돌아오고, 진의 오마하 사기는 선을 넘기 시작한다.",plot:["회상은 《브레이킹 배드》의 한복판으로 돌아간다. 사울 굿맨이 월터 화이트, 제시 핑크먼과 얽혔던 시절—사막으로 끌려가던 그 밤의 뒷이야기가 새로 채워진다. 익숙한 장면의 틈을 메우며, 두 시리즈가 하나의 시간선으로 이어진다.","흑백의 오마하에서 진의 사기는 점점 위험해진다. 백화점 한탕에 만족하지 못한 그는, 병든 사람들의 신분을 훔치는 더 악질적인 범죄로 손을 뻗는다. 숨어 살려던 사람이 이제 적극적으로 피해자를 만든다.","제프의 어머니 매리언은 아들과 어울리는 '진'을 어딘가 미심쩍게 여긴다. 평범한 노부인의 직감이, 겹겹이 지운 신분 위에 세워진 진의 삶에 첫 번째 금을 낸다."],titleMeaning:["제목 '브레이킹 배드'는 원작 시리즈의 이름을 그대로 가져온 것이다. 두 시리즈가 시간선으로 완전히 포개지는 이 회차에, 원작의 제목을 빌려 그 교차를 명시한다.","동시에 'break bad'는 '타락하다\xb7나쁜 길로 빠지다'라는 뜻이다. 오마하의 진이 숨어 살기를 포기하고 다시 '나빠지는' 이 회차의 내용과, 원작의 제목이 정확히 겹친다. 두 이야기가 같은 단어 아래 하나로 묶인다."],trivia:[{source:"제작 배경",text:"이 회차는 《브레이킹 배드》의 주요 인물들이 회상으로 돌아와, 원작의 익숙한 장면 사이사이를 새로 메운다. 두 시리즈를 하나의 연속된 세계로 봉합하는 장치다."},{source:"팬덤 논의",text:"진이 병자의 신분을 훔치는 쪽으로 범죄를 키우는 전개는, 그가 '숨어 사는 피해자'에서 '적극적인 가해자'로 다시 돌아가고 있음을 보여 준다. 매리언의 의심이 그 추락에 제동을 건다."}],quotes:[{speaker:"진 터카빅",en:"I was always like this.",ko:"난 늘 이런 사람이었어.",context:"숨어 살기로 했던 사람이 다시 범죄로 돌아가며 스스로에게 하는 체념 섞인 고백이다. 사울도 지미도 진도, 결국 같은 사람이었다는 자각이 담겨 있다."}],sketches:[{motif:"desert-horizon",caption:"원작으로 돌아간 사막",slot:"plot"},{motif:"vacuum-shop",caption:"지운 신분 위의 삶",slot:"meaning"}]},{id:"s06e12",season:6,episode:12,titleEn:"Waterworks",titleKo:"눈물",airDate:"2022-08-08",writers:"빈스 길리건",director:"빈스 길리건",logline:"킴이 수년의 침묵을 깨고 진실을 말한다. 진은 벼랑 끝으로 치닫는다.",plot:["흑백의 현재. 킴 웩슬러는 지미를 떠난 뒤, 플로리다에서 감정을 지운 듯 밋밋한 일상을 산다. 그러나 하워드의 죽음에 대한 침묵이 그녀를 안에서 갉아먹어 왔다. 마침내 킴은 당국에 모든 것을 자백하고, 하워드의 미망인 셰릴에게도 진실을 털어놓는다.","앨버커키를 떠나는 버스 안에서, 오래 참아 온 킴이 끝내 소리 죽여 운다. 수년간 억눌렀던 죄책감과 상실이 한꺼번에 터지는, 대사 없는 긴 울음이다. 진실을 말한 대가로 그녀는 평온 대신 정직을 택한다.","같은 시간, 오마하의 진은 신분 도용 범죄를 이어 가다 매리언에게 정체를 들킨다. 인터넷 검색 한 번으로 '진=사울'이 드러나자, 궁지에 몰린 진은 순간 노부인마저 위협하려 한다. 매리언이 비상 경보를 울리고, 진은 쫓기는 몸이 된다. 지운 신분이 마침내 무너지는 순간이다."],titleMeaning:["'눈물(Waterworks)'은 울음을 뜻하는 구어다. 버스 안에서 터지는 킴의 긴 울음을 직접 가리킨다.","그러나 'waterworks'는 수도 설비, 즉 오래 막아 두었던 물이 터져 나오는 이미지이기도 하다. 수년간 감정을 틀어막고 살던 킴에게서 모든 것이 한꺼번에 쏟아지는 순간을, 봇물이 터지듯 이름 붙였다."],trivia:[{source:"제작 배경",text:"킴이 버스에서 오래 우는 장면은 대사 없이 길게 이어지며, 리아 시혼의 연기로 수년치 감정을 한 번에 쏟아 낸다. 시리즈의 가장 감정적인 장면 중 하나로 꼽힌다."},{source:"팬덤 논의",text:"매리언이 인터넷 검색으로 '진=사울'을 밝혀내는 장면은, 아무리 신분을 지워도 디지털 시대에는 완전히 숨을 수 없다는 점을 보여 준다. 노부인의 평범한 검색이 사울의 제국을 무너뜨린다."}],quotes:[{speaker:"매리언",en:"I trusted you.",ko:"난 널 믿었어.",context:"진의 정체를 알아챈 매리언이 던지는 말이다. 사울이 평생 이용해 온 '사람의 신뢰'가, 마지막엔 가장 평범한 사람의 입에서 가장 아픈 배신의 증언이 되어 돌아온다."}],reception:["킴의 자백과 버스 안 울음을 중심으로 시즌 6 종반의 정점으로 꼽힌다. 리아 시혼의 연기가 특히 반복적으로 호평받았다. (개별 매체 점수\xb7순위는 이 사이트에서 대조하지 않았다.)"],sketches:[{motif:"gene-glasses",caption:"무너지는 진의 가면",slot:"plot"},{motif:"legal-pad",caption:"침묵을 깬 자백",slot:"meaning"}]},{id:"s06e13",season:6,episode:13,titleEn:"Saul Gone",titleKo:"사울의 끝",airDate:"2022-08-15",writers:"피터 굴드",director:"피터 굴드",logline:"모든 것이 끝난 자리에서, 사울은 마지막으로 '지미 맥길'을 택한다.",plot:["진은 결국 체포된다. 사울 굿맨으로서 그는 특유의 수완으로 검찰과 거래해 형량을 7년까지 깎아 낸다. 평생처럼, 그는 또 한 번 '빠져나가는' 데 성공할 참이다. 거래 조건에는 킴이 하워드 사건으로 민사 책임을 질 위험까지 얽혀 있다.","그러나 법정에서 킴이 진실을 모두 떠안았다는 것을 알게 된 그는, 마지막 순간 모든 것을 뒤집는다. 유리한 거래를 제 손으로 폭파하고, 판사와 배심원 앞에서 자신이 저지른 모든 일을—월터 화이트를 도운 것부터 형 척에게 한 일까지—'지미 맥길'의 이름으로 낱낱이 자백한다. 7년이 86년이 된다. 평생 속여 온 그가, 마지막에 처음으로 진실을 택한다.","교도소. 면회실에서 지미와 킴이 다시 마주 앉는다. 두 사람은 말없이 담배 한 대를 나눠 피운다. 빅토르와 지젤의 시절처럼. 흑백의 화면 속에서, 변호사도 사기꾼도 아닌 두 사람이 마지막으로 눈을 맞춘다. 사울은 끝났고, 지미 맥길이 남는다."],titleMeaning:["'사울의 끝(Saul Gone)'은 발음하면 'Saul Goodman'과 겹쳐 들린다. 평생을 지배한 가면 '사울 굿맨'이 마침내 사라진다는 뜻이다.","'s'all good, man'으로 태어난 이름이 'Saul gone'으로 끝난다. 농담으로 시작한 가면이 농담처럼 벗겨지는, 이름 자체로 완결되는 제목이다. 사울이 사라진 자리에 남는 것은 86년의 형기와, 처음으로 정직해진 지미 맥길이다."],trivia:[{source:"제작 배경",text:"회차 곳곳에 '타임머신이 있다면 언제로 돌아가겠나'라는 질문이 반복된다. 마이크\xb7월터\xb7척과 각각 나눈 이 대화들이, 후회와 책임이라는 시리즈의 주제를 마지막에 하나로 묶는다."},{source:"팬덤 논의",text:"유리한 거래를 스스로 폭파하고 'James McGill'로서 전부 자백하는 결말은, 평생 빠져나가기만 하던 인물이 처음으로 책임을 택하는 순간으로 꼽힌다. 교도소 면회실의 담배 장면이 시리즈의 마지막 이미지다."},{source:"수상 기록",text:"《베터 콜 사울》은 여섯 시즌에 걸쳐 에미상 후보에 53회 올랐으나 단 한 번도 수상하지 못했다. 이는 '수상 없는 최다 후보' 기록으로, 2위 《뉴하트》(25회)를 크게 앞선다."}],redditQuestions:[{question:"사울은 왜 유리한 거래를 스스로 걷어찼나?",answer:"법정에서 킴이 하워드 사건의 진실을 모두 떠안고 책임지려 한다는 것을 알았기 때문이다. 7년짜리 거래로 혼자 빠져나가는 대신, 그는 자신이 저지른 모든 일을 'James McGill'의 이름으로 낱낱이 자백하기로 한다. 형량은 86년으로 뛰지만, 평생 처음으로 그는 빠져나가는 대신 책임을 택한다."},{question:"마지막 흑백 장면의 담배는 무슨 의미인가?",answer:"교도소 면회실에서 지미와 킴이 말없이 담배 한 대를 나눠 피운다. 두 사람이 연인이자 공범으로 함께하던 시절('빅토르와 지젤')의 몸짓이다. 사울도 변호사도 사라진 자리에서, 두 사람이 마지막으로 같은 사람으로 마주한다는 것을 대사 없이 보여 주는 결말이다."}],quotes:[{speaker:"지미 맥길",en:"The name's McGill. I'm James McGill.",ko:"이름은 맥길이야. 나는 제임스 맥길이다.",context:"법정에서 유리한 거래를 스스로 폭파하고, 자신의 본명으로 모든 죄를 자백하기 시작하는 순간이다. '사울 굿맨'이라는 가면을 벗고 처음으로 진짜 이름을 택하는, 시리즈를 닫는 선언이다."}],reception:["시리즈 피날레로서 '가면을 벗고 책임을 택한 결말'이라는 점에서 널리 호평받았고, 많은 매체가 최고의 시리즈 종결 중 하나로 꼽았다. 그럼에도 《베터 콜 사울》은 통산 53회의 에미상 후보에 오르고도 한 번도 수상하지 못해, '수상 없는 최다 후보'라는 기록을 남겼다. (개별 매체 점수\xb7순위는 이 사이트에서 대조하지 않았다.)"],sketches:[{motif:"courthouse",caption:"거래를 폭파한 법정",slot:"plot"},{motif:"worlds-best-mug",caption:"세계 2위를 버리고 택한 이름",slot:"meaning"}]}]}],H=N.flatMap(t=>t.episodes),E=new Map(H.map(t=>[t.id,t]));function S(t){return t?E.get(t):void 0}function C(t){return"S".concat(String(t.season).padStart(2,"0"),"E").concat(String(t.episode).padStart(2,"0"))}H.length;let q="honeymath.gbe@gmail.com";async function D(t){try{if(navigator.clipboard&&window.isSecureContext)return await navigator.clipboard.writeText(t),!0}catch(t){}try{let e=document.createElement("textarea");e.value=t,e.setAttribute("readonly",""),e.style.position="fixed",e.style.opacity="0",document.body.appendChild(e),e.select();let s=document.execCommand("copy");return document.body.removeChild(e),s}catch(t){return!1}}function K(t){let{selectedId:e,onSelect:s,onHome:i,className:r,instanceId:n="rail"}=t,{toast:d}=(0,L.pm)(),[h,p]=a.useState(!1),[m,f]=a.useState(["season-1"]);a.useEffect(()=>{if(!e)return;let t="season-".concat(Number(e.slice(1,3)));f(e=>e.includes(t)?e:[...e,t])},[e]);let k=async()=>{await D(q)?(p(!0),window.setTimeout(()=>p(!1),1800),d({title:"메일 주소가 복사되었습니다."})):d({title:"복사에 실패했습니다.",description:q,variant:"destructive"})};return(0,o.jsxs)("aside",{className:(0,c.cn)("paper-grain flex h-full flex-col border-r border-border bg-paper",r),children:[(0,o.jsxs)("button",{type:"button",onClick:i,classNa
